  // ===== AI 债务助手（Premium）=====
  // 报告=一次性生成、问答=多轮对话，都走 aiAdvisor 云函数（服务端调 CloudBase 大模型）。
  // 结构化数据在客户端算好再上传（条目少、token 便宜），云函数不碰债务原始数组。
  //
  // #aiScreen+#aiHistorySheet已经整体搬进React(第十一步，React迁移收尾)——见
  // react/src/sheets/AiScreen.tsx。currentAiConvId/aiBusy/aiConvId/aiRender/castAiWand/
  // showAiWelcome/hideAiWelcome/appendAiMsg/startNewAiConversation/loadAiConversation/
  // openAiScreen/closeAiScreen/aiComposeAndSend/aiSendFromInput/openAiHistorySheet/
  // closeAiHistorySheet/renderAiHistoryList全部整个删除，逻辑原样复刻进了AiScreen.tsx
  // (魔法棒入场动效用useEffect+ref+CSS class重现同一套技巧)。findAiConv/bumpAiConvTop
  // 继续是calc.js全局纯函数，React直接window.findAiConv(...)/window.bumpAiConvTop(...)
  // 调用，不复制逻辑。
  // buildAiSummary()/callAiAdvisor()原样保留——它们依赖ensureCbAuthReady/
  // cbApp().callFunction这套认证会话状态，不可移植，是这一步__azBridge唯一新增的桥接函数。
  // 2026-08-04修：原来只传"月供"这一个笼统数字，先息后本/等本等费这类每期金额不同的贷款，
  // AI看不到后面某期本金会跳涨，会把"当前这一期"误当成"每一期都一样"，答出跟真实计划表
  // 矛盾的结论(真机报的bug：test11明明27年5月才开始还本金，AI坚持说没有这笔债务)。
  // 改成把每笔债务的完整还款计划表(逐期日期/金额/本金/利息/是否已还)+计息方式都传过去，
  // 这个AI是随问随答的，情报不全比传多一点更容易出错。
  function methodLabel(kind) {
    return { amort: "等额本息", equalprincipal: "等额本金", equalfee: "等本等费",
      interestfirst: "先息后本", custom: "自定义" }[kind] || "未知";
  }
  // compact=true 时把**已还**期次压成一行汇总、只逐期列出未还的那些（2026-08-04加）。
  // 为什么要分两种模式：这份JSON有两个消费者，成本结构完全相反——
  //   ①云函数(callAiAdvisor)：token我们自己付费，且**每次提问都重发一遍**整份数据，
  //     一个12笔债务×24期的用户光计划表就约1.7万字符。已还期次对"接下来该怎么还"
  //     没有推理价值(累计已还本金/利息两个字段已经把结果表达完了)，压掉省的是真金白银。
  //   ②一键复制给外部AI(buildCopyPrompt)：用户自己粘去豆包/文心，**我们零成本**，
  //     压缩只会白白降低对方的回答质量，所以那条路径走全量。
  // 未还期次永远逐期全发——test11那种"先还利息、某月起本金跳涨"的结构必须让AI看见，
  // 这正是当初加完整计划表要解决的问题，不能压。
  function buildAiSummary(compact) {
    var data = computeReportData(debts);
    var list = debts.filter(function (d) { return (+d.balance || 0) > 0.005; }).map(function (d) {
      var plan = d.plan || [];
      var rows = compact ? plan.filter(function (r) { return !r.paid; }) : plan;
      var o = { 名称: d.name || "未命名", 类型: d.type || "其他", 债主: d.funder || "",
        开始日期: d.opened || "", 备注: d.notes || "",
        计息方式: d.gen && d.gen.kind ? methodLabel(d.gen.kind) : "未知",
        剩余本金: r2(d.balance), 年化利率百分比: r2(d.rate), 月供: r2(d.monthly),
        剩余期数: d.terms || 0, 总期数: d.totalTerms || 0, 一次性还清: !!d.oneTime,
        累计已还本金: r2(d.paidPrincipal), 累计已还利息: r2(d.paidInterest) };
      if (compact) {
        var paid = plan.filter(function (r) { return r.paid; });
        o.已还期次汇总 = { 期数: paid.length,
          最后一期日期: paid.length ? paid[paid.length - 1].date : "" };
        o.还款计划说明 = "下面只列未还期次；已还的见上面「已还期次汇总」和累计已还本金/利息";
      }
      o.还款计划 = rows.map(function (r) {
        return { 日期: r.date, 金额: r2(r.amount), 本金: r2(r.principal), 利息: r2(r.interest), 已还: !!r.paid };
      });
      return o;
    });
    return { 在还总负债: data.totalBalance, 加权平均年化利率百分比: r2(data.avgRate),
      预计全部还清日期: data.payoffDate || "未知", 债务清单: list };
  }
  // 调云函数：mode=report 无 question、不需要 history；mode=chat 带 question + history
  // （history 是这次提问之前的上下文，不含这次提问本身，服务端会把 question 接在最后）。
  // summary走**压缩版**(buildAiSummary(true))——这条路径的token我们自己付费、且每次提问
  // 都重发一遍，见上面buildAiSummary的注释。一键复制那条路径不走这里，用的是全量版。
  //
  // 返回 {text, quota}：quota是服务端权威的本月用量({month,used,limit})，React拿它更新
  // 本地缓存(AI_USAGE_KEY)供"还剩N次"显示和下次调用前的快速拦截。**额度真正的把关在
  // 服务端**，本地缓存只是快路径+展示，被清掉/篡改最多让客户端多打一次必然被拒的请求。
  // 超额时服务端返回 code:"QUOTA_EXCEEDED"，这里把它挂到Error上，React据此弹额度说明
  // 弹窗而不是当成普通报错。
  function callAiAdvisor(mode, question, history) {
    if (!account) return Promise.reject(cloudLoginRequired("AI 债务助手"));
    var summary = buildAiSummary(true);
    if (!summary.债务清单.length) return Promise.reject(new Error("没有在还债务，先添加一笔再来分析"));
    return ensureCbAuthReady().then(function () {
      return cbApp().callFunction({ name: "aiAdvisor", data: { mode: mode, summary: summary, question: question || "", history: history || [] } });
    }).then(function (res) {
      var r = res && res.result;
      if (!r || !r.ok) {
        var err = new Error((r && r.error) || "AI 分析失败，请稍后再试");
        if (r && r.code) err.code = r.code;
        if (r && r.quota) err.quota = r.quota;
        throw err;
      }
      return { text: r.text || "", quota: r.quota || null };
    });
  }

  // ===== AI 识图录入债务 =====
  // React 管选图和草稿编辑；这里仅保留 CloudBase 登录会话、临时图片上传与云函数调用。
  // 一组多图共用同一个 idempotencyKey，服务端成功生成草稿才计一次额度。
  function aiDebtImportCall(data) {
    if (!account) return Promise.reject(cloudLoginRequired("AI 识图录入"));
    return ensureCbAuthReady().then(function () {
      return cbApp().callFunction({ name: "aiDebtImport", data: data });
    }).then(function (res) {
      var result = res && res.result;
      if (!result || !result.ok) {
        var error = new Error((result && result.error) || "AI 识图录入失败，请稍后再试");
        if (result && result.code) error.code = result.code;
        throw error;
      }
      return result;
    });
  }
  function getAiDebtImportStatus(sessionId) {
    return aiDebtImportCall({ action: "status", sessionId: sessionId || "" }).then(function (result) {
      return { credits: result.credits, session: result.session || null };
    });
  }
  function safeAiImportName(name, index) {
    var raw = String(name || "image.jpg");
    var dot = raw.lastIndexOf(".");
    var ext = dot >= 0 ? raw.slice(dot).toLowerCase().replace(/[^.a-z0-9]/g, "") : ".jpg";
    if (!/^\.(jpg|jpeg|png|webp|heic|heif)$/.test(ext)) ext = ".jpg";
    return String(index + 1).padStart(2, "0") + "-" + Date.now().toString(36) + ext;
  }
  function aiImportImagePayload(file) {
    function rawPayload() {
      return blobToDataURL(file).then(function (dataURL) {
        var parts = String(dataURL).split(",");
        var encoded = parts[1] || "";
        if (encoded.length > 5 * 1024 * 1024) throw new Error("图片过大，请先裁剪或压缩后重试");
        return { base64: encoded, mime: file.type || "image/jpeg" };
      });
    }
    if (!/^image\/(jpeg|jpg|png|webp)$/i.test(file.type || "")) return rawPayload();
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var image = new Image();
      image.onload = function () {
        try {
          var maxSide = 2200;
          var scale = Math.min(1, maxSide / Math.max(image.naturalWidth || image.width, image.naturalHeight || image.height));
          var canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.round((image.naturalWidth || image.width) * scale));
          canvas.height = Math.max(1, Math.round((image.naturalHeight || image.height) * scale));
          var context = canvas.getContext("2d");
          if (!context) throw new Error("当前设备不支持图片处理");
          context.fillStyle = "#ffffff";
          context.fillRect(0, 0, canvas.width, canvas.height);
          context.drawImage(image, 0, 0, canvas.width, canvas.height);
          var dataURL = canvas.toDataURL("image/jpeg", 0.88);
          var parts = String(dataURL).split(",");
          var encoded = parts[1] || "";
          if (encoded.length > 5 * 1024 * 1024) throw new Error("图片过大，请先裁剪或压缩后重试");
          resolve({ base64: encoded, mime: "image/jpeg" });
        } catch (error) { reject(error); }
        URL.revokeObjectURL(url);
      };
      image.onerror = function () { URL.revokeObjectURL(url); rawPayload().then(resolve, reject); };
      image.src = url;
    });
  }
  function startAiDebtImport(files, idempotencyKey, onProgress) {
    if (!account) return Promise.reject(cloudLoginRequired("AI 识图录入"));
    if (!Array.isArray(files) || !files.length) return Promise.reject(new Error("请先选择还款计划截图"));
    var uploadedFileIds = [];
    var sessionId = "";
    return aiDebtImportCall({ action: "create", idempotencyKey: idempotencyKey }).then(function (created) {
      sessionId = created.sessionId;
      if ((created.status === "succeeded" || created.status === "accepted") && created.draft) return created;
      var chain = Promise.resolve();
      files.forEach(function (file, index) {
        chain = chain.then(function () {
          if (onProgress) onProgress("uploading", index, files.length);
          return aiImportImagePayload(file).then(function (payload) {
            return aiDebtImportCall({
              action: "upload", sessionId: sessionId, index: index,
              mime: payload.mime, base64: payload.base64,
            });
          }).then(function (result) {
            if (!result || !result.fileID) throw new Error("第 " + (index + 1) + " 张截图上传失败");
            uploadedFileIds.push(result.fileID);
            if (onProgress) onProgress("uploading", index + 1, files.length);
          });
        });
      });
      return chain.then(function () {
        if (onProgress) onProgress("recognizing", files.length, files.length);
        return aiDebtImportCall({ action: "recognize", sessionId: sessionId, fileIds: uploadedFileIds });
      });
    }).then(function (result) {
      return { sessionId: result.sessionId, status: result.status, draft: result.draft || null, credits: result.credits };
    }).catch(function (error) {
      if (sessionId) aiDebtImportCall({ action: "cleanup", sessionId: sessionId }).catch(function () {});
      throw error;
    });
  }
  function completeAiDebtImport(sessionId) {
    return aiDebtImportCall({ action: "complete", sessionId: sessionId }).then(function () { return true; }).catch(function (error) {
      console.error("[aiDebtImport] complete failed", error && error.message);
      return false;
    });
  }

  // escSvg 已搬进 www/js/calc.js。
  // PDF导出用的图表是独立的、颜色写死的浅色版SVG(不是把屏幕上那份主题化的SVG克隆去截图)——

  // 已还本金的"另付利息"子行、经常性月供的"不含一次性还清"子行），这段文字变成了给较真用户看的
  // 补充细则，不需要默认占位置。(这段折叠逻辑已经随"在还债务"页一起搬进React——见
  // react/src/debts/Summary.tsx——这里不再有#sumNoteToggle这个vanilla元素。)
  // 安卓WebView长按默认会触发系统级"上下文菜单"手势(震动反馈+可能弹出菜单)，
  // 这是独立于文字选中(user-select)的另一套原生手势，且一旦被判定触发，
  // 常常会把整个touch序列在原生层面"劫走"，导致我们自己长按拖拽逻辑收不到
  // 后续的pointermove。全局阻止contextmenu是让自定义长按手势能正常收到
  // 后续事件的关键一步，跟上面的user-select是两回事，缺一不可。
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  // cancelBtn/deleteBtn/debtForm submit/scrimEdit(编辑表单按钮+背景)、dEdit/dSale/dSimulate/
  // dSettle/dClose/scrimDetail(详情窗按钮+背景)、simBackBtn/simModeOnce/simModeRecurring/
  // simRunBtn(#simScreen)都已经不在vanilla DOM里了(react/src/sheets/下对应组件整个接管)，
  // 这里不再需要重复绑监听器——setDebt/deleteDebt/settleFull这几个函数改成通过
  // window.__azBridge桥接给React调用(见下面桥接对象定义)，payInstallment本来就已经桥接过。
  // 两个导出按钮的premium门禁+click逻辑已经原样搬进了React的ExportActions.tsx
  // (通过window.__azBridge.exportReportXlsx/exportReportPdf调用)，这两个id对应的
  // <button>也已经不在vanilla渲染的DOM里了，这里不再需要重复绑一份监听器。
  // "我的"tab整体React化后(react/src/mine/)，docsEntryBtn/backupEntryBtn同理不再在
  // vanilla DOM里，门禁+跳转逻辑原样复刻进了DataCards.tsx；docsBackBtn/uploadBtn/
  // uploadInput(#docsScreen)第九步后也整个不在vanilla DOM里了(react/src/sheets/
  // DocsScreen.tsx自己渲染返回箭头+文件选择器)；backupBackBtn/backupCreateBtn/
  // backupList(#backupScreen)第十步后同理，react/src/sheets/BackupScreen.tsx自己渲染
  // 返回箭头+创建按钮+列表；aiBackBtn/aiHistoryBtn/scrimAiHistory/aiNewConvBtn/
  // aiChipReport/ai-chip[data-q]/aiChatSendBtn/aiChatInput(#aiScreen+#aiHistorySheet)
  // 第十一步后同理，react/src/sheets/AiScreen.tsx自己渲染整套聊天界面+历史对话sheet，
  // 这里不再需要重复绑监听器。
  window.__handleBackButton = function () {
    // 抖动编辑模式(jiggleMode)现在是React状态(react/src/debts/DebtList.tsx)，vanilla这边
    // 看不到——React挂载时会把这个判断以window.__azDebtsBack的形式注册回来，同一个"最上层
    // 先关"优先级链，只是判断逻辑物理上不在这个文件里了。详见AGENTS.md"React 迁移"一节。
    if (window.__azDebtsBack && window.__azDebtsBack()) return true;
    if ($("modalScrim").classList.contains("open")) { closeModal(); return true; }
    if ($("loginGate").classList.contains("startup-splash")) return true;
    if ($("loginGate").classList.contains("open")) {
      if (!isIosPurchaseRuntime()) finishCloudLoginPrompt(false);
      return true;
    }
    // termsScreen/premiumScreen/accountScreen同理已经是React状态(react/src/sheets/
    // TermsScreen.tsx、PremiumScreen.tsx、AccountScreen.tsx，第七步)，vanilla看不到，
    // 判断逻辑物理上也不在这个文件里了——跟jiggleMode那条(window.__azDebtsBack)是同一个
    // 模式，位置沿用原来这三个subpage在DOM里的顺序。
    // privacyScreen/agreementScreen/aboutScreen(react/src/sheets/PrivacyScreen.tsx、
    // AgreementScreen.tsx、AboutScreen.tsx，2026-07-31新增)同理——privacy/agreement/terms
    // 都可能是从aboutScreen内部再打开的下一层，必须排在aboutScreen前面("最上层先关")。
    // ⚠️accountScreen这次也挪到了这里、排在aboutScreen前面(原来在下面premiumScreen那一段)——
    // AboutScreen新增了"账户与登录信息"入口会打开accountScreen，这条链原来的顺序会让
    // accountScreen开在about上层时，返回键却先把还在下面的aboutScreen关掉(Playwright验证
    // 时真实复现：点开关于我们→账户，按一次返回，账户还开着、关于我们却先没了，返回箭头
    // 一度以为点不动，实际是这条链的顺序错了，不是click handler本身的问题)。
    if (window.__azPrivacyScreenBack && window.__azPrivacyScreenBack()) return true;
    if (window.__azAgreementScreenBack && window.__azAgreementScreenBack()) return true;
    if (window.__azTermsScreenBack && window.__azTermsScreenBack()) return true;
    if (window.__azAccountScreenBack && window.__azAccountScreenBack()) return true;
    if (window.__azAboutScreenBack && window.__azAboutScreenBack()) return true;
    // aiHistorySheet/aiScreen/backupScreen/simScreen/notifySheet/docsScreen同理已经是
    // React状态(react/src/sheets/AiScreen.tsx第十一步、BackupScreen.tsx第十步、
    // SimScreen.tsx、NotifySheet.tsx第八步、DocsScreen.tsx第九步)，位置沿用原来这几个
    // subpage/sheet在DOM里的顺序——aiHistorySheet必须排在aiScreen之前("最上层先关"：
    // 历史对话sheet的z-index比aiScreen所在的.subpage更高，视觉上盖在aiScreen上层)。
    if (window.__azAiImportScreenBack && window.__azAiImportScreenBack()) return true;
    if (window.__azAiHistorySheetBack && window.__azAiHistorySheetBack()) return true;
    if (window.__azAiScreenBack && window.__azAiScreenBack()) return true;
    if (window.__azBackupScreenBack && window.__azBackupScreenBack()) return true;
    if (window.__azSimScreenBack && window.__azSimScreenBack()) return true;
    if (window.__azDocsScreenBack && window.__azDocsScreenBack()) return true;
    if (window.__azPremiumScreenBack && window.__azPremiumScreenBack()) return true;
    if (window.__azNotifySheetBack && window.__azNotifySheetBack()) return true;
    // editSheet/detailSheet同理已经是React状态(react/src/sheets/EditSheet.tsx、DetailSheet.tsx)，
    // vanilla看不到，判断逻辑物理上也不在这个文件里了——跟jiggleMode那条(window.__azDebtsBack)
    // 是同一个模式。editSheet排在detailSheet之前(位置沿用原来#editSheet在DOM里的顺序)。
    if (window.__azEditSheetBack && window.__azEditSheetBack()) return true;
    if (window.__azDetailSheetBack && window.__azDetailSheetBack()) return true;
    // 多策略对比规划(react/src/sheets/StrategyCompareScreen.tsx，2026-08-04新增)——不从
    // 任何别的sheets屏幕内部打开(触发点在"统计"tab完全独立的另一棵React树)，也不从自己
    // 内部打开别的sheets屏幕，链里的位置不受"谁盖在谁上面"那条排序约束，放在链尾即可。
    if (window.__azStrategyScreenBack && window.__azStrategyScreenBack()) return true;
    return false;
  };
  // iOS 原生的 UIScreenEdgePanGestureRecognizer 通过这组窄接口驱动全屏 subpage 的交互式
  // 返回。不要开启 WKWebView 网页历史手势：它不认识 React screen/sheet 的层级，也会绕过
  // 上面的“最上层先关”返回链。所有读取真实状态的判断留在这里，Swift 只传递手势进度。
  (function () {
    var target = null;
    var settling = false;
    var settleTimer = 0;
    function clear() {
      if (!target) return;
      target.classList.remove("az-interactive-back", "az-interactive-back-commit");
      target.style.removeProperty("--az-back-progress");
      target = null;
      settling = false;
      if (settleTimer) { clearTimeout(settleTimer); settleTimer = 0; }
    }
    function topOpenSubpage() {
      // 底部 sheet、确认框和登录门应继续走自己的关闭方式；只让独立的全屏页面响应系统式侧滑。
      if (document.querySelector(".sheet.open, #modalScrim.open, #loginGate.open")) return null;
      var open = document.querySelectorAll(".subpage.open");
      return open.length ? open[open.length - 1] : null;
    }
    window.__azInteractiveBack = {
      begin: function () {
        if (target || settling) return false;
        target = topOpenSubpage();
        if (!target) return false;
        target.classList.add("az-interactive-back");
        target.style.setProperty("--az-back-progress", "0");
        return true;
      },
      update: function (progress) {
        if (!target || settling) return;
        var safeProgress = Math.max(0, Math.min(1, Number(progress) || 0));
        target.style.setProperty("--az-back-progress", String(safeProgress));
      },
      finish: function (commit) {
        if (!target || settling) return;
        if (!commit) { clear(); return; }
        settling = true;
        target.classList.add("az-interactive-back-commit");
        target.style.setProperty("--az-back-progress", "1");
        settleTimer = setTimeout(function () {
          // React 的 closeX() 仍是唯一关闭入口，确保侧滑与返回箭头/硬件返回的层级完全一致。
          if (window.__handleBackButton) window.__handleBackButton();
          clear();
        }, 180);
      }
    };
  })();
  // #topAvatarBtn(在还债务页头像)/"我的"页accountAvatarBtn/premiumEntryBtn的点击现在由
  // React直接调用shared/state.ts的openAccountScreen/openPremiumScreen(第七步)，这几个
  // DOM节点都已经不存在于vanilla里了，这里不再需要绑监听器；accountBackBtn/premiumBackBtn/
  // termsLink/termsBackBtn/价卡互斥选中/premiumSubscribeBtn/
  // deleteAccountBtn/wxLogoutBtn同理——#accountScreen/#premiumScreen/#termsScreen整体是
  // React渲染，这些按钮的onClick直接在JSX里写，不再需要在这里查DOM绑监听器。
  $("wxLoginBtn").addEventListener("click", function () {
    var native = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.WeChatLogin;
    if (!native) { toast("微信登录仅支持原生 App 内使用"); return; }
    native.isInstalled().then(function (r) {
      if (!r.installed) { toast("请先安装微信"); return Promise.reject(0); }
      if (!wxAuthListenerBound) { wxAuthListenerBound = true; native.addListener("wechatAuthResult", handleWxAuthResult); }
      return native.login();
    }).then(function () {
      toast("正在跳转微信授权…");
    }).catch(function (err) {
      finishCloudLoginPrompt(false);
      if (err && err.message) toast(err.message);
    });
  });
  $("appleLoginBtn").addEventListener("click", startAppleLogin);
  $("loginCancelBtn").addEventListener("click", function () { finishCloudLoginPrompt(false); });
  // dlBackupBtn/importFileBtn(react/src/mine/DataCards.tsx里的"下载备份文件"/"上传备份文件"
  // 按钮)已经不在vanilla DOM里了，下载逻辑抽成了上面的downloadBackupFile()、通过桥接调用；
  // "上传备份文件"改成下面这个新函数，间接点击还留在vanilla DOM里的#importFileInput。
  function triggerImportFilePicker() { $("importFileInput").click(); }
  $("importFileInput").addEventListener("change", function (e) {
    var file = e.target.files[0]; if (!file) return;
    var input = e.target;
    var reader = new FileReader();
    reader.onload = function () {
      input.value = "";
      var v = String(reader.result || "").trim(); if (!v) { toast("文件是空的"); return; }
      try {
        var parsed = JSON.parse(v), nd, ndocs, nuploads;
        if (Array.isArray(parsed)) { nd = parsed; ndocs = docs; nuploads = null; }
        else { nd = parsed.debts || debts; ndocs = parsed.docs || docs; nuploads = Array.isArray(parsed.uploads) ? parsed.uploads : null; }
        if (!Array.isArray(nd)) throw 0;
        var msg = "用「" + file.name + "」覆盖当前 " + debts.length + " 笔债务" + (Array.isArray(parsed) ? "" : "和档案") + (nuploads ? "、" + nuploads.length + " 个上传文件" : "") + "？";
        ask("导入覆盖", msg, function () {
          debts = nd; docs = ndocs; debts.forEach(normalize); saveAll(); renderAll();
          var finish = function () { dispatchFilesChanged(); toast("已导入 " + nd.length + " 笔 ✓"); };
          if (nuploads) restoreUploads(nuploads).then(finish).catch(function () { toast("已导入，但上传文件恢复失败"); finish(); });
          else finish();
        });
      } catch (err) { toast("数据格式不对，导入失败"); }
    };
    // 安卓WebView从content://（比如"文件"App选的备份json）读取时，readAsText是异步的；
    // 之前在这里同步地把input.value清空，会在读取还没完成时就抢跑，某些WebView版本下
    // 会连带把这次还没结束的FileReader读取打断/丢弃——表现为选完文件后界面毫无反应，
    // 不报错也不提示，只是偶发（部分机型/部分次数才会撞上这个时机）。改成只在
    // onload/onerror里读取结束之后才清空，避免这个竞态。
    reader.onerror = function () { input.value = ""; toast("文件读取失败"); };
    reader.readAsText(file);
  });
  // uploadBtn/uploadInput的click/change监听器已删除——第九步(档案库)迁移React后，
  // <input type="file">由DocsScreen.tsx自己渲染+持有ref，onChange直接调用
  // window.__azBridge.uploadArchiveFile(file)(上面新增的函数，逻辑跟原来这段一致)。

  // 通知渠道：安卓8+发通知必须先建channel，插件不会自动建；iOS没有channel API，不能调用。
  // 幂等，每次Android启动调用无副作用。
  (function () {
    var LN = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications;
    var platform = window.Capacitor && window.Capacitor.getPlatform && window.Capacitor.getPlatform();
    if (LN && platform === "android") LN.createChannel({ id: "repay", name: "还款提醒", description: "债务还款日提醒", importance: 4 }).catch(function () {});
  })();

  // React迁移桥接："在还债务"页(react/src/debts/)整体由React接管，这里只暴露它实际需要
  // 调用的这几个vanilla函数/状态读取器——其余(saveForm/公式生成器等)继续保持private，
  // 后续阶段迁移到别的页面时才按需加进来。详见AGENTS.md"React 迁移"一节。
  window.__azBridge = {
    getDebts: function () { return debts; }, // 每次调用现读，debts会在commitReorder/
    // applyBackupData/导入JSON三处被整体重新赋值，不是原地mutate，函数包一层才能
    // 保证每次都拿到当前最新的那个引用。
    getPremium: function () { return premium; },
    getAccount: function () { return account; },
    updateAccountProfile: updateAccountProfile,
    // openDetail/openEdit都已删除——打开详情窗/编辑表单现在都是纯React状态(shared/state.ts的
    // openDetailSheet/openEditSheet)，不再经过这个桥接对象，见react/src/sheets/。
    payInstallment: payInstallment,
    unsettle: unsettle,
    commitReorder: commitReorder,
    saveAll: saveAll,
    renderAll: renderAll,
    // openPremiumScreen/openAccountScreen/openAiScreen已删除——第七步(accountScreen/
    // premiumScreen/termsScreen)/第十一步(aiScreen)迁移React后，这几个screen都是React
    // 自己拥有的sheet(shared/state.ts)，不再经过这个桥接对象。
    // detailSheet(react/src/sheets/)新增：#dSettle以前只在vanilla内部调用，现在按钮由React
    // 渲染，需要显式桥接。openSimScreen已删除——第八步(simScreen)迁移React后不再经过桥接。
    settleFull: settleFull,
    // detailSheet新增"协商减免"按钮(已知的数据模型缺口④)：不管实付多少都强制关闭当前最早
    // 的未还期次，跟settleFull(整笔债务提前结清)是不同粒度的两个操作，不能合并。
    waiveInstallment: waiveInstallment,
    getNotify: function () { return notify; },
    exportReportXlsx: exportReportXlsx,
    exportReportPdf: exportReportPdf,
    // "我的"tab(react/src/mine/)新增：备份文件打包/解析、系统文件选择器继续100%vanilla。
    // openDocsScreen/openBackupScreen已删除——第九步(docsScreen)/第十步(backupScreen)迁移
    // React后不再经过桥接。
    downloadBackupFile: downloadBackupFile,
    triggerImportFilePicker: triggerImportFilePicker,
    // editSheet(react/src/sheets/EditSheet.tsx)新增：setDebt是保存写入(见上面定义处的注释)，
    // deleteDebt是原样暴露的既有vanilla函数(自带ask()确认+splice+saveAll+renderAll)，
    // toast是#flash单例的简单passthrough，confirmAsync是ask()的Promise外壳(批量设置还款日/
    // 金额要在纯React状态上await结果，见askAsync()定义处的注释)。
    setDebt: setDebt,
    deleteDebt: deleteDebt,
    toast: toast,
    confirmAsync: askAsync,
    // 第七步(accountScreen/premiumScreen)新增：这些是真实的cloud/native调用或者共享
    // 状态变更，留在vanilla私有作用域里，React只调用不重新实现。
    wxLogout: wxLogout,
    requestCloudLogin: requestCloudLogin,
    bindCloudIdentity: bindCloudIdentity,
    deleteAccount: deleteAccount,
    buyPremium: buyPremium,
    restorePremium: restorePremium,
    // "注销账户"确认弹窗的第三条路径新增：只清本机storage、不删服务器账户(见定义处的注释)。
    resetLocalData: resetLocalData,
    // 第八步(notifySheet)新增：这4个都要调用@capacitor/local-notifications原生插件
    // (权限检查/申请/调度)，留在vanilla私有作用域里，React只调用不重新实现。
    setNotifyEnabled: setNotifyEnabled,
    addNotifyRule: addNotifyRule,
    deleteNotifyRule: deleteNotifyRule,
    sendTestNotification: sendTestNotification,
    // 第九步(docsScreen)新增：IndexedDB(uploads)+docs数组的增删、原生分享全部留vanilla，
    // getFiles()合成不含原始Blob的展示数据，其余3个按id反查目标(不需要把Blob传过桥接边界)。
    getFiles: getFiles,
    uploadArchiveFile: uploadArchiveFile,
    deleteArchiveFile: deleteArchiveFile,
    downloadArchiveFile: downloadArchiveFile,
    shareArchiveFile: shareArchiveFile,
    // 第十步(backupScreen)新增：全部cloud函数调用(ensureCbAuthReady/cbApp().callFunction
    // 这套认证会话状态)继续100%vanilla，二次确认弹窗挪到了React用confirmAsync处理，这几个
    // 函数只做"真的去调用"这一步(见上面定义处的注释)。
    createBackup: createBackup,
    listBackups: listBackups,
    restoreBackup: restoreBackup,
    deleteBackup: deleteBackup,
    getBackupMeta: getBackupMeta,
    getAiDebtImportStatus: getAiDebtImportStatus,
    startAiDebtImport: startAiDebtImport,
    completeAiDebtImport: completeAiDebtImport,
    // 第十一步(aiScreen)新增，且是这一步唯一的新增：callAiAdvisor原样保留(依赖
    // ensureCbAuthReady/cbApp().callFunction这套认证会话状态，不可移植)。
    callAiAdvisor: callAiAdvisor,
    // 2026-08-04新增："每日额度用完了怎么办"弹窗的"复制完整提示词"按钮要用——buildAiSummary()
    // 本身零DOM依赖、不调用云函数，直接原样暴露，不用像callAiAdvisor那样包一层。
    buildAiSummary: buildAiSummary
  };

  renderAll(); loadUploads(); renderAccountUI(); startStartupSplash();
  if (isIosPurchaseRuntime()) {
    var nativePremium = storeKitPremium();
    if (nativePremium && nativePremium.addListener) {
      nativePremium.addListener("transactionUpdated", function (result) {
        if (account) verifyStoreKitTransaction(result).catch(function () {});
      });
    }
    // 已登录用户静默刷新服务端权益；首次使用不弹登录门，债务首页始终可用。
    if (account) refreshPremiumAccess();
  }
})();
</script>
