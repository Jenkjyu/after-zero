<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>债务管理</title>
<style>
  @font-face {
    font-family: 'Inter var';
    font-style: normal;
    font-weight: 400 700;
    font-display: swap;
    src: url('fonts/Inter-Variable-Latin.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  :root {
    --bg: #E7EAEF; --surface: #FFFFFF; --surface-2: #EFF1F6; --border: #CED2DB;
    --text: #23272F; --text-muted: #656C7E; --accent: #18453B; --accent-soft: #E7F3F1; --accent-mid: #4E9481;
    --critical: #BE3A3A; --critical-soft: #F9E8E8; --warning: #A66A0A; --warning-soft: #FAF0D9;
    --good: #2E5F8A; --good-soft: #E1EBF4; --shadow: 0 2px 10px rgba(24,32,46,.10);
    --accent-fill: #1E715F; --critical-fill: #BE3A3A; --on-accent: #FFFFFF; --on-good: #FFFFFF; --on-critical: #FFFFFF; --on-critical-dim: rgba(255,255,255,.78);
    --fs-xs: 11px; --fs-sm: 11.5px; --fs-base: 14px; --fs-lg: 15.5px; --fs-figure: 18px; --fs-xl: 19px; --fs-xxl: 23px;
    --font-ui: 'Inter var', system-ui, -apple-system, "PingFang SC", "Segoe UI", Roboto, sans-serif;
    --font-num: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --text-faint: #89929C; --accent-rgb: 24,69,59; --app-grad: linear-gradient(180deg,#E9ECF1,#E2E5EB);
    --card-grad: linear-gradient(180deg,#FFFFFF,#FAFBFD); --hair: rgba(35,42,55,.08);
    --graphite-a: #253039; --graphite-b: #151A20; --graphite-text: #FFFFFF; --graphite-dim: #9BA6B4;
    --graphite-sheen: rgba(111,190,158,.18);
    --e1: 0 1px 2px rgba(24,32,46,.05), 0 4px 10px rgba(24,32,46,.055);
    --e2: 0 2px 6px rgba(24,32,46,.06), 0 16px 32px rgba(24,32,46,.09);
    --e3: 0 24px 50px rgba(16,24,38,.28);
    --glass: rgba(255,255,255,.62); --glass-border: rgba(255,255,255,.8); --glass-hi: rgba(255,255,255,.7);
    /* 多策略对比规划(StrategyCompareScreen)的3色分类色——雪球法/雪崩法/自定义顺序固定
       这个顺序，不循环使用。数值跟统计tab的--pie-1/2/3相同(蓝/琥珀/青，已用dataviz skill
       的validate_palette.js对--card-grad底色验证过全部通过)，但故意不直接复用--pie-*
       这几个token——那几个的角色是"债务类型占比甜甜圈"分类色、且作用域限定在.viz-root下
       (统计tab专属)，这个新screen不在.viz-root范围内，且"策略身份"跟"债务类型"不是同一件
       事，"一个颜色=一个角色"是这份配色体系的既有原则，故另起3个跟主题块同级的全局token。 */
    --strat-1: #2B6CB8; --strat-2: #C4892F; --strat-3: #068468;
    /* 默认保留旧 WebView 的 100vh；支持动态视口的 iOS/WKWebView 会在下方切换为 100dvh，
       键盘展开时 sheet/subpage 才能跟着可视区域缩小，而不是被键盘盖住。 */
    --az-viewport-height: 100vh;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0F1319; --surface: #24282F; --surface-2: #2E3239; --border: #3C4047;
      --text: #E4E8EF; --text-muted: #98A0B0; --accent: #6FBE9E; --accent-soft: #283633; --accent-mid: #2F7B65;
      --critical: #EE7B7B; --critical-soft: #402F31; --warning: #D69A3C; --warning-soft: #3A3225;
      --good: #6FA8D6; --good-soft: #29353E; --shadow: 0 2px 12px rgba(0,0,0,.35);
      --accent-fill: #6FBE9E; --critical-fill: #B04040; --on-accent: #0E2119; --on-good: #0D1C28; --on-critical: #FFFFFF; --on-critical-dim: rgba(255,255,255,.78);
      --text-faint: #6E7787; --accent-rgb: 111,190,158; --app-grad: linear-gradient(180deg,#12161C,#0C0F14);
      --card-grad: linear-gradient(180deg,#282D35,#24282F); --hair: rgba(255,255,255,.07);
      --graphite-a: #333B45; --graphite-b: #161D25; --graphite-text: #F2F5F9; --graphite-dim: #99A4B2;
      --graphite-sheen: rgba(111,190,158,.22);
      --e1: 0 1px 2px rgba(0,0,0,.35); --e2: 0 4px 18px rgba(0,0,0,.4); --e3: 0 22px 46px rgba(0,0,0,.55);
      --glass: rgba(54,58,66,.55); --glass-border: rgba(255,255,255,.10); --glass-hi: rgba(255,255,255,.08);
      --strat-1: #5590D8; --strat-2: #BC8B3C; --strat-3: #43A883; }
  }
  :root[data-theme="light"] { --bg: #E7EAEF; --surface: #FFFFFF; --surface-2: #EFF1F6; --border: #CED2DB;
    --text: #23272F; --text-muted: #656C7E; --accent: #18453B; --accent-soft: #E7F3F1; --accent-mid: #4E9481;
    --critical: #BE3A3A; --critical-soft: #F9E8E8; --warning: #A66A0A; --warning-soft: #FAF0D9;
    --good: #2E5F8A; --good-soft: #E1EBF4; --shadow: 0 2px 10px rgba(24,32,46,.10);
    --accent-fill: #1E715F; --on-accent: #FFFFFF; --on-good: #FFFFFF; --on-critical: #FFFFFF; --on-critical-dim: rgba(255,255,255,.78);
    --text-faint: #89929C; --accent-rgb: 24,69,59; --app-grad: linear-gradient(180deg,#E9ECF1,#E2E5EB);
    --card-grad: linear-gradient(180deg,#FFFFFF,#FAFBFD); --hair: rgba(35,42,55,.08);
    --graphite-a: #253039; --graphite-b: #151A20; --graphite-text: #FFFFFF; --graphite-dim: #9BA6B4;
    --graphite-sheen: rgba(111,190,158,.18);
    --e1: 0 1px 2px rgba(24,32,46,.05), 0 4px 10px rgba(24,32,46,.055);
    --e2: 0 2px 6px rgba(24,32,46,.06), 0 16px 32px rgba(24,32,46,.09);
    --e3: 0 24px 50px rgba(16,24,38,.28);
    --glass: rgba(255,255,255,.62); --glass-border: rgba(255,255,255,.8); --glass-hi: rgba(255,255,255,.7);
    --strat-1: #2B6CB8; --strat-2: #C4892F; --strat-3: #068468; }
  /* 图标徽章色家族——**故意只定义一次、不跟着明暗模式换**，跟上面那4个主题块的规矩不同。
     理由：这些颜色只出现在38px的小圆角方块里（约屏幕面积2%），小面积高饱和在明暗两种底色
     下都成立，保持恒定反而让App有一个跨主题稳定的色彩signature（Google账号设置页就是这么做的，
     深色模式下那些紫/绿/蓝徽章原样不变）。这也是这轮定下的核心原则：
     **颜色的"多样性"和"面积"要反向配比——小面积可以多色相高饱和，大面积必须少色相低饱和。**
     统计页图表属于"大面积"，要用的是从这个家族派生出来的低饱和档，不是直接拿这几个值去铺。 */
  :root {
    --ic-brand-bg: #ACECD4; --ic-brand-fg: #1D6D4F;
    --ic-blue-bg: #ACCEEC; --ic-blue-fg: #1D486D;
    --ic-violet-bg: #C6ACEC; --ic-violet-fg: #3D1D6D;
    --ic-rose-bg: #ECACC1; --ic-rose-fg: #6D1D38;
    --ic-amber-bg: #ECD2AC; --ic-amber-fg: #6D4D1D;
  }
  :root[data-theme="dark"] { --bg: #0F1319; --surface: #24282F; --surface-2: #2E3239; --border: #3C4047;
    --text: #E4E8EF; --text-muted: #98A0B0; --accent: #6FBE9E; --accent-soft: #283633; --accent-mid: #2F7B65;
    --critical: #EE7B7B; --critical-soft: #402F31; --warning: #D69A3C; --warning-soft: #3A3225;
    --good: #6FA8D6; --good-soft: #29353E; --shadow: 0 2px 12px rgba(0,0,0,.35);
      --accent-fill: #6FBE9E; --on-accent: #0E2119; --on-good: #0D1C28; --on-critical: #2A1113; --on-critical-dim: rgba(42,17,19,.72);
    --text-faint: #6E7787; --accent-rgb: 111,190,158; --app-grad: linear-gradient(180deg,#12161C,#0C0F14);
    --card-grad: linear-gradient(180deg,#282D35,#24282F); --hair: rgba(255,255,255,.07);
    --graphite-a: #333B45; --graphite-b: #161D25; --graphite-text: #F2F5F9; --graphite-dim: #99A4B2;
    --graphite-sheen: rgba(111,190,158,.22);
    --e1: 0 1px 2px rgba(0,0,0,.35); --e2: 0 4px 18px rgba(0,0,0,.4); --e3: 0 22px 46px rgba(0,0,0,.55);
    --glass: rgba(54,58,66,.55); --glass-border: rgba(255,255,255,.10); --glass-hi: rgba(255,255,255,.08);
    --strat-1: #5590D8; --strat-2: #BC8B3C; --strat-3: #43A883; }

  * { box-sizing: border-box; }
  /* 全局禁掉长按选中/复制文字，只在真正的文字输入框(input/textarea)里保留——
     安卓WebView里，不禁掉这个的话，长按卡片会先被系统当成"选中文字"手势抢走
     (弹出选中手柄+复制菜单)，我们自己JS写的长按拖拽排序逻辑根本收不到后续的
     pointermove，表现就是"长按之后卡片压根拖不动"。user-select是继承属性，
     这里在body上关一次，除了input/textarea，全站(含SVG文字)都会跟着继承关闭。 */
  /* 到顶/到底之后继续滑不要再有"拉扯"回弹——安卓12+的WebView默认是stretch overscroll，
     它拉伸的是整个渲染表面，连position:fixed的tabbar都会跟着一起被拽走(真机实测)。
     overscroll-behavior-y:none关掉根滚动容器这个效果；内部自己滚动的容器(.sheet/.subpage/
     .ai-thread等)用contain，既不产生自己的拉扯、也不把滚动链传给底下的页面。
     ⚠️只写CSS不够，原生那边还配了WebView.setOverScrollMode(OVER_SCROLL_NEVER)兜底，
     见MainActivity.java——两层都要有，别只改一处。 */
  html, body { min-height: var(--az-viewport-height); overscroll-behavior-y: none; }
  /* React 管理的新增/编辑债务 sheet 打开时也要锁住根滚动。
     .sheet-scroll 的 overscroll-behavior 在 iOS WKWebView 上不足以阻止滚动链传到主页面；
     旧版 lockScroll() 只由 vanilla 的确认弹窗/登录门调用，因此不能覆盖这个 React sheet。 */
  html.az-edit-sheet-open, body.az-edit-sheet-open,
  html.az-detail-sheet-open, body.az-detail-sheet-open { overflow: hidden; }
  @supports (height: 100dvh) {
    :root { --az-viewport-height: 100dvh; }
  }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-ui); line-height: 1.5; -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-user-drag: none; }
  input, textarea { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
  .num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
  /* 安卓WebView默认会给"可点击元素"画一层半透明蓝色的点按高亮。原来只在button上关掉它，
     结果每新增一个可点击的<div>(债务卡片、档案库文件行、AI历史对话行……)就要单独补一次，
     漏了就是"长按/点击时闪一下蓝底"——这个bug在真机上已经被报过三轮了。
     ⚠️-webkit-tap-highlight-color是**继承属性**，在body上设一次就覆盖全站所有后代，
     不需要逐个class去补。下面button/.debt那几处保留着是无害的冗余(也顺便说明意图)。
     关掉原生高亮之后，"按下去有反应"这件事由本项目自己的:active规则负责(见下一行)，
     不依赖系统那层蓝色。 */
  body { -webkit-tap-highlight-color: transparent; }
  /* ⚠️`color: inherit` 是必须的，别删：<button> 不像普通元素那样继承文字色，不显式声明的话
     会落到浏览器默认的 ButtonText（黑色）。浅色模式下碰巧接近正常文字色所以看不出问题，
     **深色模式下就是黑字压深底、几乎看不见**——`.price-card`（订阅页那三张价卡，是<button>
     但只设了 background 没设 color）就是这么中招的，真机报上来的。跟第2步 `color:#fff`
     写死那批是同一类问题：颜色没跟着主题走。加了这条之后，新写的按钮默认就是对的。 */
  button { font-family: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:active, .file-row:active, .backup-row:active { filter: brightness(.94); transition: filter .1s; }
  button:disabled { opacity: .5; pointer-events: none; }
  /* ⚠️故意用box-shadow画焦点环，不用outline：outline的圆角只是浏览器按outline-width/
     outline-offset近似猜的，不保证贴合元素自己的border-radius，offset拉开一点、元素本身
     圆角又不算大(比如.field input的9px)时，圆角处的outline半径明显比box小，直线边那段
     outline就会比box本身宽出一截——真机上"还款日/备注"这些输入框点击后绿色描边左右溢出
     就是这么来的。box-shadow没有这个问题，它是照着元素当前生效的border-radius整个画的，
     不管这个radius是几，永远贴合。这是全局:focus-visible规则，牵一发动全身，改这条前先
     搜一遍有没有专门针对某个控件把它关掉的例外(下面.sort-sel/.ai-composer textarea两处)，
     那两处原来只关outline，现在box-shadow也要一并关掉，不然会意外重新长出一圈环。 */
  :focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent); }

  .app { max-width: 560px; margin: 0 auto; padding: max(18px, env(safe-area-inset-top)) 14px max(100px, calc(72px + env(safe-area-inset-bottom))); background: var(--app-grad); min-height: var(--az-viewport-height); }

  /* ===== 顶部：手写 wordmark + 头像入口（替代原来的"债务管理"标题） ===== */
  header#topHeader { padding: 4px 3px 4px; display: flex; align-items: center; justify-content: space-between; min-height: 36px; }
  .wordmark { height: 26px; color: var(--text); display: flex; align-items: center; }
  .wordmark svg { height: 100%; width: auto; display: block; }
  .avatar-btn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--hair); padding: 0; background: var(--surface-2);
    box-shadow: var(--e1); display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; flex: none; }
  .avatar-btn svg { width: 21px; height: 21px; color: var(--text-muted); }
  .avatar-btn img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .note-toggle { background: none; border: none; color: var(--accent); font-size: 12px; font-weight: 600;
    padding: 2px; margin: -6px 2px 8px; display: flex; align-items: center; gap: 3px; font-family: inherit;
    -webkit-tap-highlight-color: transparent; }
  .note-toggle svg { width: 12px; height: 12px; transition: transform .15s ease; }
  .note-toggle.open svg { transform: rotate(180deg); }

  /* ===== 石墨主角卡：唯一的"在还总负债"焦点 ===== */
  .hero { position: relative; border-radius: 24px; padding: 20px 20px 18px; margin-bottom: 13px; overflow: hidden;
    background: linear-gradient(155deg, var(--graphite-a), var(--graphite-b)); color: var(--graphite-text); box-shadow: var(--e3); }
  .hero::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 2;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.1); }
  .hero > * { position: relative; z-index: 1; }
  .hero-smoke { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; pointer-events: none; z-index: 0; }
  .hero-puff { position: absolute; border-radius: 50%; filter: blur(30px); mix-blend-mode: screen; opacity: .55; }
  .hero-puff.a { width: 200px; height: 200px; left: -12%; top: 8%;
    background: radial-gradient(circle, rgba(111,190,158,.55), transparent 70%); animation: heroDrift1 8s ease-in-out infinite; }
  .hero-puff.b { width: 170px; height: 170px; right: -8%; top: 30%;
    background: radial-gradient(circle, rgba(90,170,180,.5), transparent 70%); animation: heroDrift2 10s ease-in-out infinite; }
  .hero-puff.c { width: 150px; height: 150px; left: 30%; bottom: -20%;
    background: radial-gradient(circle, rgba(120,200,150,.4), transparent 70%); animation: heroDrift3 12.5s ease-in-out infinite; }
  @keyframes heroDrift1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(40px,20px) scale(1.15); } }
  @keyframes heroDrift2 { 0%,100% { transform: translate(0,0) scale(1.05); } 50% { transform: translate(-36px,-16px) scale(.92); } }
  @keyframes heroDrift3 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(24px,-30px) scale(1.2); } }
  @media (prefers-reduced-motion: reduce) { .hero-puff { animation: none; } }
  .hero-top { display: flex; align-items: center; justify-content: space-between; }
  .hero-label { font-size: 12.5px; font-weight: 600; letter-spacing: .04em; color: var(--graphite-dim); }
  .hero-pill { font-size: 11px; font-weight: 600; color: var(--graphite-dim); border: 1px solid rgba(255,255,255,.16);
    border-radius: 999px; padding: 3px 10px; }
  .hero-amt { font-size: 36px; font-weight: 700; margin: 8px 0 0; font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .hero-amt .cur { font-size: 21px; font-weight: 600; margin-right: 2px; color: var(--graphite-dim); }
  .hero-prog { margin-top: 15px; }
  .hero-prog-track { height: 6px; border-radius: 999px; background: rgba(255,255,255,.12); overflow: hidden; }
  .hero-prog-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, rgba(var(--accent-rgb),.75), #6FBE9E); }
  .hero-prog-row { display: flex; justify-content: space-between; align-items: baseline; margin-top: 8px; }
  .hero-prog-row .l { font-size: 11.5px; color: var(--graphite-dim); }
  .hero-prog-row .r { font-size: 11.5px; color: var(--graphite-text); font-weight: 600; font-family: var(--font-num); }

  /* ===== 降权的 4 个小指标 ===== */
  .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 13px; }
  .kpi { position: relative; background: var(--card-grad); border: 1px solid var(--hair);
    border-radius: 18px; padding: 12px 14px; box-shadow: var(--e2); }
  .kpi::after { content: ""; position: absolute; inset: 0; border-radius: inherit;
    pointer-events: none; box-shadow: inset 0 1px 0 var(--glass-hi); }
  .kpi .v { font-size: 17px; font-weight: 650; margin-top: 3px; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
  .kpi .k { font-size: 11px; color: var(--text-muted); }
  .kpi-sub { font-size: 10.5px; color: var(--text-faint); margin-top: 2px; }
  /* 灵动AI入口：对话气泡+魔法棒图标，胶囊描边扫光+呼吸光晕；开通前更克制、不发光。 */
  .ai-banner { position: relative; display: flex; align-items: center; gap: 11px; width: 100%; border: none;
    border-radius: 999px; padding: 12px 16px 12px 12px; background: var(--card-grad); cursor: pointer;
    margin: 0 0 20px; text-align: left; color: inherit; isolation: isolate; overflow: hidden; box-shadow: var(--e2); font-family: inherit; }
  .ai-banner::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.4px;
    background: linear-gradient(120deg, rgba(var(--accent-rgb),.14), rgba(var(--accent-rgb),.6), rgba(var(--accent-rgb),.14));
    background-size: 220% 100%;
    /* "渐变描边"技巧：整块渐变铺满，再用两层mask(一层只覆盖content-box、一层覆盖整个border-box)
       做异或，只留下padding那一圈=描边。-webkit-前缀和标准属性必须成对写：老WebView只认
       -webkit-mask/-webkit-mask-composite:xor，新引擎认标准的mask/mask-composite:exclude
       (两者的关键字名不一样，xor↔exclude，不是同一个词的前缀版)。只写前缀版会在未来某个
       只支持标准属性的引擎上整圈描边消失。 */
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; animation: aiSheen 5s linear infinite; }
  .ai-banner::after { content: ""; position: absolute; inset: -30%; z-index: -1; border-radius: 50%;
    background: radial-gradient(circle, rgba(var(--accent-rgb),.14), transparent 65%); animation: aiGlow 3.6s ease-in-out infinite; }
  .ai-banner:not(.is-ai)::before, .ai-banner:not(.is-ai)::after { display: none; }
  @keyframes aiSheen { to { background-position: -220% 0; } }
  @keyframes aiGlow { 0%,100% { opacity: .5; transform: scale(.94); } 50% { opacity: 1; transform: scale(1.04); } }
  .ai-banner-ic { width: 33px; height: 33px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
    display: flex; align-items: center; justify-content: center; flex: none; }

  .ai-banner-ic svg { width: 18px; height: 18px; overflow: visible; }
  .wand { filter: drop-shadow(0 0 2px rgba(var(--accent-rgb),.5)); animation: wandGlow 2.4s ease-in-out infinite;
    transform-box: fill-box; transform-origin: 100% 100%; }
  .ai-banner:not(.is-ai) .wand { filter: none; animation: none; opacity: .55; }
  @keyframes wandGlow { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
  /* 入场"摇两下再定住"动效：AI对话页打开/新对话时给魔法棒临时加这个class，播完JS会移除，
     .wand基础规则的wandGlow呼吸光晕会自动接续（.wand.cast的animation声明只是临时覆盖，
     两条class的specificity差异保证了这个接续关系，不需要额外的"glow"类）。
     transform-origin用的是魔法棒手柄末端(grip)在其path bbox里的相对位置，让旋转看起来像"挥动"
     而不是绕图形中心转——这个数值是照着wand路径坐标(bbox约x:6.6-21,y:-3.15-7，grip端点(21,7)
     正好是右下角)算出来的，换了图形要重新算。 */
  .wand.cast { animation: wandCast .75s cubic-bezier(.34,1.4,.4,1) 1 both; }
  @keyframes wandCast {
    0% { transform: rotate(0deg) scale(1); }
    12% { transform: rotate(-18deg) scale(1.08); }
    28% { transform: rotate(14deg) scale(1.04); }
    44% { transform: rotate(-9deg) scale(1.02); }
    60% { transform: rotate(6deg) scale(1.01); }
    78% { transform: rotate(-2deg) scale(1); }
    100% { transform: rotate(0deg) scale(1); }
  }

  /* .sort-sel从原生<select>换成了普通<button>(点击弹出自绘的底部面板，
     见react/src/debts/SortSheet.tsx+shared/PickerSheet.tsx)——原生select在安卓WebView里弹的是系统全屏列表，

  /* .debt(外层，长按拖拽排序的直接list item，位置/抖动动画都作用在它身上)保持默认
     touch-action(auto)——原因见onCardTouchStart的注释，不重复。
     .debt-row是新加的内层横向flex行，左滑手势的translateX作用在它身上，跟外层.debt的
     纵向拖拽位移(translateY)互不干扰，两套手势可以叠加在同一张卡片上而不用互相知道对方
     的存在。⚠️.debt-swipe-btn必须是.debt-row里跟.debt-front并排的flex子项(挪到卡片右侧
     屏幕外)，不能用position:absolute叠在.debt-front正后方——踩过坑：.debt-front是半透明
     磨砂玻璃(backdrop-filter+50%透明度背景)，哪怕完全遮住了正后方的按钮，玻璃本身的透明度
     还是会让按钮的颜色透出来（真机截图验证过，卡片右边缘常驻能看到一条蓝色"销这期"字样），
     并排布局从根源上避免这个问题——关闭状态下按钮压根不在玻璃卡背后，没有任何东西可透。 */
  /* .debt/.debt-row/.debt-front都不是<button>，接不到上面button{}规则里的tap-highlight-color:
     transparent——长按触发拖拽排序手势时，安卓WebView默认的原生"点按高亮"（半透明蓝色）会在
     这几层上闪一下，跟卡片本身的磨砂玻璃质感很不搭。三层都要设，因为长按/拖拽手势在.debt和
     .debt-front上都挂了touch事件监听，高亮可能出现在其中任意一层。 */
  .debt { position: relative; border-radius: 18px; margin-bottom: 11px; overflow: hidden; box-shadow: var(--e2);
    -webkit-tap-highlight-color: transparent; }
  .debt-row { display: flex; align-items: stretch; -webkit-tap-highlight-color: transparent; }
  /* ⚠️这个宽度必须跟 react/src/debts/gestures.ts 里的 DEBT_REVEAL 常量保持一致——CSS负责"按钮长什么样"、
     JS常量负责"滑动要位移多少像素才露出它"，改一个不改另一个的话，滑到底会露出
     半个按钮或者多出一条空隙。 */
  .debt-swipe-btn { flex: 0 0 76px; border: none; background: var(--good); color: var(--on-good);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12.5px; font-weight: 700;
    -webkit-tap-highlight-color: transparent; }
  .debt-swipe-btn svg { width: 18px; height: 18px; }
  .debt-front { flex: 0 0 100%; position: relative; z-index: 1; background: var(--glass); border: 1px solid var(--glass-border);
    -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4);
    border-radius: 18px; padding: 14px 16px; cursor: pointer; overflow: hidden; -webkit-tap-highlight-color: transparent; }
  .debt-front::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; }
  .debt.crit .debt-front::before { background: linear-gradient(135deg, rgba(190,58,58,.11), transparent 52%); }
  .debt.warn .debt-front::before { background: linear-gradient(135deg, rgba(166,106,10,.11), transparent 52%); }
  .debt.good .debt-front::before { background: linear-gradient(135deg, rgba(46,95,138,.10), transparent 52%); }
  .debt-front::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    box-shadow: inset 0 1px 0 var(--glass-hi); }
  .debt-top { position: relative; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .debt-nm { font-size: var(--fs-lg); font-weight: 600; }
  .debt-meta { font-size: 11.5px; color: var(--text-faint); margin-top: 3px; }
  .debt-amtbox { text-align: right; flex: none; position: relative; }
  .debt-bal { font-size: var(--fs-figure); font-weight: 700; display: block; }
  .debt-ballab { font-size: 10.5px; color: var(--text-muted); }
  .debt-tags { position: relative; display: flex; gap: 6px; align-items: center; margin-top: 11px; flex-wrap: wrap; }
  .tag { font-size: var(--fs-sm); font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .tag.rate-hi { background: var(--critical-soft); color: var(--critical); }
  .tag.rate-mid { background: var(--warning-soft); color: var(--warning); }
  .tag.rate-lo { background: var(--good-soft); color: var(--good); }
  .tag.neutral { background: var(--surface-2); color: var(--text-muted); }

  /* .pay-row(外层list item，overflow:hidden+box-shadow)/.pay-swipe-row(内层横向flex行，左滑

  .pay-row.overdue .pay::before { background: linear-gradient(135deg, rgba(190,58,58,.2), transparent 52%); }
  .pay::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;

  /* ⚠️这个宽度必须跟 react/src/pay/gestures.ts 里的 PAY_REVEAL 常量保持一致——CSS负责"按钮长什么样"、
     JS常量负责"滑动要位移多少像素才露出它"，改一个不改另一个的话，滑到底会露出

  .pay-swipe-btn { flex: 0 0 76px; border: none; background: var(--good); color: var(--on-good);

  /* 三档(7/15/30天内)——跟筛选条的档位一一对应，点了筛选要能在上面找到对应的总额。
     三列在390px宽的手机上每格约115px，字号比两列时略小一点才不换行。 */

  .pay-stats .kpi .k { font-size: 10.5px; }

  /* 筛选条 = 可横向滑动的一排芯片 + 固定不滚的日历按钮。芯片加到5个之后一行放不下，
     等分挤压会让每个芯片的字都换行；改成滚动之后"30天内"要往右滑一点才露出来(跟用户
     确认过的取舍)。日历按钮**不能**进滚动区——它是常驻入口，滑走了等于没有。 */
  .pay-filter { display: flex; align-items: stretch; gap: 8px; margin-bottom: 12px; }

    -webkit-tap-highlight-color: transparent; }

  .pf-cal.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

  .pay-hero { border-radius: 22px; padding: 16px 18px 15px; margin-bottom: 16px; box-shadow: var(--e3); }
  .pay-hero-top { display: flex; align-items: center; justify-content: space-between; }

  .pay-hero.empty { background: var(--good-soft); }

  .pay-hero.overdue .pay-hero-daynum, .pay-hero.overdue .pay-hero-rel, .pay-hero.overdue .pay-hero-amt { color: var(--on-critical); }

  /* 还款列表按"已逾期/本周内/本月内/更晚"分组，逾期单独强调(红字加粗)，不只是排序靠前——
     逾期的实际代价比"还没到但快了"更高，值得从列表里摘出来单独一档(呼应urgencyTier的判断)。 */
  .section-label.overdue { color: var(--critical); font-weight: 700; }

  .poster { width: 100%; border-radius: 16px; display: block; }
  .md-body h2, .md-body h3, .md-body h4, .md-body h5, .md-body h6 { color: var(--accent); margin: 18px 0 8px; line-height: 1.3; text-wrap: balance; }
  .md-body h2 { font-size: 19px; } .md-body h3 { font-size: 16px; } .md-body h4 { font-size: 14px; }
  .md-body > :first-child { margin-top: 0; }

  .data-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); }

    border-radius: 9px; padding: 10px; font-family: var(--font-num); font-size: 11px; resize: vertical; }

  /* 订阅页的购买/恢复是并列操作：统一外框高度，避免描边按钮比实心按钮高 2px。 */
  .premium-actions .btn { box-sizing: border-box; height: 44px; }
  .btn { border: none; border-radius: 10px; padding: 11px; font-size: var(--fs-base); font-weight: 600; flex: 1;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; }

  /* 按钮分四档，靠"层级"区分主次，不靠"是不是绿的"——一屏最多一个 .primary 实心强调按钮。
     ①primary=实心(提交整个表单/确认)  ②ghost=中性描边(取消、次要操作)
     ③danger=淡红底(次要的破坏性操作)  ④tertiary=局部小工具(见 .batch button)
     ⚠️实心按钮的文字色一律走 --on-* token，绝对不要写死 #fff：深色模式下 --accent/--good/
     --critical 都会变成浅色调，白字压上去只有 2.2~3.2，远低于 4.5。这个错误历史上在
     保存/应用到全部/左滑销这期/toast/AI气泡等十来处同时犯过，全部由这批 token 统一修掉。 */
  .btn.primary { background: var(--accent-fill); color: var(--on-accent); }
  .btn.ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  .btn.danger { background: var(--critical-soft); color: var(--critical); }

  .scrim { position: fixed; inset: 0; background: rgba(15,20,30,.55); z-index: 30; display: none; }
  .scrim.open { display: block; }
  /* ⚠️滚动必须在内层(.sheet-scroll)，不能直接挂在.sheet上——深色模式真机实测到的bug：
     .sheet同时具备"圆角 + overflow-y:auto + transform"这三样时，Chromium把它当成不透明的
     合成滚动层，圆角外那几个像素直接留了图层的默认白底，表现为把抽屉往上拖到内容真正需要
     滚动的高度之后，左上/右上两个圆角位置露出白边。浅色模式下--surface本来就是白的所以
     一直看不出来，只有深色才露馅(这也是为什么"只有深色模式有这个问题")。
     把滚动挪到内层之后，.sheet只剩圆角+overflow:hidden+transform，不再是合成滚动容器，
     这个组合就不成立了。顺带的好处：grip留在滚动区外，拖动条永远在顶部不会被内容滚走。 */
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; background: var(--surface); border-radius: 24px 24px 0 0;
    max-width: 560px; margin: 0 auto; max-height: min(94vh, calc(var(--az-viewport-height) - env(safe-area-inset-top))); overflow: hidden; transform: translateY(100%);
    transition: transform .28s cubic-bezier(.2,.7,.3,1); padding: 8px 16px calc(24px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; }
  /* min-height:0是flex子元素能收缩、让overflow-y:auto真正生效的必要条件(同#aiScreen .ai-thread)。
     ⚠️overflow-y:auto会让浏览器把没写的overflow-x强制计算成auto(CSS规范:一侧非visible时另一侧
     visible会被强制成auto)，而.sheet-scroll自己没有左右padding，表单控件贴着它的内容盒边缘——
     :focus-visible的box-shadow往外凸的2px正好被这层隐性的overflow-x:auto裁掉，真机表现为"输入框
     聚焦时绿色描边只在上下圆角弧线附近看得见、贴近左右两条直边的中段直接消失"。margin:-2px+
     padding:2px这对组合不改变里面表单控件的实际位置/宽度(负margin让盒子往外扩2px、padding把
     content box缩回来2px，两者抵消)，只是让.sheet-scroll自己的裁切边界(padding box)比表单控件
     的边缘多出2px余量，box-shadow那2px就有地方画了。 */
  .sheet-scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scroll-padding: 12px 2px max(20px, calc(12px + env(safe-area-inset-bottom))); margin: 0 -2px; padding: 0 2px; }
  .sheet.open { transform: translateY(0); }
  @media (prefers-reduced-motion: reduce) { .sheet { transition: none; } }
  .grip { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 8px auto 12px; padding: 10px 24px; background-clip: content-box; box-sizing: content-box; touch-action: none; }
  .sheet h2 { margin: 0 0 4px; font-size: var(--fs-xl); }
  .sheet .subh { color: var(--text-muted); font-size: 13px; margin-bottom: 14px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; font-weight: 600; }
  .field input, .field select, .field textarea { width: 100%; background: var(--surface-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 9px; padding: 10px 11px; font-size: 15px; font-family: inherit; }
  /* iOS 会在小于 16px 的可编辑控件获得焦点时自动放大页面。只在 WebKit 的触摸实现中
     提升可编辑控件字号，保留 Android 的紧凑表格几何，同时避免键盘收起后出现缩放残留。 */
  @supports (-webkit-touch-callout: none) {
    input:not([type="checkbox"]):not([type="radio"]), textarea, select { font-size: 16px !important; }
  }
  .field textarea { min-height: 52px; resize: vertical; }
  /* 公式生成器"计息方式"从原生<select>换成button+底部抽屉(GenPanel.tsx，shared/PickerSheet.tsx)
     ——原生select在安卓WebView里弹的是系统全屏列表，是排序方式(.sort-sel)当年换掉select的
     同一个理由。样式贴近同一个.field里其它input/select(整行宽、同样的底色/边框)，只是
     右侧加一个chevron提示"点开有更多选项"；跟.sort-sel那种紧凑pill形态是两种场景——那个
     夹在"保存"按钮旁边，这个是表单里独立一整行的字段。 */
  .field-select-btn { display: flex; align-items: center; justify-content: space-between; gap: 8px;
    width: 100%; background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 9px; padding: 10px 11px; font-size: 15px; font-family: inherit; text-align: left; }
  .field-select-btn svg { width: 15px; height: 15px; color: var(--text-muted); flex: none; }
  /* iOS 的 input[type=date] 在 16px（防自动缩放所需字号）下会绘制超过网格列宽的原生
     外观。双列仍保持与上一行相同的 1:1 几何；借款日用等尺寸外框负责边框和裁切，内部
     date input 只保留原生日期交互，避免为迁就它改坏两列的宽度与对齐。 */
  .field.two { --two-field-control-height: 44px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; margin-bottom: 12px; }
  .field.two .field { min-width: 0; margin-bottom: 0; }
  .field.two input, .field.two select { min-width: 0; height: var(--two-field-control-height); }
  .date-input-frame { width: 100%; height: var(--two-field-control-height); overflow: hidden; background: var(--surface-2); border: 1px solid var(--border); border-radius: 9px; }
  .field .date-input-frame input { display: block; width: 100%; max-width: 100%; height: 100%; margin: 0; border: 0; border-radius: 0; background: transparent; }
  .date-input-frame:focus-within { box-shadow: 0 0 0 2px var(--accent); }
  .field .date-input-frame input:focus-visible { box-shadow: none; }
  .req { color: var(--critical); font-weight: 700; }
  /* opacity:.6会连聚焦时的box-shadow描边一起压暗——同一个--accent叠上60%透明度，跟其它
     字段满透明度的深绿描边比会显得发灰、明显是另一种绿。这个字段是只读的(算自editingPlan[0]
     .date，点了也改不了内容)，照抄.sort-sel:focus-visible那条"不需要焦点环"的先例，
     直接关掉，不是调颜色去凑。 */
  .f-day-auto { opacity: .6; }
  .f-day-auto:focus-visible { outline: none; box-shadow: none; }
  .sheet-actions { display: flex; gap: 10px; margin-top: 6px; }
  /* 段落标题用普通文字色，靠字重/字号表达重要性——强调色要留给真正可交互的东西。
     用 --accent 时它跟同屏的按钮同色，读起来像是可以点的链接。 */
  .subhead { font-size: 13px; font-weight: 700; margin: 18px 0 8px; color: var(--text); }
  .sheet-divider { border: none; border-top: 1px solid var(--border); margin: 22px 0 2px; }
  /* 分段控件（手动添加/公式生成）：选中态不该长得像按钮。改成"凹槽 + 浮起的滑块"——
     整条是 --surface-2 凹槽，选中那一段是浮起的 --surface 滑块。原来选中态是
     "淡绿底 + 绿描边 + 绿字"，跟同屏的绿色标题/绿色实心按钮抢同一个强调色，
     四个语义完全不同的东西共用一个绿，颜色传达不出任何层级差异。 */
  .plan-mode-toggle { display: flex; gap: 3px; margin-bottom: 12px; padding: 3px;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 11px; }
  .pm-btn { flex: 1; padding: 7px; border-radius: 8px; border: none; background: none;
    color: var(--text-muted); font-size: 13px; font-weight: 600; font-family: inherit; }
  .pm-btn.active { background: var(--surface); color: var(--text); box-shadow: var(--e1); }
  .checkline { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 12px; color: var(--text); }
  .checkline input { width: 18px; height: 18px; flex: none; }
  .switch-row { display: flex; align-items: center; justify-content: space-between; font-size: 14.5px; font-weight: 600; padding: 4px 0 10px; }
  .switch { position: relative; display: inline-block; width: 44px; height: 26px; flex: none; }
  .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; }
  .switch-track { position: absolute; inset: 0; background: var(--border); border-radius: 999px; transition: background .18s ease; }
  .switch-track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .18s ease; }
  .switch input:checked + .switch-track { background: var(--accent-fill); }
  .switch input:checked + .switch-track::after { transform: translateX(18px); }
  .notify-add { display: flex; gap: 8px; margin-top: 10px; }
  .notify-add select, .notify-add input[type="time"] { background: var(--surface-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 9px; padding: 8px 9px; font-size: 13.5px; font-family: inherit; }
  .notify-add .btn { flex: none; padding: 8px 14px; }
  .notify-rule { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--surface-2);
    border-radius: 12px; margin-bottom: 7px; font-size: 13.5px; }
  .notify-rule .nr-text { flex: 1; }
  .notify-rule .nr-del { background: none; border: none; color: var(--text-muted); font-size: 12.5px; font-weight: 600; padding: 2px 6px; }
  .notify-test-note { margin: 6px 2px 0; padding: 0; text-align: left; }

  /* plan editor */
  .plan-sum { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .plan-sum .c { background: var(--surface-2); border-radius: 8px; padding: 6px 10px; font-size: 12px; color: var(--text-muted); }
  .plan-sum .c b { color: var(--text); font-family: var(--font-num); }
  .gen-panel { background: var(--surface-2); border-radius: 16px; padding: 12px; margin-bottom: 12px; }
  .gen-panel .field.two { margin-bottom: 10px; }
  .batch { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; background: var(--surface-2); border-radius: 9px; padding: 9px 10px; margin-bottom: 10px; font-size: 12.5px; color: var(--text-muted); }
  .batch select, .batch input { padding: 6px 8px; font-size: 12.5px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); color: var(--text); font-family: inherit; }
  .batch input { width: 84px; font-family: var(--font-num); }
  /* "应用到全部"是批量填充的局部小工具，不是提交整个表单——降到第④档(tertiary)。
     它以前跟 .btn.primary 的样式一模一样(同样 accent 实心底)，在浅色下是一片浅灰区域里
     的深色块，比底下真正的"保存"还抢眼。 */
  .batch button { flex: none; background: var(--surface); color: var(--accent); border: 1px solid var(--border);
    border-radius: 7px; padding: 6px 12px; font-size: 12.5px; font-weight: 600; }
  .plan-rows { border: 1px solid var(--border); border-radius: 16px; max-height: 360px; overflow: auto; margin-bottom: 8px; }
  .prow { border-top: 1px solid var(--border); padding: 8px 9px; }

  .prow .chk { display: flex; align-items: center; gap: 3px; font-size: 11px; color: var(--text-muted); white-space: nowrap; }

  .prow .r2 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .prow .r2 > div { display: flex; flex-direction: column; gap: 2px; }

  .prow .r2 input { padding: 6px 5px; font-size: 12.5px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); width: 100%; font-family: var(--font-num); }

  .dl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; margin-bottom: 16px; }
  .dl-grid .k { font-size: 11.5px; color: var(--text-muted); }
  .dl-grid .v { font-size: 15px; font-weight: 600; margin-top: 1px; }
  .dl-grid .full { grid-column: 1 / -1; }
  .dl-warn { background: var(--warning-soft); color: var(--warning); border-radius: 9px; padding: 10px 12px; font-size: 12.5px; font-weight: 600; margin-bottom: 14px; }
  .sch-wrap { max-height: 320px; overflow: auto; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 16px; }
  table.sch { width: 100%; border-collapse: collapse; font-size: 12px; }

  table.sch th:first-child, table.sch td:first-child { text-align: left; }
  table.sch thead th { position: sticky; top: 0; background: var(--surface-2); color: var(--text-muted); font-size: 11px; font-weight: 600; }
  table.sch tbody tr:last-child td { border-bottom: none; }
  table.sch tr.paidrow td { color: var(--text-muted); text-decoration: line-through; }
  table.sch tr.nextrow td { background: var(--accent-soft); }
  .per { color: var(--text-muted); font-family: var(--font-num); }

  .modal-scrim { position: fixed; inset: 0; background: rgba(15,20,30,.55); z-index: 50; display: none; align-items: center; justify-content: center; padding: 24px; }
  .modal-scrim.open { display: flex; }
  .modal { background: var(--surface); border-radius: 22px; max-width: 380px; width: 100%; padding: 20px; box-shadow: 0 8px 40px rgba(0,0,0,.3); }
  .modal .mtitle { font-size: 16px; font-weight: 700; margin-bottom: 8px; overflow-wrap: break-word; word-break: break-word; }
  /* opts.thirdLabel的按钮挪到了标题行右上角(见下面#mThird规则)，标题行本身要改成横向
     布局才能容纳；.mtitle-row内的.mtitle不再需要自己的margin-bottom，间距交给行本身。 */
  .modal .mtitle-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .modal .mtitle-row .mtitle { margin-bottom: 0; }
  .modal .mbody { font-size: 13.5px; color: var(--text); white-space: pre-line; margin-bottom: 18px; line-height: 1.55; overflow-wrap: break-word; word-break: break-word; }
  .modal-check { display: flex; align-items: flex-start; gap: 9px; margin: -4px 0 18px; color: var(--text); font-size: 13px; line-height: 1.45; cursor: pointer; }
  .modal-check input { width: 17px; height: 17px; margin: 1px 0 0; accent-color: var(--accent); flex: none; }
  #mMonthInput, #mAmountInput, #mDateInput { width: 100%; background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 9px; padding: 10px 11px; font-size: 15px; font-family: inherit; margin: -8px 0 18px; }
  /* 金额输入框下面那行解释默认值含义的小字(提前结清用："默认¥X = 只还本金、利息为0")。
     跟输入框是两个独立元素、各自控制显隐——ask()的opts.amountHint没传就不显示这一行。 */
  #mAmountInput { margin-bottom: 6px; }
  .modal .mhint { font-size: 12px; color: var(--text-muted); line-height: 1.5; margin: 0 2px 16px; }
  .modal-actions { display: flex; gap: 10px; }
  /* 第三个按钮(opts.thirdLabel)是"取消/确认"之外的另一条路径——真机验证过一版"独立一行、
     跟取消同款灰底"的做法，问题是视觉权重跟"取消"一样重，容易让人低估它的破坏性(这个
     操作实际上跟"确认"一样不可逆)。改成标题行右上角的纯文字小链接：足够弱化、不会被
     误当成跟确认/取消同等地位的选项，具体后果留给点击后的二次确认弹窗说清楚，这里
     的文案可以很短。 */
  #mThird { flex: 0 0 auto; background: none; border: none; padding: 2px 0; margin: 0;
    font-size: 12.5px; font-weight: 600; color: var(--text-muted); text-decoration: underline;
    text-underline-offset: 2px; white-space: nowrap; cursor: pointer; }
  #mThird:active { opacity: .6; }

  /* 登录只保护云功能，不再阻断本地账本。这个表面默认隐藏，仅在用户主动进入AI、云备份或
     账户登录时打开；取消后立即回到原页面继续本地使用。 */
  .login-gate { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: none; align-items: center; justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); }
  .login-gate.open { display: flex; }
  .login-gate .data-actions > .btn[hidden] { display: none !important; }
  /* 冷启动时复用登录门的品牌开屏，但它不是登录提示：不显示也不接收任何登录操作。 */
  .login-gate.startup-splash .data-actions { display: none; }
  .login-gate-inner { max-width: 340px; width: 100%; text-align: center; }
  .gate-purpose { color: var(--text-muted); font-size: 13px; line-height: 1.55; margin: -6px 8px 18px; }
  .login-gate .data-actions { flex-direction: column; }
  .apple-login-btn { background: #000; color: #fff; border-color: #000; }
  .apple-login-btn:active { background: #1c1c1e; }
  .apple-login-logo { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 20px; line-height: 1; }

  .gate-icon { display: flex; justify-content: center; margin-bottom: 14px; }
  .gate-icon img { width: 108px; height: 108px; object-fit: cover; border-radius: 22px; border: 1px solid var(--border); }

  .gate-hw { display: block; width: 210px; height: auto; margin: 0 auto 22px; overflow: visible; }
  .hw-letter { fill: none; stroke: var(--accent); stroke-width: 12; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: var(--len); stroke-dashoffset: var(--len); }
  .login-gate.open .hw-letter { animation: hwDraw .5s linear both; animation-delay: calc(var(--i) * 90ms + 150ms); }
  @keyframes hwDraw { to { stroke-dashoffset: 0; } }

  .login-gate .data-actions { opacity: 0; transform: translateY(6px); pointer-events: none; }
  .login-gate.open .data-actions { animation: gateBtnIn .4s ease-out both; animation-delay: 1.45s; }
  @keyframes gateBtnIn { to { opacity: 1; transform: translateY(0); pointer-events: auto; } }

  @media (prefers-reduced-motion: reduce) {
    .login-gate.open .hw-letter { animation: none !important; stroke-dashoffset: 0 !important; }
    .login-gate.open .data-actions { animation: none !important; opacity: 1 !important; transform: none !important; pointer-events: auto !important; }
  }

  .subpage { position: fixed; inset: 0; z-index: 35; background: var(--bg); transform: translateX(100%);
    transition: transform .28s cubic-bezier(.2,.7,.3,1); overflow-y: auto; overscroll-behavior: contain;
    scroll-padding: 12px 0 max(20px, calc(12px + env(safe-area-inset-bottom))); }
  .subpage.open { transform: translateX(0); }
  /* iOS 左边缘返回：原生 edge-pan 将实时进度写入 --az-back-progress。只给 full-screen
     subpage 跟手，sheet 继续使用自己的 grip/横滑手势；松手后按已有返回链关闭或弹回。 */
  .subpage.open.az-interactive-back { transform: translateX(calc(var(--az-back-progress, 0) * 100%)); transition: none; }
  .subpage.open.az-interactive-back.az-interactive-back-commit { transition: transform .18s cubic-bezier(.2,.72,.32,1); }
  @media (prefers-reduced-motion: reduce) {
    .subpage, .subpage.open.az-interactive-back.az-interactive-back-commit { transition: none; }
  }
  .subpage-header { display: flex; align-items: center; gap: 4px; padding: max(14px, env(safe-area-inset-top)) 6px 14px; position: sticky; top: 0;

  .premium-hero { text-align: center; padding: 22px 10px 18px; }
  .premium-hero-ic { width: 56px; height: 56px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);

  .premium-hero-ic svg { width: 28px; height: 28px; }
  /* 顶部图标区轻微浮动动效，呼应X订阅页的"图标动效区"，但幅度很小、不抢内容注意力 */
  @keyframes premiumHeroFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  .premium-hero-ic { animation: premiumHeroFloat 2.4s ease-in-out infinite; }

  /* "关于我们"顶部App图标——不能直接拿一张矩形PNG贴上去，跟登录门`.gate-icon img`同一套
     圆角处理（22px/108px的比例，这里图标更小，按比例算成14px），保持全项目图标视觉一致。 */
  .about-icon { width: 64px; height: 64px; object-fit: cover; border-radius: 14px;
    border: 1px solid var(--border); display: block; margin: 0 auto 12px; }

  .premium-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .premium-tab { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2);

  /* 多策略对比规划(StrategyCompareScreen)——统计tab"最该先动手的地方"下面的入口。
     外层用现成的.sec(跟FindingList/ActionBox同一套section节奏)，这里只补按钮自己的样式。 */
  .strategy-cta .btn { width: 100%; margin-top: 10px; }
  /* 自定义顺序：上下移动按钮，不做真正的拖拽——见AGENTS.md"多策略对比规划"一节，
     这个决定是权衡过的：这批列表通常<15项，按钮比touch drag更可靠、也不需要重新
     实现一套手势状态机(那套代码本来就是为"在还债务"tab的jiggle模式+swipe写的，
     跟这里"纯排序、没有swipe"的需求不匹配，硬套反而更容易出错)。 */
  .strat-order-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border-radius: 12px; background: var(--surface-2); margin-bottom: 6px; }
  .strat-order-row:last-child { margin-bottom: 0; }
  .strat-order-idx { font-size: 12px; color: var(--text-faint); font-family: var(--font-num); width: 16px; flex: none; }
  .strat-order-name { flex: 1; font-size: 13.5px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .strat-order-bal { font-size: 12px; color: var(--text-muted); font-family: var(--font-num); flex: none; }

  /* 结果：3行，每行=一种策略(颜色点+名字+总利息+还清时间)。⚠️2026-08-05删掉了
     .strat-result-row.best那圈accent色描边+内阴影——这套"强调色描边"在这个App里到处都是
     "可点选中态"的视觉语言(价格卡选中、分段控件选中态)，但这三行不是按钮，点了什么都不会
     发生，描边纯粹是误导性的可交互信号，用户真机反馈"看起来像另外两个也能点"。"最省"这件事
     已经由.best-badge文字胶囊说清楚了，不需要再借一圈选中框重复表达。 */
  .strat-result-row { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 12px;
    background: var(--card-grad); border: 1px solid var(--hair); margin-bottom: 8px; }
  .strat-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .strat-dot.s1 { background: var(--strat-1); }
  .strat-dot.s2 { background: var(--strat-2); }
  .strat-dot.s3 { background: var(--strat-3); }
  .strat-result-name { flex: 1; font-size: 13.5px; font-weight: 700; min-width: 0; }
  .strat-result-name .best-badge { display: inline-block; margin-left: 6px; font-size: 10.5px; font-weight: 700;
    color: var(--on-accent); background: var(--accent-fill); border-radius: 999px; padding: 1px 7px; vertical-align: 1px; }
  .strat-result-nums { text-align: right; flex: none; }
  /* .kk是"总利息"这行小字标签——2026-08-05新增，原来加粗大字的¥数字没有任何文字说明它是
     什么，用户反馈"莫名其妙"，补上标签跟这个App其它KPI卡片"大数字+小字说明"的既有模式统一。 */
  .strat-result-nums .kk { font-size: 10px; color: var(--text-faint); margin-bottom: 1px; }
  .strat-result-nums .v { font-size: 14px; font-weight: 700; font-family: var(--font-num); }
  .strat-result-nums .k { font-size: 10.5px; color: var(--text-muted); }

  /* 压力曲线对比图：静态SVG，不做scrub手势(3条不同长度的线做逐帧命中判定成本明显更高，
     且这张图的核心信息——"哪个策略更快归零"——已经靠3行结果卡片里的日期数字说清楚了，
     图表纯粹是视觉印证，不需要再精确到"某个月的余额是多少"这个粒度)。 */
  .strat-chart-wrap { position: relative; background: var(--card-grad); border: 1px solid var(--hair);
    border-radius: 16px; padding: 14px 14px 10px; margin: 14px 0; }
  .strat-chart-wrap svg { display: block; width: 100%; height: auto; }
  /* strat-chart-plot单独包一层svg+两个方向提示(不含下面的图例)——这样"左上/右下"这两个
     标签能相对"绘图区自己的盒子"定位，不用猜图例多高再拿wrap的bottom反推，2026-08-05
     新增。左上"剩余待还 ¥X"(Y轴含义+起点值，3条线起点相同标一次够了)，右下"时间→"
     (X轴方向)——两个最起码的方向提示，不是完整刻度轴，见StrategyChart.tsx顶部注释。 */
  .strat-chart-plot { position: relative; }
  .strat-chart-axis-y { position: absolute; left: 0; top: 0; font-size: 10.5px; color: var(--text-faint); }
  .strat-chart-axis-x { position: absolute; right: 0; bottom: 0; font-size: 10.5px; color: var(--text-faint); }
  .strat-legend { display: flex; gap: 14px; justify-content: center; margin-top: 8px; flex-wrap: wrap; }
  .strat-legend-item { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--text-muted); }

  .pf-list { margin: 4px 0 20px; }
  .pf-row { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .pf-row:last-child { border-bottom: none; }
  .pf-ic { width: 22px; height: 22px; flex: none; color: var(--accent); margin-top: 1px; }
  .pf-ic svg { width: 100%; height: 100%; }
  .pf-title { font-size: 14px; font-weight: 600; }
  .pf-desc { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  .price-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 18px; }
  .price-card { border: 2px solid var(--border); border-radius: 16px; padding: 14px; background: var(--surface);
    text-align: left; font-family: inherit; }
  .price-card .pc-badge { display: inline-block; font-size: 10.5px; font-weight: 700; color: var(--on-accent); background: var(--accent-fill);
    border-radius: 999px; padding: 2px 8px; margin-bottom: 6px; }
  .price-card .pc-amt { font-size: 19px; font-weight: 700; }
  .price-card .pc-period { font-size: 12px; color: var(--text-muted); }

  /* 2026-08-04：去掉了"原价划线+限时优惠"这套电商促销话术(pc-strike/pc-limited已删)——
     跟AI额度弹窗"坦诚说清楚成本"的口吻矛盾，且"限时"永不过期就是个假锚点，负债人群对
     这类营销话术的信任度是负的。现在只剩朴素的现价，卡片外框也去掉了.selected常驻
     高亮(只剩一张卡，"选中态"这个语义已经不存在了)。 */
  .price-card .pc-price-row { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }

  /* ===== AI 债务助手：聊天式界面（欢迎态+快捷芯片、统一消息流、吸底输入框） =====
     #aiScreen需要真正的flex-column三段布局(header固定/中间可滚动/输入框天然贴在真实屏幕底边)，
     不能像其它.subpage那样靠overflow-y:auto整页滚动+sticky模拟"吸底"——sticky只在"内容比
     视口高、需要滚动"时才会把元素顶到视口底边，内容不够高时(比如欢迎态消息很少)它就停在
     自然流位置，底下露一截空白。真机上头部/输入框的实际高度跟桌面估算的min-height常量对不上，
     这个问题在真机上被实测到了。改成#aiScreen自己overflow:hidden，内部.ai-thread单独
     flex:1+overflow-y:auto滚动，.ai-composer作为普通flex子元素——flex:1的中间区域会精确
     吃掉剩余空间，把它推到真实底边，不需要再猜任何高度常量。 */
  #aiScreen.subpage { display: flex; flex-direction: column; overflow: hidden; }
  /* ⚠️width:100%不能省。#aiScreen是flex-column容器，.ai-thread作为它的flex子元素带着
     "margin:0 auto"——flex布局里交叉轴上的auto margin优先级高于align-items:stretch，会
     直接取消拉伸、把宽度退化成fit-content再居中。真机上的表现是：消息很短时(比如刚发出
     一个"1"、AI还在"思考中")整条thread被缩成一根窄条居中，两个气泡看着像居中排列、
     "思考中"三个字还被挤成竖排；等AI回了一大段长文本，fit-content撑满可用宽度，气泡才
     "自己"回到左右两侧。加上width:100%后宽度恒定是100%(上限560px)，气泡从第一条起就
     稳定贴边。.ai-composer当年就写了width:100%所以没露出这个问题，这里是漏了。 */
  /* min-height:0是flex子元素能正常收缩、让overflow-y:auto生效的必要条件——flex item默认
     min-height:auto，会被内容撑开导致.ai-thread长过父容器、外层出现整页滚动而不是内部滚动。 */
  #aiScreen .ai-thread { flex: 1; width: 100%; overflow-y: auto; min-height: 0; overscroll-behavior: contain; }
  .ai-thread { padding: 4px 16px 8px; max-width: 560px; margin: 0 auto; }
  .ai-welcome { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    gap: 14px; padding: 22px 14px 10px; height: 100%; }
  .ai-welcome-ic { width: 56px; height: 56px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
    display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 8px rgba(var(--accent-rgb),.06); flex: none; }
  .ai-welcome-ic svg { width: 28px; height: 28px; overflow: visible; }
  .ai-welcome h2 { font-size: 17px; font-weight: 700; margin: 0; }
  .ai-welcome p { font-size: 13px; color: var(--text-muted); line-height: 1.6; margin: 0; max-width: 30ch; }
  /* 本月剩余次数——比正文再弱一档，是参考信息不是主角，不该跟欢迎语抢注意力 */
  .ai-quota-note { font-size: 12px; color: var(--text-faint); margin: -6px 0 0; }
  .ai-quota-note strong { color: var(--text-muted); font-weight: 700; }
  .ai-chips { display: flex; flex-direction: column; gap: 8px; width: 100%; margin-top: 6px; }
  .ai-chip { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 12px 14px;
    border-radius: 14px; border: 1px solid var(--border); background: var(--surface); color: var(--text);
    font-size: 13.5px; font-weight: 500; box-shadow: var(--e1); font-family: inherit; }
  .ai-chip.primary { border-color: transparent; background: linear-gradient(155deg, var(--graphite-a), var(--graphite-b));
    color: var(--graphite-text); font-weight: 600; }
  .ai-chip-ic { width: 26px; height: 26px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center;
    background: rgba(var(--accent-rgb),.12); color: var(--accent); }
  .ai-chip.primary .ai-chip-ic { background: rgba(255,255,255,.14); color: var(--graphite-text); }
  .ai-chip-ic svg { width: 14px; height: 14px; }

  .ai-chat-log:empty { display: none; }
  .ai-chat-log { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
  .ai-msg { max-width: 85%; padding: 10px 13px; border-radius: 14px; font-size: 14px; line-height: 1.6;
    white-space: pre-wrap; word-break: break-word; }
  .ai-msg strong { font-weight: 700; }
  .ai-msg.user { align-self: flex-end; background: var(--accent-fill); color: var(--on-accent); border-bottom-right-radius: 4px; }
  .ai-msg.bot { align-self: flex-start; background: var(--surface-2); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .ai-msg.pending { color: var(--text-muted); display: flex; align-items: center; gap: 7px; }
  .ai-typing-dots { display: inline-flex; gap: 3px; }
  .ai-typing-dots span { width: 5px; height: 5px; border-radius: 50%; background: var(--text-faint); animation: aiTypingBounce 1.1s infinite ease-in-out; }
  .ai-typing-dots span:nth-child(2) { animation-delay: .15s; }
  .ai-typing-dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes aiTypingBounce { 0%, 60%, 100% { opacity: .35; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-2px); } }
  @media (prefers-reduced-motion: reduce) { .ai-typing-dots span { animation: none; opacity: .7; } }
  /* renderAiText()把回复切成段落/列表两种块，不再是裸span堆在一起——.ai-msg本身的
     white-space:pre-wrap继续被这些块级子元素继承(段落内部还留着的"\n"照样按空行渲染)。 */
  .ai-msg-p { margin: 0 0 8px; }

  /* 追问建议芯片：紧贴在聊天记录下面、composer上面，跟欢迎态那组大卡片(.ai-chip)不是

  .ai-suggest-row { display: flex; flex-wrap: wrap; gap: 7px; padding: 0 16px 10px; max-width: 560px; margin: 0 auto;

  /* 历史对话sheet是从#aiScreen这个.subpage内部打开的，必须比.subpage(z-index:35)更高，
     不能沿用其它.sheet默认的z-index:31(那是给主view层级打开的sheet设计的，会被subpage盖住)。 */
  #aiHistorySheet, #scrimAiHistory { z-index: 36; }

  /* 每日额度用完/首次进入AI页面的说明弹窗——刻意不跟#modalScrim的askAsync()共用，那套
     是给"确定/取消"事务性确认设计的朴素样式；这里想要更"精致灵动"(类似Telegram)的
     进场观感，靠CSS弹性缓动曲线做，没有引入任何动画库——这个项目所有动效(.wand.cast等)
     一直是手写keyframes，没用过库，一个弹窗没必要破例。z-index跟.modal-scrim同一档(50)：
     概念上是同一类"盖在一切之上的模态框"，比它所在的#aiScreen(35)/#aiHistorySheet(36)
     都高，toast(60)依然能盖在它上面。 */
  .ai-limit-scrim { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.45);
    backdrop-filter: blur(2px); animation: aiLimitScrimIn .2s ease both; }

  .ai-limit-modal { position: fixed; z-index: 50; left: 50%; top: 50%; width: min(320px, calc(100vw - 48px));

  .ai-import-add { width: 100%; min-height: 76px; border: 1.5px dashed var(--border-strong); border-radius: 16px; background: var(--surface-2); color: var(--text); font: inherit; font-size: 14px; font-weight: 700; }
  .ai-import-add span { display: block; color: var(--accent); font-size: 25px; line-height: 1; margin-bottom: 4px; }

  .ai-import-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 12px 0; }
  .ai-import-image { position: relative; overflow: hidden; min-height: 150px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface-2); }
  .ai-import-image img { display: block; width: 100%; height: 150px; object-fit: cover; }
  .ai-import-image-index { position: absolute; left: 7px; top: 7px; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.68); color: #fff; font-size: 12px; font-weight: 700; }
  .ai-import-image-actions { display: flex; justify-content: flex-end; gap: 5px; padding: 7px; }
  .ai-import-image-actions button { width: 32px; height: 30px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface); color: var(--text); font: inherit; }

  .ai-import-spinner { width: 15px; height: 15px; flex: none; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: aiImportSpin .8s linear infinite; }
  @keyframes aiImportSpin { to { transform: rotate(360deg); } }
  .ai-import-rules { margin: 14px 0; padding: 13px 14px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); }
  .ai-import-rules strong { font-size: 13px; }

  @media (prefers-reduced-motion: reduce) { .ai-import-spinner { animation: none; } }

  /* 高级统计报表：横向条形图(债务余额对比)/堆叠条形图(类型占比)/折线图(负债预测走势)，
     全部手写SVG/HTML，不引入图表库——这是项目里第一批图表，之前没有先例可抄。配色套用
     dataviz skill的默认类别色板，已用validate_palette.js对着本项目实际的浅色#FFFFFF/
     深色#191D24重新验证过(不是直接抄skill文档里参考色的验证结果，那是对着skill自己的
     参考底色#fcfcfb/#1a1a19验证的，跟本项目的底色不是一回事)。 */
  .viz-root {
    /* 分类色：色相取自 --ic-* 图标家族，但饱和度压低一档——大面积要少色相低饱和，
       小面积才能多色相高饱和（见"图标徽章色家族"一节那条原则）。
       ⚠️替换掉的是 dataviz skill 自带的**品牌中性占位色板**：那套本来就是设计成
       "先用着、之后换成你自己的品牌派生色"的，我们一直没做那次替换，结果统计页
       出现"前几张图全是品牌绿、到类型占比突然一片通用彩虹"的割裂感。 */
    --series-1: #409677; --series-2: #406E96; --series-3: #634096; --series-4: #96405D;
    --series-5: #967440; --series-6: #408596; --series-7: #569640; --series-8: #964096;
    /* 本金/利息：**故意不用同色系两级**。同色两级在浅色下有死结——两者都要 >=3:1 对白底，
       就只能都很深，反而更"闷"，而且对红绿色盲几乎不可分辨。改成绿(本金)/琥珀(利息)：
       色相差 120 度。四项校验全过：相邻 3.10(浅)/3.06(深)、各自对底 >=3、
       色盲模拟距离 120(浅)/191(深)——原来同色系两级的色盲距离近乎 0。这一对**保留不动**，
       它是唯一有强语义理由(必须互相区分、且已经过完整校验)绑死绿/琥珀两色的图。
       --ch-mag/--ch-cost/--ch-line **2026-07-31 统计页重做成"债务报告"时定成"一个颜色
       = 一个角色"的 3 色制**，不是"一张图一个颜色"：--ch-mag 量级（本金段、排行条）·
       --ch-cost 成本（利息段）· --ch-line 进度（还清走势线）。三色跑 dataviz 的
       validate_palette.js（--pairs all）浅深两套全部 ALL PASS。
       ⚠️中间还有一版是 --ch-line 蓝 #2D63C8 / --ch-bar 紫 #7451B8，那一对是**只验了
       每个颜色单独对底色、没验它俩之间**就定的；补验后 normal ΔE 只有 9.8（硬性下限 15）、
       protan 3.4——蓝紫在正常视觉下就已经很接近，红绿色盲下基本是同一个颜色。
       这一版 --ch-bar 整个去掉了（排行条改用 --risk/--calm 的风险二档）。
       --risk/--calm 是排行条的风险二档（红=年化≥18% / 蓝=其余）：本来想按 App 现有的
       .tag.rate-hi/mid/lo 做三档（红/琥珀/蓝），验出来红↔琥珀 normal ΔE 只有 12.4、
       deutan 4.5，**三档在色相上就不成立**，改成二档 + 每行直接写利率数字，颜色不是
       唯一编码。（这条对 .tag 那三个标签色本身同样适用——它们现在是靠标签上的文字在扛区分。）
       --pie-1..6 是类型占比甜甜圈的分类色。 */
    --ch-principal: #184E3A; --ch-interest: #B88B3D;
    --ch-mag: #2B6CB8; --ch-cost: #C4892F; --ch-line: #068468;
    --risk: #C42F2F; --calm: #2F639C;
    --pie-1: #2B6CB8; --pie-2: #C4892F; --pie-3: #068468;
    --pie-4: #96405D; --pie-5: #634096; --pie-6: #408596;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      --series-1: #72C0A3; --series-2: #729CC0; --series-3: #9172C0; --series-4: #C0728C;
      --series-5: #C0A172; --series-6: #72B0C0; --series-7: #86C072; --series-8: #C072C0;
      --ch-principal: #9ADAC3; --ch-interest: #8C6C36;
      --ch-mag: #5590D8; --ch-cost: #BC8B3C; --ch-line: #43A883;
      --risk: #DC6767; --calm: #5E96D0;
      --pie-1: #5590D8; --pie-2: #BC8B3C; --pie-3: #43A883;
      --pie-4: #C0728C; --pie-5: #9172C0; --pie-6: #72B0C0;
    }
  }
  :root[data-theme="dark"] .viz-root {
    --series-1: #72C0A3; --series-2: #729CC0; --series-3: #9172C0; --series-4: #C0728C;
    --series-5: #C0A172; --series-6: #72B0C0; --series-7: #86C072; --series-8: #C072C0;
    --ch-principal: #9ADAC3; --ch-interest: #8C6C36;
    --ch-mag: #5590D8; --ch-cost: #BC8B3C; --ch-line: #43A883;
    --risk: #DC6767; --calm: #5E96D0;
    --pie-1: #5590D8; --pie-2: #BC8B3C; --pie-3: #43A883;
    --pie-4: #C0728C; --pie-5: #9172C0; --pie-6: #72B0C0;
  }
  /* ===========================================================================
     统计页 —— 2026-07-31 从"看板"重做成"债务报告"（react/src/report/）。
     ---------------------------------------------------------------------------
     旧版那套（.viz-block 卡片 / .viz-bar-* 横条 / .viz-stack 堆叠条 / .viz-legend
     色块图例 / .viz-mode-toggle 文字切换器 / .sumcard-* 总结行 / .pchart-* 柱状图 /
     .chart-plot 坐标轴外壳 / .report-hero-menu ⋮ 菜单）整块删除——这些类在 React 侧
     已经零引用（改版时逐个 grep 确认过），留着就是死代码。
     =========================================================================== */

  /* ---------- 报告头 ---------- */
  .rpt-head { padding: 6px 0 18px; }
  .rpt-kicker { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--text-faint); }
  .rpt-title { font-size: 25px; font-weight: 700; line-height: 1.3; margin: 8px 0 0; letter-spacing: -.01em; }
  .rpt-title em { font-style: normal; color: var(--ch-line); }
  .rpt-lede { font-size: 13.5px; line-height: 1.75; color: var(--text-muted); margin: 10px 0 0; }
  .rpt-lede b { color: var(--text); font-weight: 700; font-family: var(--font-num); }
  /* 计算口径说明展开后的正文。⚠️不复用全局 .footnote：这一页里走势图的免责说明
     也是 .footnote，两者共用类名会让"按类名找口径说明"抓到错的那个。 */
  .rpt-note { font-size: 11.5px; color: var(--text-muted); line-height: 1.7;
    text-align: left; margin: -2px 2px 8px; }
  .rpt-note b { color: var(--text); }

  /* ---------- 语义段落：靠留白和一条发丝线分段，不是每段一张卡 ---------- */
  .sec { padding: 20px 0; border-top: 1px solid var(--hair); }
  .sec-q { font-size: 11.5px; font-weight: 600; color: var(--text-faint); letter-spacing: .04em; }
  .sec-a { font-size: 17px; font-weight: 700; line-height: 1.45; margin: 5px 0 0; letter-spacing: -.005em; }
  .sec-a .n { font-family: var(--font-num); }
  .sec-note { font-size: 12.5px; line-height: 1.7; color: var(--text-muted); margin-top: 8px; }
  .sec-note b { color: var(--text); font-family: var(--font-num); font-weight: 700; }

  /* ---------- 结论列表 ---------- */
  .finding { display: flex; gap: 11px; padding: 11px 0; border-bottom: 1px solid var(--hair); }
  .finding:last-child { border-bottom: none; }
  .finding-ic { width: 30px; height: 30px; border-radius: 9px; flex: none; display: flex; align-items: center; justify-content: center; }
  .finding-ic svg { width: 16px; height: 16px; }
  .finding-ic.risk { background: var(--critical-soft); color: var(--critical); }
  .finding-ic.warn { background: var(--warning-soft); color: var(--warning); }
  .finding-ic.info { background: var(--good-soft); color: var(--good); }
  .finding-ic.good { background: var(--accent-soft); color: var(--accent); }
  .finding-t { font-size: 13.5px; font-weight: 700; line-height: 1.4; }
  .finding-s { font-size: 12px; color: var(--text-muted); margin-top: 3px; line-height: 1.6; }
  .finding-s b { color: var(--text); font-family: var(--font-num); font-weight: 700; }

  /* ---------- "最该先动手"展开块：底色跟着那条结论自己的 tone 走 ---------- */
  .act-box { border-radius: 14px; padding: 14px 15px; margin-top: 12px; }
  .act-box.risk { background: var(--critical-soft); }
  .act-box.warn { background: var(--warning-soft); }
  .act-box.info { background: var(--good-soft); }
  .act-box.good { background: var(--accent-soft); }
  .act-top { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; }
  .act-box.risk .act-top { color: var(--critical); }
  .act-box.warn .act-top { color: var(--warning); }
  .act-box.info .act-top { color: var(--good); }
  .act-box.good .act-top { color: var(--accent); }
  .act-top svg { width: 15px; height: 15px; flex: none; }
  .act-body { font-size: 12.5px; line-height: 1.7; color: var(--text); margin-top: 7px; opacity: .85; }
  .act-body b { font-family: var(--font-num); font-weight: 700; }
  .act-list { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .act-item { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
  .act-item .nm { flex: none; width: 52px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .act-item .track { flex: 1; height: 6px; border-radius: 999px; background: rgba(0,0,0,.10); overflow: hidden; }
  [data-theme="dark"] .act-item .track,
  :root:where(:not([data-theme="light"])) .act-item .track { background: rgba(255,255,255,.12); }
  /* ⚠️display:block 不能省。.fill 是个 <span>，默认 display:inline，而 **inline 元素会
     静默忽略 width/height**——内联样式 width:100%/68.9%/… 全都算对了却完全不生效，
     实测填充的 getBoundingClientRect() 宽高都是 0，界面上只剩空的灰色底槽，
     条形长度差异和颜色一起消失。.track 有 flex:1 被 flex 容器 blockify 了所以尺寸正常，
     .fill 在它里面没人 blockify，必须自己声明。 */
  .act-item .fill { display: block; height: 100%; border-radius: 999px; }
  .act-item .rt { font-family: var(--font-num); font-weight: 700; width: 62px; text-align: right; }
  .act-box.risk .act-item .fill { background: var(--risk); }
  .act-box.warn .act-item .fill { background: var(--warning); }
  .act-box.info .act-item .fill { background: var(--good); }
  .act-box.good .act-item .fill { background: var(--accent); }
  .act-box.risk .act-item .rt { color: var(--critical); }
  .act-box.warn .act-item .rt { color: var(--warning); }
  .act-box.info .act-item .rt { color: var(--good); }
  .act-box.good .act-item .rt { color: var(--accent); }
  /* 被截断掉的那几笔的合计，右对齐到跟金额列同一条线上 */
  .act-rest { font-size: 11px; color: var(--text); opacity: .6; text-align: right; margin-top: 8px; font-family: var(--font-num); }

  /* ---------- 图容器：不透明，不用毛玻璃（数据标记需要稳定可预测的背景，
       页面底 --app-grad 是渐变，玻璃会让对比度随滚动位置漂移） ---------- */
  .plot-box { background: var(--card-grad); border: 1px solid var(--hair); border-radius: 14px;
    padding: 14px 14px 12px; margin-top: 14px; box-shadow: var(--e1); }

  /* ---------- 还清进度：里程碑标在图上 + 拖动读数（Journey.tsx） ---------- */
  .jread { font-size: 12px; font-weight: 600; color: var(--text-muted); font-family: var(--font-num);
    margin-bottom: 6px; min-height: 17px; }
  .jread .dim { color: var(--text-faint); font-weight: 500; font-family: var(--font-ui); }
  .jchart { position: relative; touch-action: pan-y; }
  .jchart .jsvg { position: absolute; left: 0; right: 0; width: 100%; display: block; }
  .jdot { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--ch-line);
    box-shadow: 0 0 0 3px var(--surface); transform: translate(-50%, -50%); z-index: 2; }
  .jlab { position: absolute; z-index: 3; line-height: 1.35; white-space: nowrap; transition: opacity .12s; }
  .jlab .t { font-size: 11px; font-weight: 700; }
  .jlab .d { font-size: 9.5px; color: var(--text-faint); font-family: var(--font-num); }
  .jlab .a { font-size: 12px; font-weight: 700; font-family: var(--font-num); margin-top: 1px; }
  .jlab.now .t, .jlab.now .a { color: var(--ch-line); }
  .jlead { position: absolute; width: 1px; background: var(--hair); z-index: 1; transition: opacity .12s; }
  /* 拖动时把里程碑淡下去，只留游标——两套标签同时亮着会互相打架 */
  .jchart.scrubbing .jlab, .jchart.scrubbing .jlead, .jchart.scrubbing .jdot { opacity: .18; }
  .jcursor { position: absolute; width: 1px; background: var(--ch-line); opacity: .5;
    transform: translateX(-50%); pointer-events: none; z-index: 4; }
  .jcursor-dot { position: absolute; width: 9px; height: 9px; border-radius: 50%; background: var(--ch-line);
    box-shadow: 0 0 0 3px var(--surface); transform: translate(-50%, -50%); pointer-events: none; z-index: 5; }

  /* ---------- 未来压力：面积 / 柱状两种模式（Pressure.tsx） ---------- */
  .pmode { display: flex; gap: 2px; background: var(--surface-2); border-radius: 9px; padding: 2px; flex: none; }
  .pmode button { background: none; border: none; padding: 3px 9px; border-radius: 7px;
    color: var(--text-muted); font-size: 11px; font-weight: 600; }
  .pmode button.on { background: var(--card-grad); color: var(--text); box-shadow: var(--e1); }
  .psec-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .pread { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; min-height: 17px; }
  .pread .dim { color: var(--text-faint); font-weight: 500; }
  /* ⚠️两种模式共用的画布外壳。这 18px 上边距是给"峰值"标注留的头顶空间，**两种模式
     必须都有**——只给一种加的话，切过去卡片会整体拉长、刻度线跟着跳。
     ⚠️也不能直接给 .achart/.pbars 加 padding：.achart 里有绝对定位的游标竖线和圆点，
     它们的 inset/bottom 百分比是相对 **padding box** 算的，一加 padding 整套坐标就偏。
     ⚠️头顶空间本身不能省：外层 .ascroll 有 overflow-x:auto，而 **overflow-x 一旦不是
     visible，overflow-y 也会被强制成非 visible**，伸到容器外的标注会被整个裁掉。 */
  .pcanvas { padding-top: 18px; }
  .awrap { position: relative; padding-left: 32px; margin-top: 4px; }
  /* top 跟 .pcanvas 的 padding-top 是同一个数，改一个必须改另一个 */
  .agrid { position: absolute; left: 32px; right: 0; top: 18px; height: 104px; pointer-events: none; z-index: 1; }
  .gridline { position: absolute; left: 0; right: 0; border-top: 1px solid var(--hair); }
  .gridline span { position: absolute; right: 100%; top: -6px; padding-right: 5px; font-size: 9.5px;
    color: var(--text-faint); font-family: var(--font-num); }
  .ascroll { overflow-x: auto; overflow-y: hidden; overscroll-behavior-x: contain; scrollbar-width: none; }
  .ascroll::-webkit-scrollbar { display: none; }
  .atrack { width: 100%; }
  .achart { position: relative; height: 104px; }
  .achart svg { width: 100%; height: 100%; display: block; }
  /* 命中区：面积模式没有"这根柱子"这种可点元素，用等分的透明按钮铺满。
     ⚠️必须跟 SVG 采样点对齐——SVG 的 viewBox 宽度取月份数、第 i 个点画在 x=i+0.5，
     正好落在这些 flex 等分格子的中心。 */
  .ahit { position: absolute; inset: 0; display: flex; z-index: 3; }
  .ahit button { flex: 1; min-width: 0; background: none; border: none; padding: 0; height: 100%; }
  .amark { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--text-faint);
    opacity: .45; transform: translateX(-50%); pointer-events: none; z-index: 2; }
  .adot { position: absolute; width: 7px; height: 7px; border-radius: 50%;
    transform: translate(-50%, 50%); pointer-events: none; z-index: 2; box-shadow: 0 0 0 2px var(--surface); }
  .adot.total { background: var(--ch-cost); }
  .adot.prin { background: var(--ch-mag); }
  /* 面积模式的峰值标注：柱状那个靠 .pcol.peak::after 挂在"那根柱子"上，面积图没有
     对应的 DOM，按峰值点坐标单独定位，下面接一个朝下的小三角指回顶点。 */
  .apeak { position: absolute; transform: translateX(-50%); margin-bottom: 6px;
    font-size: 9px; font-weight: 700; color: var(--critical); white-space: nowrap;
    pointer-events: none; z-index: 2; line-height: 1.2; }
  .apeak::after { content: ""; position: absolute; left: 50%; bottom: -5px; transform: translateX(-50%);
    width: 0; height: 0; border-left: 3.5px solid transparent; border-right: 3.5px solid transparent;
    border-top: 4px solid var(--critical); }
  /* 选中的正好是峰值月时，标注让位给读数竖线+圆点 */
  .apeak.dim { opacity: .3; }
  .pbars { display: flex; align-items: flex-end; gap: 2px; height: 104px; }
  .pcol { flex: 1; min-width: 0; height: 100%; display: flex; align-items: flex-end;
    background: none; border: none; padding: 0; position: relative; }
  .pstack { width: 100%; max-width: 22px; margin: 0 auto; height: 100%; display: flex; flex-direction: column-reverse; gap: 2px; }
  .pstack .seg { width: 100%; }
  .pstack .seg.p { background: var(--ch-mag); }
  .pstack .seg.i { background: var(--ch-cost); border-radius: 3px 3px 0 0; }
  .pstack .seg.i.zero { display: none; }
  .pstack .seg.i.zero ~ .seg.p { border-radius: 3px 3px 0 0; }
  .pcol.peak::after { content: "峰值"; position: absolute; left: 50%; top: -14px; transform: translateX(-50%);
    font-size: 9px; font-weight: 700; color: var(--critical); white-space: nowrap; }
  .pcol.dimmed .pstack { opacity: .42; }
  .pcol.active .pstack { filter: brightness(1.14); }
  .axaxis { display: flex; margin-top: 5px; }
  .axtick { flex: 1; min-width: 0; text-align: center; font-size: 9.5px; color: var(--text-faint); }
  .axtick.on { color: var(--text); font-weight: 700; }
  .legend-inline { display: flex; gap: 14px; margin-top: 10px; font-size: 11px; color: var(--text-muted); }
  .legend-inline span { display: flex; align-items: center; gap: 5px; }
  .legend-inline i { width: 8px; height: 8px; border-radius: 2px; }
  .abd { margin-top: 12px; border-top: 1px solid var(--hair); padding-top: 10px; }
  .abd-l { font-size: 11px; color: var(--text-muted); margin: 0 2px 6px; }
  .abd-r { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; padding: 3px 2px; }
  .abd-r .num { font-weight: 600; }

  /* ---------- 排行（Rank.tsx） ---------- */
  .rank-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--hair); }
  .rank-row:last-child { border-bottom: none; }
  .rank-no { width: 17px; font-size: 12px; font-weight: 700; color: var(--text-faint); font-family: var(--font-num); flex: none; }
  .rank-main { flex: 1; min-width: 0; }
  .rank-nm { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .rank-tag { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 999px; }
  .rank-tag.hi { background: var(--critical-soft); color: var(--critical); }
  .rank-bar { height: 5px; border-radius: 999px; background: var(--surface-2); margin-top: 6px; overflow: hidden; }
  .rank-bar i { display: block; height: 100%; border-radius: 999px; }
  .rank-amt { text-align: right; flex: none; }
  .rank-amt .a { font-size: 13px; font-weight: 700; font-family: var(--font-num); }
  .rank-amt .r { font-size: 10.5px; color: var(--text-muted); font-family: var(--font-num); margin-top: 2px; }
  /* ⚠️用 --accent 不用 --calm。--calm 在这一页是**数据色**（排行条里"非高息债务"就是它），
     同一个颜色既当数据编码又当交互控件色，会让人以为这个按钮跟"蓝色那批债务"有关。
     全 App 的"展开更多"只有一种视觉语言，跟 .note-toggle（"计算口径说明"）统一。 */
  .more-btn { background: none; border: none; color: var(--accent); font-size: 12px; font-weight: 600;
    padding: 10px 0 0; display: flex; align-items: center; gap: 4px; font-family: inherit; }
  .more-btn svg { width: 12px; height: 12px; transition: transform .15s; }
  .more-btn.open svg { transform: rotate(180deg); }

  /* ---------- 可旋转甜甜圈（TypePie.tsx） ----------
     ⚠️标签**贴容器左右边缘 + 折线引线**，不是沿半径方向直着往外放。后者在扇区转到
     正左/正右时水平空间只剩 60 多 px，"信用卡分期 27% ¥16,208"放不下，半径只能压到 62。
     贴边缘之后水平空间跟角度无关，半径能给到 76。 */
  /* ⚠️touch-action必须是pan-y不能是none(2026-08-01改)——none会让浏览器在JS跑之前就
     unconditionally拒绝这个区域的任何原生滚动候选手势,不管pieRotate.ts的JS怎么判断方向、
     怎么放行preventDefault都没用，是"上下滑页面路过饼图被拦截"这条反馈的真正根因（比
     JS里unconditional preventDefault更底层）。pan-y交给浏览器识别纵向滚动候选，横向
     转动手势继续由pieRotate.ts的touchmove.preventDefault()接管。 */
  .pie-wrap { position: relative; touch-action: pan-y; user-select: none; }
  .pie-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* ⚠️SVG 的 fill/stroke **不接受 CSS 渐变值**。这两处不能写 var(--card-grad)
     （那是个 linear-gradient(...)），浏览器解析不了会回退到默认黑色——浅色模式下
     中心孔和扇区描边全黑。必须给纯色。 */
  .pie-slice { stroke: var(--surface); stroke-width: 2; }
  .pie-hub { fill: var(--surface); }
  /* 引线不能用 --hair（深色下 1px 线在卡片底上等于隐形），用 --border */
  .pie-lead { fill: none; stroke: var(--border); stroke-width: 1; }
  .pie-lab { position: absolute; pointer-events: none; line-height: 1.32; white-space: nowrap; }
  .pie-lab .n { font-size: 11.5px; font-weight: 700; display: flex; align-items: center; gap: 5px; }
  .pie-lab.r .n { flex-direction: row-reverse; }
  .pie-lab .n i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
  /* ⚠️字号和"去掉 · 分隔符"是算过宽度才定的：饼半径能做多大卡在
     "R + gap + 标签最宽宽度 ≤ 容器宽/2"，实测标签最宽 70.5px、容器半边 163px → R=76。 */
  .pie-lab .v { font-size: 10.5px; color: var(--text-muted); font-family: var(--font-num); margin-top: 1px; }
  .pie-center { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); text-align: center; pointer-events: none; }
  .pie-center .k { font-size: 9.5px; color: var(--text-faint); line-height: 1.2; }
  .pie-center .v { font-size: 16px; font-weight: 700; font-family: var(--font-num); letter-spacing: -.02em; line-height: 1.3; }

  /* ---------- 页尾结语（Outro.tsx） ---------- */
  .outro { background: var(--surface-2); border-radius: 14px; padding: 15px 16px; margin-top: 20px; }
  .outro-t { font-size: 13px; font-weight: 700; }
  .outro-b { font-size: 12.5px; line-height: 1.75; color: var(--text-muted); margin-top: 6px; }
  .outro-b b { color: var(--text); font-family: var(--font-num); font-weight: 700; }
  .outro-act { display: flex; gap: 8px; margin-top: 13px; }

  /* 共享锚定浮层(react/src/shared/Popover.tsx)——"?"说明弹窗(InfoTip)和"⋮"导出菜单
     (report/ExportMenu.tsx)共用。popover-root给触发器元素做定位锚点；popover-panel用
     position:fixed，具体top/left/right由组件用getBoundingClientRect()算出后内联写入
     (不用CSS的align-start/align-end类，那样只能相对普通flow内的锚点定位)——这是踩过坑
     之后改的：面板如果只是绝对定位挂在锚点旁边，遇到锚点祖先节点有overflow:hidden(比如
     report/Hero.tsx的.hero，为了裁切装饰性的hero-smoke色雾)会被直接裁掉/位置错乱，改成
     fixed+JS算坐标后完全不受任何祖先overflow影响。 */
  .popover-root { position: relative; display: inline-flex; }
  /* max-width兜底：组件那边会按视口钳制left，但前提是面板本身不能比视口还宽——
     否则钳出来的位置只能保证左边不溢出、右边照样跑出屏幕。 */
  /* ⚠️z-index必须高于.subpage(35)——原来是25(排在.tabbar=20和.scrim=30之间)，
     在Popover只被InfoTip/ExportMenu用在普通.view标签页内容里时够用，但2026-08-05
     曾经有个功能(还债历程蜿蜒轨迹节点详情，后来整个删除了)第一次把Popover用进了
     .subpage内部，25这个z-index被.subpage(35)整个盖住，面板DOM/内容都在、
     visibility:visible，但肉眼完全看不见——Playwright截图对比实测到的真问题，不是
     靠代码审查看出来的。改成36(略高于.subpage，低于.login-gate=40/.modal-scrim=50)，
     覆盖"Popover被用在.view/.sheet/.subpage任意一层"这三种已知场景，即使触发这个坑
     的那个功能已经不在了，这条修复本身依然是对的，别再改回25。 */
  .popover-panel { position: fixed; z-index: 36; background: var(--card-grad);
    border: 1px solid var(--hair); border-radius: 14px; box-shadow: var(--e2); min-width: 160px;
    max-width: calc(100vw - 20px); }
  .info-tip-btn { width: 17px; height: 17px; border-radius: 50%; border: 1px solid var(--hair);
    background: var(--surface-2); color: var(--text-muted); font-size: 11px; font-weight: 700;
    line-height: 1; display: inline-flex; align-items: center; justify-content: center;
    padding: 0; font-family: inherit; flex: none; -webkit-tap-highlight-color: transparent; }
  .popover-tip { padding: 10px 12px; font-size: 12.5px; line-height: 1.55; color: var(--text-muted);
    width: 220px; max-width: 60vw; }
  .popover-menu-list { display: flex; flex-direction: column; padding: 6px; min-width: 140px; }
  .popover-menu-item { display: block; width: 100%; text-align: left; background: none; border: none;

<!-- 高级统计报表导出用：jsPDF导出PDF(window.jspdf.jsPDF)，SheetJS(xlsx)导出真正的.xlsx(window.XLSX)。

<script src="js/jspdf.umd.min.js"></script>
<script src="js/xlsx.full.min.js"></script>
<!-- 纯计算函数（recompute/amortForward/dueBucket等，不碰DOM），从下面的主脚本里抽出来
     独立成文件，好处是能被 node:test 单测直接require（见 test/calc.test.js）。跟主脚本
     共享全局作用域的普通<script src>，不是ES module，主脚本里不再重复声明这些同名函数，
     靠JS作用域链找到这里定义的全局函数——必须排在主<script>之前。 -->
<script src="js/calc.js"></script>
<!-- 档案库PDF预览用：pdf.js（Mozilla开源PDF渲染库，pdfjs-dist@6.2.108的legacy构建，
     兼容性优先于体积——这个App minSdk24覆盖到安卓7，legacy构建面向不支持最新JS特性的
     环境，比默认build更保守）。本地打包在www/js/下，不走CDN，跟jspdf/xlsx同一个理由；
     不是npm依赖（不进package.json），只是把pdfjs-dist包里两个构建产物原样复制过来，
     跟jspdf/xlsx"手动下载的静态文件"是同一类。这里必须是ES module（pdf.min.mjs本身用
     export语法），不能用classic<script src>——用行内type="module"把它转成window.pdfjsLib
     全局，好让下面react-debts/sheets.js（DocsScreen.tsx的PDF预览）能直接读到；workerSrc
     设成文档相对路径的纯字符串（不是import specifier），new Worker()按文档baseURL解析，
     跟"js/calc.js"这类路径是同一个解析方式。必须放在react-debts那几个module script之前——
     type="module"脚本按文档顺序依次执行，这条要先于sheets.js跑完，它才能读到window.pdfjsLib。 -->
<script type="module">
  import * as pdfjsLib from "./js/pdf.min.mjs";
  pdfjsLib.GlobalWorkerOptions.workerSrc = "js/pdf.worker.min.mjs";
  window.pdfjsLib = pdfjsLib;
</script>

     calc.js和下面的主<script>(定义window.__azBridge)都是阻塞性classic script，必然先跑完。
