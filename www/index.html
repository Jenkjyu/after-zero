<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>债务管理</title>
<style>
  @font-face {
    font-family: 'Inter var';
    font-style: normal;
    font-weight: 400 700;
    font-display: swap;
    src: url('fonts/Inter-Variable-Latin.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  :root {
    --bg: #EEF0F4; --surface: #FFFFFF; --surface-2: #F6F7FA; --border: #DCE0E8;
    --text: #23272F; --text-muted: #697082; --accent: #18453B; --accent-soft: #E7F3F1;
    --critical: #BE3A3A; --critical-soft: #F9E8E8; --warning: #A66A0A; --warning-soft: #FAF0D9;
    --good: #2E5F8A; --good-soft: #E1EBF4; --shadow: 0 2px 10px rgba(30,40,60,.08);
    --fs-xs: 11px; --fs-sm: 11.5px; --fs-base: 14px; --fs-lg: 15.5px; --fs-figure: 18px; --fs-xl: 19px; --fs-xxl: 23px;
    --font-ui: 'Inter var', system-ui, -apple-system, "PingFang SC", "Segoe UI", Roboto, sans-serif;
    --font-num: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --text-faint: #9AA3AD; --accent-rgb: 24,69,59; --app-grad: linear-gradient(180deg,#EFF2EF,#E7ECE8);
    --card-grad: linear-gradient(180deg,#FFFFFF,#FBFCFB); --hair: rgba(26,42,35,.06);
    --graphite-a: #253039; --graphite-b: #151A20; --graphite-text: #FFFFFF; --graphite-dim: #9BA6B4;
    --graphite-sheen: rgba(111,190,158,.18);
    --e1: 0 1px 2px rgba(22,38,32,.04), 0 4px 10px rgba(22,38,32,.045);
    --e2: 0 2px 6px rgba(22,38,32,.05), 0 16px 32px rgba(22,38,32,.08);
    --e3: 0 24px 50px rgba(12,24,18,.26);
    --glass: rgba(255,255,255,.5); --glass-border: rgba(255,255,255,.7); --glass-hi: rgba(255,255,255,.6);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #101318; --surface: #191D24; --surface-2: #20252E; --border: #2B313B;
      --text: #E4E8EF; --text-muted: #98A0B0; --accent: #6FBE9E; --accent-soft: #1D2B28;
      --critical: #E56A6A; --critical-soft: #2E1D1F; --warning: #D69A3C; --warning-soft: #2B2316;
      --good: #6FA8D6; --good-soft: #1E2A33; --shadow: 0 2px 12px rgba(0,0,0,.35);
      --text-faint: #6E7787; --accent-rgb: 111,190,158; --app-grad: linear-gradient(180deg,#12161C,#0C0F14);
      --card-grad: linear-gradient(180deg,#1E232B,#191D24); --hair: rgba(255,255,255,.05);
      --graphite-a: #272F3A; --graphite-b: #171C24; --graphite-text: #F2F5F9; --graphite-dim: #99A4B2;
      --graphite-sheen: rgba(111,190,158,.22);
      --e1: 0 1px 2px rgba(0,0,0,.35); --e2: 0 4px 18px rgba(0,0,0,.4); --e3: 0 22px 46px rgba(0,0,0,.55);
      --glass: rgba(30,36,45,.5); --glass-border: rgba(255,255,255,.09); --glass-hi: rgba(255,255,255,.07); }
  }
  :root[data-theme="light"] { --bg: #EEF0F4; --surface: #FFFFFF; --surface-2: #F6F7FA; --border: #DCE0E8;
    --text: #23272F; --text-muted: #697082; --accent: #18453B; --accent-soft: #E7F3F1;
    --critical: #BE3A3A; --critical-soft: #F9E8E8; --warning: #A66A0A; --warning-soft: #FAF0D9;
    --good: #2E5F8A; --good-soft: #E1EBF4; --shadow: 0 2px 10px rgba(30,40,60,.08);
    --text-faint: #9AA3AD; --accent-rgb: 24,69,59; --app-grad: linear-gradient(180deg,#EFF2EF,#E7ECE8);
    --card-grad: linear-gradient(180deg,#FFFFFF,#FBFCFB); --hair: rgba(26,42,35,.06);
    --graphite-a: #253039; --graphite-b: #151A20; --graphite-text: #FFFFFF; --graphite-dim: #9BA6B4;
    --graphite-sheen: rgba(111,190,158,.18);
    --e1: 0 1px 2px rgba(22,38,32,.04), 0 4px 10px rgba(22,38,32,.045);
    --e2: 0 2px 6px rgba(22,38,32,.05), 0 16px 32px rgba(22,38,32,.08);
    --e3: 0 24px 50px rgba(12,24,18,.26);
    --glass: rgba(255,255,255,.5); --glass-border: rgba(255,255,255,.7); --glass-hi: rgba(255,255,255,.6); }
  :root[data-theme="dark"] { --bg: #101318; --surface: #191D24; --surface-2: #20252E; --border: #2B313B;
    --text: #E4E8EF; --text-muted: #98A0B0; --accent: #6FBE9E; --accent-soft: #1D2B28;
    --critical: #E56A6A; --critical-soft: #2E1D1F; --warning: #D69A3C; --warning-soft: #2B2316;
    --good: #6FA8D6; --good-soft: #1E2A33; --shadow: 0 2px 12px rgba(0,0,0,.35);
    --text-faint: #6E7787; --accent-rgb: 111,190,158; --app-grad: linear-gradient(180deg,#12161C,#0C0F14);
    --card-grad: linear-gradient(180deg,#1E232B,#191D24); --hair: rgba(255,255,255,.05);
    --graphite-a: #272F3A; --graphite-b: #171C24; --graphite-text: #F2F5F9; --graphite-dim: #99A4B2;
    --graphite-sheen: rgba(111,190,158,.22);
    --e1: 0 1px 2px rgba(0,0,0,.35); --e2: 0 4px 18px rgba(0,0,0,.4); --e3: 0 22px 46px rgba(0,0,0,.55);
    --glass: rgba(30,36,45,.5); --glass-border: rgba(255,255,255,.09); --glass-hi: rgba(255,255,255,.07); }

  * { box-sizing: border-box; }
  /* 全局禁掉长按选中/复制文字，只在真正的文字输入框(input/textarea)里保留——
     安卓WebView里，不禁掉这个的话，长按卡片会先被系统当成"选中文字"手势抢走
     (弹出选中手柄+复制菜单)，我们自己JS写的长按拖拽排序逻辑根本收不到后续的
     pointermove，表现就是"长按之后卡片压根拖不动"。user-select是继承属性，
     这里在body上关一次，除了input/textarea，全站(含SVG文字)都会跟着继承关闭。 */
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-ui); line-height: 1.5; -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-user-drag: none; }
  input, textarea { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
  .num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
  button { font-family: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:active, .file-row:active { filter: brightness(.94); transition: filter .1s; }
  button:disabled { opacity: .5; pointer-events: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  .app { max-width: 560px; margin: 0 auto; padding: max(18px, env(safe-area-inset-top)) 14px 100px; background: var(--app-grad); min-height: 100vh; }

  /* ===== 顶部：手写 wordmark + 头像入口（替代原来的"债务管理"标题） ===== */
  header#topHeader { padding: 4px 3px 4px; display: flex; align-items: center; justify-content: space-between; min-height: 36px; }
  .wordmark { height: 26px; color: var(--text); display: flex; align-items: center; }
  .wordmark svg { height: 100%; width: auto; display: block; }
  .avatar-btn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--hair); padding: 0; background: var(--surface-2);
    box-shadow: var(--e1); display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; flex: none; }
  .avatar-btn svg { width: 21px; height: 21px; color: var(--text-muted); }
  .avatar-btn img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .note-toggle { background: none; border: none; color: var(--accent); font-size: 12px; font-weight: 600;
    padding: 2px; margin: -6px 2px 8px; display: flex; align-items: center; gap: 3px; font-family: inherit;
    -webkit-tap-highlight-color: transparent; }
  .note-toggle svg { width: 12px; height: 12px; transition: transform .15s ease; }
  .note-toggle.open svg { transform: rotate(180deg); }

  /* ===== 石墨主角卡：唯一的"在还总负债"焦点 ===== */
  .hero { position: relative; border-radius: 24px; padding: 20px 20px 18px; margin-bottom: 13px; overflow: hidden;
    background: linear-gradient(155deg, var(--graphite-a), var(--graphite-b)); color: var(--graphite-text); box-shadow: var(--e3); }
  .hero::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 2;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.1); }
  .hero > * { position: relative; z-index: 1; }
  .hero-smoke { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; pointer-events: none; z-index: 0; }
  .hero-puff { position: absolute; border-radius: 50%; filter: blur(30px); mix-blend-mode: screen; opacity: .55; }
  .hero-puff.a { width: 200px; height: 200px; left: -12%; top: 8%;
    background: radial-gradient(circle, rgba(111,190,158,.55), transparent 70%); animation: heroDrift1 8s ease-in-out infinite; }
  .hero-puff.b { width: 170px; height: 170px; right: -8%; top: 30%;
    background: radial-gradient(circle, rgba(90,170,180,.5), transparent 70%); animation: heroDrift2 10s ease-in-out infinite; }
  .hero-puff.c { width: 150px; height: 150px; left: 30%; bottom: -20%;
    background: radial-gradient(circle, rgba(120,200,150,.4), transparent 70%); animation: heroDrift3 12.5s ease-in-out infinite; }
  @keyframes heroDrift1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(40px,20px) scale(1.15); } }
  @keyframes heroDrift2 { 0%,100% { transform: translate(0,0) scale(1.05); } 50% { transform: translate(-36px,-16px) scale(.92); } }
  @keyframes heroDrift3 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(24px,-30px) scale(1.2); } }
  @media (prefers-reduced-motion: reduce) { .hero-puff { animation: none; } }
  .hero-top { display: flex; align-items: center; justify-content: space-between; }
  .hero-label { font-size: 12.5px; font-weight: 600; letter-spacing: .04em; color: var(--graphite-dim); }
  .hero-pill { font-size: 11px; font-weight: 600; color: var(--graphite-dim); border: 1px solid rgba(255,255,255,.16);
    border-radius: 999px; padding: 3px 10px; }
  .hero-amt { font-size: 36px; font-weight: 700; margin: 8px 0 0; font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .hero-amt .cur { font-size: 21px; font-weight: 600; margin-right: 2px; color: var(--graphite-dim); }
  .hero-prog { margin-top: 15px; }
  .hero-prog-track { height: 6px; border-radius: 999px; background: rgba(255,255,255,.12); overflow: hidden; }
  .hero-prog-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, rgba(var(--accent-rgb),.75), #6FBE9E); }
  .hero-prog-row { display: flex; justify-content: space-between; align-items: baseline; margin-top: 8px; }
  .hero-prog-row .l { font-size: 11.5px; color: var(--graphite-dim); }
  .hero-prog-row .r { font-size: 11.5px; color: var(--graphite-text); font-weight: 600; font-family: var(--font-num); }

  /* ===== 降权的 4 个小指标 ===== */
  .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 13px; }
  .kpi { background: var(--card-grad); border: 1px solid var(--hair); border-radius: 18px; padding: 12px 14px; box-shadow: var(--e1); }
  .kpi .v { font-size: 17px; font-weight: 650; margin-top: 3px; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
  .kpi .k { font-size: 11px; color: var(--text-muted); }
  .kpi-sub { font-size: 10.5px; color: var(--text-faint); margin-top: 2px; }
  /* 灵动AI入口：对话气泡+魔法棒图标，胶囊描边扫光+呼吸光晕；开通前更克制、不发光。 */
  .ai-banner { position: relative; display: flex; align-items: center; gap: 11px; width: 100%; border: none;
    border-radius: 999px; padding: 12px 16px 12px 12px; background: var(--card-grad); cursor: pointer;
    margin: 0 0 20px; text-align: left; color: inherit; isolation: isolate; overflow: hidden; box-shadow: var(--e2); font-family: inherit; }
  .ai-banner::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.4px;
    background: linear-gradient(120deg, rgba(var(--accent-rgb),.14), rgba(var(--accent-rgb),.6), rgba(var(--accent-rgb),.14));
    background-size: 220% 100%; -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; animation: aiSheen 5s linear infinite; }
  .ai-banner::after { content: ""; position: absolute; inset: -30%; z-index: -1; border-radius: 50%;
    background: radial-gradient(circle, rgba(var(--accent-rgb),.14), transparent 65%); animation: aiGlow 3.6s ease-in-out infinite; }
  .ai-banner:not(.is-ai)::before, .ai-banner:not(.is-ai)::after { display: none; }
  @keyframes aiSheen { to { background-position: -220% 0; } }
  @keyframes aiGlow { 0%,100% { opacity: .5; transform: scale(.94); } 50% { opacity: 1; transform: scale(1.04); } }
  .ai-banner-ic { width: 33px; height: 33px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
    display: flex; align-items: center; justify-content: center; flex: none; }
  .ai-banner:not(.is-ai) .ai-banner-ic { background: var(--surface-2); color: var(--text-muted); }
  .ai-banner-ic svg { width: 18px; height: 18px; overflow: visible; }
  .wand { filter: drop-shadow(0 0 2px rgba(var(--accent-rgb),.5)); animation: wandGlow 2.4s ease-in-out infinite;
    transform-box: fill-box; transform-origin: 100% 100%; }
  .ai-banner:not(.is-ai) .wand { filter: none; animation: none; opacity: .55; }
  @keyframes wandGlow { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
  /* 入场"摇两下再定住"动效：AI对话页打开/新对话时给魔法棒临时加这个class，播完JS会移除，
     .wand基础规则的wandGlow呼吸光晕会自动接续（.wand.cast的animation声明只是临时覆盖，
     两条class的specificity差异保证了这个接续关系，不需要额外的"glow"类）。
     transform-origin用的是魔法棒手柄末端(grip)在其path bbox里的相对位置，让旋转看起来像"挥动"
     而不是绕图形中心转——这个数值是照着wand路径坐标(bbox约x:6.6-21,y:-3.15-7，grip端点(21,7)
     正好是右下角)算出来的，换了图形要重新算。 */
  .wand.cast { animation: wandCast .75s cubic-bezier(.34,1.4,.4,1) 1 both; }
  @keyframes wandCast {
    0% { transform: rotate(0deg) scale(1); }
    12% { transform: rotate(-18deg) scale(1.08); }
    28% { transform: rotate(14deg) scale(1.04); }
    44% { transform: rotate(-9deg) scale(1.02); }
    60% { transform: rotate(6deg) scale(1.01); }
    78% { transform: rotate(-2deg) scale(1); }
    100% { transform: rotate(0deg) scale(1); }
  }
  .ai-banner-text { flex: 1; min-width: 0; }
  .ai-banner-title { font-size: 13px; font-weight: 700; }
  .ai-banner-sub { font-size: 11px; color: var(--text-muted); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) { .ai-banner::before, .ai-banner::after, .wand { animation: none !important; } }

  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--border);
    display: flex; z-index: 20; padding-bottom: env(safe-area-inset-bottom); }
  .tabbar button { flex: 1; background: none; border: none; color: var(--text-muted); padding: 14px 2px;
    display: flex; align-items: center; justify-content: center; }
  .tabbar button svg { width: 23px; height: 23px; display: block; }
  .tabbar button .ic-filled { display: none; }
  .tabbar button[aria-selected="true"] { color: var(--accent); }
  .tabbar button[aria-selected="true"] .ic-outline { display: none; }
  .tabbar button[aria-selected="true"] .ic-filled { display: block; }
  @keyframes tapBounce { 0% { transform: scale(1); } 40% { transform: scale(.82); } 70% { transform: scale(1.1); } 100% { transform: scale(1); } }
  .tabbar button.bounce svg { animation: tapBounce .38s cubic-bezier(.34,1.56,.64,1); }
  @media (prefers-reduced-motion: reduce) { .tabbar button.bounce svg { animation: none; } }

  .view { display: none; } .view.active { display: block; }
  .section-label { font-size: var(--fs-sm); letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted);
    font-weight: 600; margin: 4px 2px 8px; display: flex; justify-content: space-between; align-items: center; }
  /* -webkit-user-select:none在body上设过一次，但安卓WebView对<select>这类原生表单控件的
     长按选中经常不听页面CSS的（浏览器把它当"原生chrome"处理，不完全遵守user-select），
     必须在select自己身上再显式设一次才压得住；长按弹出的绿色边框是全局:focus-visible规则
     (line 77附近)在select上被WebView判定成"需要可见焦点"触发的，这个控件是纯点按操作、
     不存在键盘导航场景，单独关掉这个控件的focus-visible效果即可，不动全局规则。 */
  .sort-sel { text-transform: none; letter-spacing: normal; font-size: 12px; font-weight: 600; padding: 6px 8px;
    border: 1px solid var(--hair); border-radius: 9px; background: var(--card-grad); color: var(--text); font-family: inherit;
    box-shadow: var(--e1); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .sort-sel:focus-visible { outline: none; }
  .sort-controls { display: flex; align-items: center; gap: 6px; }
  .jiggle-done-btn { display: none; text-transform: none; letter-spacing: normal; font-size: 12px; font-weight: 600;
    padding: 5px 10px; border-radius: 7px; border: none; background: var(--accent); color: #fff; }
  #view-debts.jiggling .jiggle-done-btn { display: inline-flex; }
  .debt-hint { font-size: 11.5px; color: var(--text-muted); margin: -4px 2px 10px; }
  #view-debts.jiggling .debt-hint { display: none; }

  /* .debt(外层，长按拖拽排序的直接list item，位置/抖动动画都作用在它身上)保持默认
     touch-action(auto)——原因见onCardTouchStart的注释，不重复。
     .debt-row是新加的内层横向flex行，左滑手势的translateX作用在它身上，跟外层.debt的
     纵向拖拽位移(translateY)互不干扰，两套手势可以叠加在同一张卡片上而不用互相知道对方
     的存在。⚠️.debt-swipe-btn必须是.debt-row里跟.debt-front并排的flex子项(挪到卡片右侧
     屏幕外)，不能用position:absolute叠在.debt-front正后方——踩过坑：.debt-front是半透明
     磨砂玻璃(backdrop-filter+50%透明度背景)，哪怕完全遮住了正后方的按钮，玻璃本身的透明度
     还是会让按钮的颜色透出来（真机截图验证过，卡片右边缘常驻能看到一条蓝色"销这期"字样），
     并排布局从根源上避免这个问题——关闭状态下按钮压根不在玻璃卡背后，没有任何东西可透。 */
  /* .debt/.debt-row/.debt-front都不是<button>，接不到上面button{}规则里的tap-highlight-color:
     transparent——长按触发拖拽排序手势时，安卓WebView默认的原生"点按高亮"（半透明蓝色）会在
     这几层上闪一下，跟卡片本身的磨砂玻璃质感很不搭。三层都要设，因为长按/拖拽手势在.debt和
     .debt-front上都挂了touch事件监听，高亮可能出现在其中任意一层。 */
  .debt { position: relative; border-radius: 18px; margin-bottom: 11px; overflow: hidden; box-shadow: var(--e2);
    -webkit-tap-highlight-color: transparent; }
  .debt-row { display: flex; align-items: stretch; -webkit-tap-highlight-color: transparent; }
  .debt-swipe-btn { flex: 0 0 92px; border: none; background: var(--good); color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12.5px; font-weight: 700;
    -webkit-tap-highlight-color: transparent; }
  .debt-swipe-btn svg { width: 18px; height: 18px; }
  .debt-front { flex: 0 0 100%; position: relative; z-index: 1; background: var(--glass); border: 1px solid var(--glass-border);
    -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4);
    border-radius: 18px; padding: 14px 16px; cursor: pointer; overflow: hidden; -webkit-tap-highlight-color: transparent; }
  .debt-front::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; }
  .debt.crit .debt-front::before { background: linear-gradient(135deg, rgba(190,58,58,.11), transparent 52%); }

  /* .pay-row(外层list item，overflow:hidden+box-shadow)/.pay-swipe-row(内层横向flex行，左滑
     手势的translateX作用在它身上)/.pay(可见卡面，磨砂玻璃)/.pay-swipe-btn(并排flex子项)——
     跟"在还债务"卡片左滑同一套结构、同样的理由：.pay是半透明玻璃(backdrop-filter+部分透明
     背景)，.pay-swipe-btn绝不能用position:absolute叠在它正后方(会透色，见.debt-front那条

    border-radius: 18px; cursor: pointer; overflow: hidden; -webkit-tap-highlight-color: transparent; }
  .pay::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; }

  .pay-swipe-btn { flex: 0 0 92px; border: none; background: var(--good); color: #fff;

    -webkit-tap-highlight-color: transparent; }

  /* 空状态(没有在还债务)跟.dim档共用"平静的好消息"底色——"全部结清"本来就是这个App想要

  .modal .mbody { font-size: 13.5px; color: var(--text); white-space: pre-line; margin-bottom: 18px; line-height: 1.55; overflow-wrap: break-word; word-break: break-word; }

  /* 登录门默认(纯CSS，不依赖任何JS执行时机)就是display:flex可见的——这是刻意的"fail-closed"设计。
     以前默认display:none、靠JS抢在CDN脚本网络等待之前把它设成可见，真机上仍然偶发"一闪而过"，
     根源是"默认可见"这件事本身不该依赖JS能不能跑赢一段网络请求。现在反过来：默认永远可见，
     只有真正确认登录后才用.authed隐藏它——哪怕JS完全没执行，也不可能露出底下的App内容。 */
  .login-gate { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: flex; align-items: center; justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); }
  .login-gate.authed { display: none; }
  .login-gate-inner { max-width: 340px; width: 100%; text-align: center; }

  .gate-icon { display: flex; justify-content: center; margin-bottom: 14px; }
  .gate-icon img { width: 108px; height: 108px; object-fit: cover; border-radius: 22px; border: 1px solid var(--border); }

  .gate-hw { display: block; width: 210px; height: auto; margin: 0 auto 22px; overflow: visible; }
  .hw-letter { fill: none; stroke: var(--accent); stroke-width: 12; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: var(--len); stroke-dashoffset: var(--len); }
  .login-gate.open .hw-letter { animation: hwDraw .5s linear both; animation-delay: calc(var(--i) * 90ms + 150ms); }
  @keyframes hwDraw { to { stroke-dashoffset: 0; } }

  .login-gate .data-actions { opacity: 0; transform: translateY(6px); pointer-events: none; }
  .login-gate.open .data-actions { animation: gateBtnIn .4s ease-out both; animation-delay: 1.45s; }
  @keyframes gateBtnIn { to { opacity: 1; transform: translateY(0); pointer-events: auto; } }

  @media (prefers-reduced-motion: reduce) {
    .login-gate.open .hw-letter { animation: none !important; stroke-dashoffset: 0 !important; }
    .login-gate.open .data-actions { animation: none !important; opacity: 1 !important; transform: none !important; pointer-events: auto !important; }
  }

  .subpage { position: fixed; inset: 0; z-index: 35; background: var(--bg); transform: translateX(100%);
    transition: transform .28s cubic-bezier(.2,.7,.3,1); overflow-y: auto; }
  .subpage.open { transform: translateX(0); }
  @media (prefers-reduced-motion: reduce) { .subpage { transition: none; } }
  .subpage-header { display: flex; align-items: center; gap: 4px; padding: max(14px, env(safe-area-inset-top)) 6px 14px; position: sticky; top: 0;
    background: var(--bg); border-bottom: 1px solid var(--border); }
  .subpage-back { background: none; border: none; padding: 8px; color: var(--text); display: flex; width: 40px; flex: none; }
  .subpage-back svg { width: 22px; height: 22px; }

  .subpage-header-spacer { width: 40px; flex: none; }

  .premium-hero { text-align: center; padding: 22px 10px 18px; }
  .premium-hero-ic { width: 56px; height: 56px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
    display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; }
  .premium-hero-ic svg { width: 28px; height: 28px; }
  /* 顶部图标区轻微浮动动效，呼应X订阅页的"图标动效区"，但幅度很小、不抢内容注意力 */
  @keyframes premiumHeroFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  .premium-hero-ic { animation: premiumHeroFloat 2.4s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .premium-hero-ic { animation: none; } }

  .premium-tabs { display: flex; gap: 8px; margin-bottom: 16px; }

    color: var(--text-muted); font-size: 14px; font-weight: 700; font-family: inherit; }
  .premium-tab.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

  .pf-list { margin: 4px 0 20px; }
  .pf-row { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .pf-row:last-child { border-bottom: none; }

  .pf-ic svg { width: 100%; height: 100%; }

  .price-grid.two { grid-template-columns: 1fr 1fr; }
  .price-card { border: 2px solid var(--border); border-radius: 16px; padding: 14px; background: var(--surface);
    text-align: left; font-family: inherit; }
  .price-card.selected { border-color: var(--accent); background: var(--accent-soft); }
  .price-card .pc-badge { display: inline-block; font-size: 10.5px; font-weight: 700; color: #fff; background: var(--accent);
    border-radius: 999px; padding: 2px 8px; margin-bottom: 6px; }

  /* ===== AI 债务顾问：聊天式界面（欢迎态+快捷芯片、统一消息流、吸底输入框） =====
     #aiScreen需要真正的flex-column三段布局(header固定/中间可滚动/输入框天然贴在真实屏幕底边)，
     不能像其它.subpage那样靠overflow-y:auto整页滚动+sticky模拟"吸底"——sticky只在"内容比
     视口高、需要滚动"时才会把元素顶到视口底边，内容不够高时(比如欢迎态消息很少)它就停在
     自然流位置，底下露一截空白。真机上头部/输入框的实际高度跟桌面估算的min-height常量对不上，
     这个问题在真机上被实测到了。改成#aiScreen自己overflow:hidden，内部.ai-thread单独
     flex:1+overflow-y:auto滚动，.ai-composer作为普通flex子元素——flex:1的中间区域会精确
     吃掉剩余空间，把它推到真实底边，不需要再猜任何高度常量。 */
  #aiScreen.subpage { display: flex; flex-direction: column; overflow: hidden; }
  #aiScreen .ai-thread { flex: 1; overflow-y: auto; min-height: 0; }
  /* min-height:0是flex子元素能正常收缩、让overflow-y:auto生效的必要条件——flex item默认
     min-height:auto，会被内容撑开导致.ai-thread长过父容器、外层出现整页滚动而不是内部滚动。 */
  .ai-thread { padding: 4px 16px 8px; max-width: 560px; margin: 0 auto; }
  .ai-welcome { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    gap: 14px; padding: 22px 14px 10px; height: 100%; }
  .ai-welcome-ic { width: 56px; height: 56px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
    display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 8px rgba(var(--accent-rgb),.06); flex: none; }
  .ai-welcome-ic svg { width: 28px; height: 28px; overflow: visible; }
  .ai-welcome h2 { font-size: 17px; font-weight: 700; margin: 0; }
  .ai-welcome p { font-size: 13px; color: var(--text-muted); line-height: 1.6; margin: 0; max-width: 30ch; }
  .ai-chips { display: flex; flex-direction: column; gap: 8px; width: 100%; margin-top: 6px; }
  .ai-chip { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 12px 14px;
    border-radius: 14px; border: 1px solid var(--border); background: var(--surface); color: var(--text);
    font-size: 13.5px; font-weight: 500; box-shadow: var(--e1); font-family: inherit; }
  .ai-chip.primary { border-color: transparent; background: linear-gradient(155deg, var(--graphite-a), var(--graphite-b));
    color: var(--graphite-text); font-weight: 600; }
  .ai-chip-ic { width: 26px; height: 26px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center;
    background: rgba(var(--accent-rgb),.12); color: var(--accent); }
  .ai-chip.primary .ai-chip-ic { background: rgba(255,255,255,.14); color: var(--graphite-text); }
  .ai-chip-ic svg { width: 14px; height: 14px; }

  .ai-chat-log:empty { display: none; }
  .ai-chat-log { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
  .ai-msg { max-width: 85%; padding: 10px 13px; border-radius: 14px; font-size: 14px; line-height: 1.6;
    white-space: pre-wrap; word-break: break-word; }
  .ai-msg strong { font-weight: 700; }
  .ai-msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .ai-msg.bot { align-self: flex-start; background: var(--surface-2); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .ai-msg.pending { color: var(--text-muted); display: flex; align-items: center; gap: 7px; }
  .ai-typing-dots { display: inline-flex; gap: 3px; }
  .ai-typing-dots span { width: 5px; height: 5px; border-radius: 50%; background: var(--text-faint); animation: aiTypingBounce 1.1s infinite ease-in-out; }
  .ai-typing-dots span:nth-child(2) { animation-delay: .15s; }
  .ai-typing-dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes aiTypingBounce { 0%, 60%, 100% { opacity: .35; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-2px); } }
  @media (prefers-reduced-motion: reduce) { .ai-typing-dots span { animation: none; opacity: .7; } }

  .ai-composer { flex: none; display: flex; align-items: flex-end; gap: 8px; padding: 10px 14px;
    padding-bottom: max(10px, env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--border);
    max-width: 560px; margin: 0 auto; width: 100%; }
  .ai-composer textarea { flex: 1; resize: none; border: 1px solid var(--border); background: var(--surface); color: var(--text);
    border-radius: 20px; padding: 10px 15px; font: inherit; font-size: 14px; line-height: 1.4; max-height: 90px; }
  .ai-composer textarea:focus { outline: none; border-color: var(--accent); }
  .ai-send-btn { width: 38px; height: 38px; border-radius: 50%; border: none; background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center; flex: none; }

  .ai-send-btn:disabled { opacity: .4; }

  /* 历史对话sheet是从#aiScreen这个.subpage内部打开的，必须比.subpage(z-index:35)更高，

  #aiHistorySheet, #scrimAiHistory { z-index: 36; }

  .account-head { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 10px 0 4px; }
  .account-avatar-btn { background: none; border: none; padding: 0; border-radius: 50%;
    -webkit-tap-highlight-color: transparent; cursor: pointer; }
  .account-avatar-lg { width: 78px; height: 78px; border-radius: 50%; object-fit: cover; display: block; background: var(--surface-2); }
  .account-name-c { font-size: 16px; font-weight: 600; text-align: center; }
  .account-avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; flex: none; background: var(--surface-2); }
  .account-chevron { width: 18px; height: 18px; flex: none; color: var(--text-muted); }

  .premium-entry-card { padding: 14px 16px; }
  .premium-entry { display: flex; align-items: center; gap: 12px; width: 100%; background: none; border: none;
    padding: 0; text-align: left; color: inherit; -webkit-tap-highlight-color: transparent; font-family: inherit; }
  .premium-entry-ic { width: 38px; height: 38px; border-radius: 11px; background: var(--accent-soft); color: var(--accent);
    display: flex; align-items: center; justify-content: center; flex: none; }
  .premium-entry-ic svg { width: 20px; height: 20px; }

  /* 已订阅态：图标块换成实心accent底+白图标——语义是"已拥有的权益"而不是"紧急"，

  .premium-entry-card.is-member .premium-entry-ic { background: var(--accent); color: #fff; }

  .account-detail-row:last-child { border-bottom: none; }
  .account-detail-label { font-size: 13px; color: var(--text-muted); }
  .account-detail-value { font-size: 14px; font-weight: 600; }

  /* 高级统计报表：横向条形图(债务余额对比)/堆叠条形图(类型占比)/折线图(负债预测走势)，
     全部手写SVG/HTML，不引入图表库——这是项目里第一批图表，之前没有先例可抄。配色套用
     dataviz skill的默认类别色板，已用validate_palette.js对着本项目实际的浅色#FFFFFF/
     深色#191D24重新验证过(不是直接抄skill文档里参考色的验证结果，那是对着skill自己的
     参考底色#fcfcfb/#1a1a19验证的，跟本项目的底色不是一回事)。 */
  .viz-root {
    --series-1: #2a78d6; --series-2: #008300; --series-3: #e87ba4; --series-4: #eda100;
    --series-5: #1baf7a; --series-6: #eb6834; --series-7: #4a3aa7; --series-8: #e34948;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      --series-1: #3987e5; --series-2: #008300; --series-3: #d55181; --series-4: #c98500;
      --series-5: #199e70; --series-6: #d95926; --series-7: #9085e9; --series-8: #e66767;
    }
  }
  :root[data-theme="dark"] .viz-root {
    --series-1: #3987e5; --series-2: #008300; --series-3: #d55181; --series-4: #c98500;
    --series-5: #199e70; --series-6: #d95926; --series-7: #9085e9; --series-8: #e66767;
  }
  .viz-block { margin-bottom: 22px; }
  .viz-title { font-size: 13.5px; font-weight: 700; margin-bottom: 10px; }
  .viz-bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12px;
    cursor: pointer; border-radius: 9px; padding: 2px 6px; margin-left: -6px; margin-right: -6px;
    transition: background .15s ease; -webkit-tap-highlight-color: transparent; }
  .viz-bar-row.active { background: var(--surface-2); }
  .viz-bar-row.active .viz-bar-fill { filter: brightness(1.15); }
  .viz-bar-name { width: 84px; flex: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-muted); }
  .viz-bar-track { flex: 1; background: var(--surface-2); border-radius: 5px; height: 16px; position: relative; overflow: hidden; }
  .viz-bar-fill { height: 100%; background: var(--accent); border-radius: 5px; transition: filter .15s ease; }
  .viz-bar-val { width: 74px; flex: none; text-align: right; font-family: var(--font-num); font-weight: 600; }
  .viz-stack { display: flex; height: 26px; border-radius: 7px; overflow: hidden; margin-bottom: 10px; }
  .viz-stack-seg { height: 100%; cursor: pointer; transition: opacity .15s ease; }
  .viz-stack-seg.dim { opacity: .35; }
  .viz-legend { display: flex; flex-wrap: wrap; gap: 10px 14px; margin-bottom: 4px; }
  .viz-legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text);
    cursor: pointer; border-radius: 7px; padding: 2px 6px; margin: -2px -6px; transition: background .15s ease;
    -webkit-tap-highlight-color: transparent; }
  .viz-legend-item.active { background: var(--surface-2); font-weight: 700; }
  .viz-legend-swatch { width: 11px; height: 11px; border-radius: 3px; flex: none; }
  .viz-line-svg { width: 100%; height: auto; display: block; }
  /* MonthlyChart.tsx/PayoffLine.tsx共用的"精确值展示行"——chartScrub.ts拖动/点击查看曲线
     任意一点时更新的文字条，取代了原来画在SVG里的静态<text>标签。 */
  .viz-scrub-readout { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px;
    font-family: var(--font-num); }
  .viz-table-toggle { font-size: 12px; color: var(--accent); font-weight: 600; margin: 8px 0 0; }
  .viz-table-toggle table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
  .viz-table-toggle th, .viz-table-toggle td { padding: 6px 7px; text-align: right; border-bottom: 1px solid var(--border); }
  .viz-table-toggle th:first-child, .viz-table-toggle td:first-child { text-align: left; }
  .report-actions { display: flex; gap: 8px; margin: 4px 0 20px; }
  /* 统计tab hero卡右上角"⋮"导出菜单触发器(report/ExportMenu.tsx)——照抄.pay-hero-bell的
     图标按钮定位模式，配色改用hero卡自己的石墨token(不是.pay-hero用的--accent/--text-muted，
     那套是给彩色状态底的hero卡配的，这里的hero常年是石墨底)。 */
  .report-hero-menu { background: none; border: none; padding: 4px; margin: -4px; border-radius: 8px;
    color: var(--graphite-dim); display: flex; -webkit-tap-highlight-color: transparent; }

  .report-hero-menu.on { color: var(--graphite-text); background: rgba(255,255,255,.12); }

  /* 共享锚定浮层(react/src/shared/Popover.tsx)——"?"说明弹窗(InfoTip)和"⋮"导出菜单
     (report/ExportMenu.tsx)共用。popover-root给触发器元素做定位锚点，popover-panel贴着
     它绝对定位展开，align-start/align-end决定面板从锚点左边还是右边对齐展开。 */
  .popover-root { position: relative; display: inline-flex; }
  .popover-panel { position: absolute; z-index: 5; top: calc(100% + 6px); background: var(--card-grad);

  .popover-panel.align-end { right: 0; }
  .popover-panel.align-start { left: 0; }
  .info-tip-btn { width: 17px; height: 17px; border-radius: 50%; border: 1px solid var(--hair);
    background: var(--surface-2); color: var(--text-muted); font-size: 11px; font-weight: 700;

    padding: 0; font-family: inherit; flex: none; -webkit-tap-highlight-color: transparent; }
  .popover-tip { padding: 10px 12px; font-size: 12.5px; line-height: 1.55; color: var(--text-muted);
    width: 220px; max-width: 60vw; }
  .popover-menu-list { display: flex; flex-direction: column; padding: 6px; min-width: 140px; }
  .popover-menu-item { display: block; width: 100%; text-align: left; background: none; border: none;
    padding: 9px 10px; font-size: 13px; font-weight: 600; color: var(--text); border-radius: 9px;
    font-family: inherit; -webkit-tap-highlight-color: transparent; }
  .popover-menu-item:active { background: var(--surface-2); }

  .sync-status-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; }
  .sync-status-label { font-size: 13px; color: var(--text-muted); }
  .sync-status-value { font-size: 13.5px; font-weight: 600; }
  .backup-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 16px; margin-bottom: 8px; box-shadow: var(--shadow); }
  .backup-row-main { min-width: 0; }
  .backup-row-time { font-size: 13.5px; font-weight: 600; }

<!-- 登录门这里立刻同步决定"是否已登录"，不能等main script——下面几行CDN <script src>
     没有defer/async，是阻塞解析的，首次冷启动时这几个网络请求可能要花上百毫秒甚至更久。
     但登录门本身默认(纯CSS)就是可见的(见.login-gate的CSS注释)，这段脚本只负责在确认
     已登录时尽早加上.authed隐藏它、以及触发手写动画——不再需要"跟CDN脚本抢跑"，
     哪怕这段脚本本身因为某种原因很晚才跑，最坏结果也只是登录门多显示一会儿，
     不可能出现底下App内容被提前露出来的情况。 -->
<script>
(function () {
  var authed = false;
  try { authed = !!JSON.parse(localStorage.getItem("after-zero-account-v1") || "null"); } catch (e) {}
  var gate = document.getElementById("loginGate");
  gate.classList.toggle("authed", authed);
  if (!authed) gate.classList.add("open");
})();

  // 顶部横杠拖拽：下拖超过阈值关闭，resizable=true 时上拖可把窗口拉高（用于查看详情）
  function initGripDrag(sheet, grip, closeFn, resizable) {
    var startY = 0, startH = 0, dragging = false;
    var CLOSE_THRESHOLD = 90;
    var MIN_H = window.innerHeight * 0.4, MAX_H = window.innerHeight * 0.94;
    grip.addEventListener("pointerdown", function (e) {
      dragging = true; startY = e.clientY; startH = sheet.getBoundingClientRect().height;
      sheet.style.transition = "none";
      grip.setPointerCapture(e.pointerId);
    });
    grip.addEventListener("pointermove", function (e) {
      if (!dragging) return;
      var dy = e.clientY - startY;
      if (dy > 0) { sheet.style.transform = "translateY(" + dy + "px)"; }
      else if (resizable) {
        sheet.style.height = Math.min(MAX_H, Math.max(MIN_H, startH - dy)) + "px";
        sheet.style.transform = "";
      }
    });
    function endDrag(e) {
      if (!dragging) return;
      dragging = false;
      sheet.style.transition = "";
      var dy = e.clientY - startY;
      if (dy > CLOSE_THRESHOLD) closeFn();
      sheet.style.transform = "";
    }
    grip.addEventListener("pointerup", endDrag);
    grip.addEventListener("pointercancel", endDrag);
  }

  // uploadBtn/uploadInput的click/change监听器已删除——第九步(档案库)迁移React后，
  // <input type="file">由DocsScreen.tsx自己渲染+持有ref，onChange直接调用
  // window.__azBridge.uploadArchiveFile(file)(上面新增的函数，逻辑跟原来这段一致)。

  // 通知渠道：安卓8+发通知必须先建channel，插件不会自动建；幂等，每次启动调用无副作用。
  (function () {
    var LN = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications;
    if (LN) LN.createChannel({ id: "repay", name: "还款提醒", description: "债务还款日提醒", importance: 4 }).catch(function () {});
  })();

  // React迁移桥接："在还债务"页(react/src/debts/)整体由React接管，这里只暴露它实际需要
  // 调用的这几个vanilla函数/状态读取器——其余(saveForm/公式生成器等)继续保持private，
  // 后续阶段迁移到别的页面时才按需加进来。详见CLAUDE.md"React 迁移"一节。
  window.__azBridge = {
    getDebts: function () { return debts; }, // 每次调用现读，debts会在commitReorder/
    // applyBackupData/导入JSON三处被整体重新赋值，不是原地mutate，函数包一层才能
    // 保证每次都拿到当前最新的那个引用。
    getPremium: function () { return premium; },
    getAccount: function () { return account; },
    // openDetail/openEdit都已删除——打开详情窗/编辑表单现在都是纯React状态(shared/state.ts的
    // openDetailSheet/openEditSheet)，不再经过这个桥接对象，见react/src/sheets/。
    payInstallment: payInstallment,
    unsettle: unsettle,
    commitReorder: commitReorder,
    saveAll: saveAll,
    renderAll: renderAll,
    // openPremiumScreen/openAccountScreen/openAiScreen已删除——第七步(accountScreen/
    // premiumScreen/termsScreen)/第十一步(aiScreen)迁移React后，这几个screen都是React
    // 自己拥有的sheet(shared/state.ts)，不再经过这个桥接对象。
    // detailSheet(react/src/sheets/)新增：#dSettle以前只在vanilla内部调用，现在按钮由React
    // 渲染，需要显式桥接。openSimScreen已删除——第八步(simScreen)迁移React后不再经过桥接。
    settleFull: settleFull,
    getNotify: function () { return notify; },
    exportReportXlsx: exportReportXlsx,
    exportReportPdf: exportReportPdf,
    // "我的"tab(react/src/mine/)新增：备份文件打包/解析、系统文件选择器继续100%vanilla。
    // openDocsScreen/openBackupScreen已删除——第九步(docsScreen)/第十步(backupScreen)迁移
    // React后不再经过桥接。
    downloadBackupFile: downloadBackupFile,
    triggerImportFilePicker: triggerImportFilePicker,
    // editSheet(react/src/sheets/EditSheet.tsx)新增：setDebt是保存写入(见上面定义处的注释)，
    // deleteDebt是原样暴露的既有vanilla函数(自带ask()确认+splice+saveAll+renderAll)，
    // toast是#flash单例的简单passthrough，confirmAsync是ask()的Promise外壳(批量设置还款日/
    // 金额要在纯React状态上await结果，见askAsync()定义处的注释)。
    setDebt: setDebt,
    deleteDebt: deleteDebt,
    toast: toast,
    confirmAsync: askAsync,
    // 第七步(accountScreen/premiumScreen)新增：这三个是真实的cloud/native调用或者共享
    // 状态变更，留在vanilla私有作用域里，React只调用不重新实现。
    wxLogout: wxLogout,
    deleteAccount: deleteAccount,
    redeemCode: redeemCode,
    // 第八步(notifySheet)新增：这4个都要调用@capacitor/local-notifications原生插件
    // (权限检查/申请/调度)，留在vanilla私有作用域里，React只调用不重新实现。
    setNotifyEnabled: setNotifyEnabled,
    addNotifyRule: addNotifyRule,
    deleteNotifyRule: deleteNotifyRule,
    sendTestNotification: sendTestNotification,
    // 第九步(docsScreen)新增：IndexedDB(uploads)+docs数组的增删、原生分享全部留vanilla，
    // getFiles()合成不含原始Blob的展示数据，其余3个按id反查目标(不需要把Blob传过桥接边界)。
    getFiles: getFiles,
    uploadArchiveFile: uploadArchiveFile,
    deleteArchiveFile: deleteArchiveFile,
    downloadArchiveFile: downloadArchiveFile,
    shareArchiveFile: shareArchiveFile,
    // 第十步(backupScreen)新增：全部cloud函数调用(ensureCbAuthReady/cbApp().callFunction
    // 这套认证会话状态)继续100%vanilla，二次确认弹窗挪到了React用confirmAsync处理，这几个
    // 函数只做"真的去调用"这一步(见上面定义处的注释)。
    createBackup: createBackup,
    listBackups: listBackups,
    restoreBackup: restoreBackup,
    deleteBackup: deleteBackup,
    getBackupMeta: getBackupMeta,
    // 第十一步(aiScreen)新增，且是这一步唯一的新增：callAiAdvisor原样保留(依赖
    // ensureCbAuthReady/cbApp().callFunction这套认证会话状态，不可移植)。
    callAiAdvisor: callAiAdvisor
  };

  renderAll(); loadUploads(); renderAccountUI();
})();
</script>
