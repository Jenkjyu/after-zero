<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>方案 A · 原生延续 — After Zero 统计页原型</title>
<link rel="stylesheet" href="shared/tokens.css">
<style>
/* ============================================================================
   方案 A：After Zero 原生延续
   ----------------------------------------------------------------------------
   立场：不发明新的视觉语言，把"债务"tab 已经成立的那一套（石墨 hero + 色雾、
   18px 圆角、--e2 阴影 + 顶部内高光、999px 胶囊标签）完整搬到统计页，同时**修掉
   审计里点名的三处不一致**：
     ① 图表图例从 2–3px 圆角方块改成 999px 胶囊，跟全局 .tag 统一
     ② ⋮ 三点菜单换成具名按钮（全 App 只有这一处三点菜单）
     ③ 统计页的石墨 hero 补上"债务"tab 有、统计页没有的色雾动效层
   配色：**改成"一个颜色 = 一个角色"的 3 色制**，不是"一张图一个颜色"。
     蓝 = 量级（本金、各债务余额）· 琥珀 = 成本（利息）· 绿 = 进度（走势线）
   这三色跑 dataviz 的 validate_palette.js（--pairs all）浅深两套全部 ALL PASS，
   数值见 README。
   ========================================================================== */
.viz-root {
  --ch-mag: #2B6CB8;    /* 量级：本金段、各债务横条 */
  --ch-cost: #C4892F;   /* 成本：利息段 */
  --ch-prog: #068468;   /* 进度：负债走势线 */
  --series-1: #2B6CB8; --series-2: #C4892F; --series-3: #068468;
  --series-4: #96405D; --series-5: #634096; --series-6: #408596;
}
[data-theme="dark"] .viz-root {
  --ch-mag: #5590D8; --ch-cost: #BC8B3C; --ch-prog: #43A883;
  --series-1: #5590D8; --series-2: #BC8B3C; --series-3: #43A883;
  --series-4: #C0728C; --series-5: #9172C0; --series-6: #72B0C0;
}

.app { padding: max(18px, env(safe-area-inset-top)) 14px 24px; }

/* ---------- 石墨 hero（原样沿用 .hero 的全部参数，补回色雾层） ---------- */
.hero { position: relative; border-radius: 24px; padding: 20px 20px 18px; margin-bottom: 13px;
  overflow: hidden; background: linear-gradient(155deg, var(--graphite-a), var(--graphite-b));
  color: var(--graphite-text); box-shadow: var(--e3); }
.hero::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  z-index: 2; box-shadow: inset 0 1px 0 rgba(255,255,255,.1); }
.hero > * { position: relative; z-index: 1; }
.hero-smoke { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; pointer-events: none; z-index: 0; }
.hero-puff { position: absolute; border-radius: 50%; filter: blur(30px); mix-blend-mode: screen; opacity: .55; }
.hero-puff.a { width: 200px; height: 200px; left: -12%; top: 8%;
  background: radial-gradient(circle, rgba(111,190,158,.55), transparent 70%); animation: heroDrift1 8s ease-in-out infinite; }
.hero-puff.b { width: 170px; height: 170px; right: -8%; top: 30%;
  background: radial-gradient(circle, rgba(90,170,180,.5), transparent 70%); animation: heroDrift2 10s ease-in-out infinite; }
.hero-puff.c { width: 150px; height: 150px; left: 30%; bottom: -20%;
  background: radial-gradient(circle, rgba(120,200,150,.4), transparent 70%); animation: heroDrift3 12.5s ease-in-out infinite; }
@keyframes heroDrift1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(40px,20px) scale(1.15); } }
@keyframes heroDrift2 { 0%,100% { transform: translate(0,0) scale(1.05); } 50% { transform: translate(-36px,-16px) scale(.92); } }
@keyframes heroDrift3 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(24px,-30px) scale(1.2); } }
@media (prefers-reduced-motion: reduce) { .hero-puff { animation: none; } }
.hero-top { display: flex; align-items: center; justify-content: space-between; }
.hero-label { font-size: 12.5px; font-weight: 600; letter-spacing: .04em; color: var(--graphite-dim); }
.hero-amt { font-size: 36px; font-weight: 700; margin: 8px 0 0; font-family: var(--font-num);
  font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.hero-amt .cur { font-size: 21px; font-weight: 600; margin-right: 2px; color: var(--graphite-dim); }
.hero-prog { margin-top: 15px; }
.hero-prog-track { height: 6px; border-radius: 999px; background: rgba(255,255,255,.12); overflow: hidden; }
.hero-prog-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, rgba(var(--accent-rgb),.75), #6FBE9E); }
.hero-prog-row { display: flex; justify-content: space-between; align-items: baseline; margin-top: 8px; }
.hero-prog-row .l { font-size: 11.5px; color: var(--graphite-dim); }
.hero-prog-row .r { font-size: 11.5px; color: var(--graphite-text); font-weight: 600; font-family: var(--font-num); }
.hero-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.hero-pill { font-size: 11px; font-weight: 600; color: var(--graphite-dim);
  border: 1px solid rgba(255,255,255,.16); border-radius: 999px; padding: 3px 10px; }
/* ② ⋮ 换成具名按钮：全 App 别处从来没出现过三点菜单，那个符号是数据后台的方言 */
.hero-export { display: inline-flex; align-items: center; gap: 5px; background: rgba(255,255,255,.12);
  border: none; border-radius: 999px; padding: 5px 11px 5px 9px; color: var(--graphite-text);
  font-size: 11.5px; font-weight: 600; }
.hero-export svg { width: 13px; height: 13px; }

/* ---------- KPI ---------- */
.summary { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 10px; }
.kpi { position: relative; background: var(--card-grad); border: 1px solid var(--hair);
  border-radius: 18px; padding: 12px 14px; box-shadow: var(--e2); }
.kpi::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  box-shadow: inset 0 1px 0 var(--glass-hi); }
.kpi .v { font-size: 17px; font-weight: 650; margin-top: 3px; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.kpi .k { font-size: 11px; color: var(--text-muted); }
.kpi-sub { font-size: 10.5px; color: var(--text-faint); margin-top: 2px; }
.hero-counts { font-size: 11.5px; color: var(--text-muted); margin: 0 2px 10px; }
.note-toggle { background: none; border: none; color: var(--accent); font-size: 12px; font-weight: 600;
  padding: 2px; margin: 0 2px 14px; display: flex; align-items: center; gap: 3px; }
.note-toggle svg { width: 12px; height: 12px; transition: transform .15s ease; }
.note-toggle.open svg { transform: rotate(180deg); }
.footnote { font-size: 11.5px; color: var(--text-muted); line-height: 1.6; }

/* ---------- 图表卡（跟 .kpi 完全同参数：18px / --card-grad / --e2 / 顶部内高光） ---------- */
.viz-block { position: relative; margin-bottom: 14px; background: var(--card-grad);
  border: 1px solid var(--hair); border-radius: 18px; padding: 14px 16px; box-shadow: var(--e2); }
.viz-block::after { content: ""; position: absolute; inset: 0; border-radius: inherit;
  pointer-events: none; box-shadow: inset 0 1px 0 var(--glass-hi); }
.viz-title { font-size: 13.5px; font-weight: 700; }
.viz-title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.viz-tag { font-size: 10px; font-weight: 600; color: var(--text-muted); border: 1px solid var(--hair);
  border-radius: 999px; padding: 2px 8px; flex: none; }

/* ① 图例改成 999px 胶囊，跟全局 .tag 一套语言（原来是 2–3px 圆角小方块） */
.legend { display: flex; gap: 6px; flex-wrap: wrap; }
.legend-pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600;
  border-radius: 999px; padding: 2px 9px 2px 7px; background: var(--surface-2); color: var(--text-muted); }
.legend-pill i { width: 8px; height: 8px; border-radius: 50%; flex: none; }

/* 压力图 */
.pstats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; margin-bottom: 12px; }
.pstats .k { font-size: 11px; color: var(--text-muted); }
.pstats .v { font-size: 14.5px; font-weight: 650; font-family: var(--font-num); font-variant-numeric: tabular-nums; margin-top: 1px; }
.readout { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; font-family: var(--font-num); }
.readout .dim { color: var(--text-faint); font-weight: 500; }
.pviewport { position: relative; padding-left: 34px; }
.pgrid { position: absolute; left: 34px; right: 0; top: 0; height: 108px; pointer-events: none; }
.gridline { position: absolute; left: 0; right: 0; height: 0; border-top: 1px solid var(--hair); }
.gridline span { position: absolute; right: 100%; top: -6px; padding-right: 6px; font-size: 9.5px;
  color: var(--text-faint); font-family: var(--font-num); white-space: nowrap; }
.pscroll { overflow-x: auto; overflow-y: hidden; overscroll-behavior-x: contain; scrollbar-width: none; }
.pscroll::-webkit-scrollbar { display: none; }
.ptrack { width: 100%; }
.pbars { position: relative; display: flex; align-items: flex-end; gap: 2px; height: 108px; }
.pcol { position: relative; flex: 1; min-width: 0; height: 100%; padding: 0; border: none; background: none;
  display: flex; align-items: flex-end; }
.pstack { width: 100%; max-width: 24px; margin: 0 auto; height: 100%; display: flex; flex-direction: column-reverse; gap: 2px; }
.pstack .seg { width: 100%; flex: none; }
.pstack .seg.p { background: var(--ch-mag); }
.pstack .seg.i { background: var(--ch-cost); border-radius: 4px 4px 0 0; }
.pstack .seg.i.zero { display: none; }
.pstack .seg.i.zero ~ .seg.p { border-radius: 4px 4px 0 0; }
.pcol.active .seg { filter: brightness(1.14); }
.pcol.now .pstack { box-shadow: 0 2px 0 0 var(--accent); }
.pcol.ybreak::before { content: ""; position: absolute; left: -2px; top: 0; bottom: -4px; width: 1px; background: var(--hair); }
.ppeak { position: absolute; left: 50%; top: -1px; transform: translateX(-50%); width: 0; height: 0;
  border-left: 3.5px solid transparent; border-right: 3.5px solid transparent; border-top: 4px solid var(--text-faint); }
.xaxis { display: flex; gap: 2px; margin-top: 5px; }
.xtick { flex: 1; min-width: 0; text-align: center; font-size: 9.5px; color: var(--text-faint); white-space: nowrap; }
.xtick.active { color: var(--text-muted); font-weight: 700; }
.breakdown { margin-top: 12px; border-top: 1px solid var(--hair); padding-top: 10px; }
.bd-label { font-size: 11px; color: var(--text-muted); margin: 0 2px 6px; }
.bd-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; padding: 3px 2px; }
.bd-row .num { font-weight: 600; }

/* 走势图 */
.chart-plot { position: relative; height: 118px; padding-left: 34px; }
.chart-area { position: absolute; left: 34px; right: 0; top: 0; bottom: 0; }
.chart-area svg { width: 100%; height: 100%; display: block; }
.chart-dot { position: absolute; width: 7px; height: 7px; border-radius: 50%; background: var(--ch-prog);
  transform: translate(-50%, 50%); box-shadow: 0 0 0 2px var(--surface); }
.xaxis-spread { display: flex; justify-content: space-between; font-size: 9.5px; color: var(--text-faint); margin-top: 5px; padding-left: 34px; }

/* 各债务剩余待还 */
.mode-toggle { display: flex; gap: 2px; background: var(--surface-2); border-radius: 9px; padding: 2px; flex: none; }
.mode-btn { background: none; border: none; padding: 3px 8px; border-radius: 7px; color: var(--text-muted);
  font-size: 11px; font-weight: 600; }
.mode-btn.active { background: var(--card-grad); color: var(--ch-mag); box-shadow: var(--e1); }
.bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12px;
  border-radius: 9px; padding: 2px 6px; margin-left: -6px; margin-right: -6px; }
.bar-row.active { background: var(--surface-2); }
.bar-name { width: 62px; flex: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-muted); }
.bar-track { flex: 1; background: var(--surface-2); border-radius: 5px; height: 16px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--ch-mag); border-radius: 5px; }
.bar-val { width: 76px; flex: none; text-align: right; font-family: var(--font-num); font-weight: 600; }

/* 类型占比 */
.stack { display: flex; height: 26px; border-radius: 7px; overflow: hidden; margin-bottom: 10px; gap: 2px; }
.stack-seg { height: 100%; }
.stack-legend { display: flex; flex-direction: column; gap: 6px; }
.stack-legend .row { display: flex; align-items: center; gap: 7px; font-size: 12px; }
.stack-legend .sw { width: 9px; height: 9px; border-radius: 999px; flex: none; }
.stack-legend .nm { flex: 1; }
.stack-legend .pc { color: var(--text-muted); font-family: var(--font-num); }
.stack-legend .amt { font-family: var(--font-num); font-weight: 600; width: 72px; text-align: right; }

/* 统计总结 */
.sum-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 12.5px;
  padding: 7px 2px; border-bottom: 1px solid var(--hair); }
.sum-row:last-of-type { border-bottom: none; }
.sum-row .k { color: var(--text-muted); flex: none; }
.sum-row .v { font-weight: 600; text-align: right; }
.rate-hi { color: var(--critical); } .rate-mid { color: var(--warning); } .rate-lo { color: var(--good); }
</style>
</head>
<body>
<div class="phone">
  <div class="app viz-root" id="app"></div>
  <div id="tabbar"></div>
</div>
<div id="themeBtn"></div>

<script src="shared/data.js"></script>
<script src="shared/util.js"></script>
<script>
initTheme();
document.getElementById("themeBtn").outerHTML = THEME_BTN_HTML;
document.getElementById("tabbar").outerHTML = TABBAR_HTML;

var D = window.AZ_DATA;
var state = { pIdx: 0, barMode: "balance", noteOpen: false };

var BAR_MODES = {
  balance: { title: "各债务剩余待还", key: "balance", fmt: function (v) { return "¥" + fmt(v); } },
  rate:    { title: "各债务年化利率", key: "rate",    fmt: function (v) { return v.toFixed(2) + "%"; } },
  interest:{ title: "各债务剩余待付利息", key: "remainingInterest", fmt: function (v) { return "¥" + fmt(v); } }
};

function rateClass(r) { return r >= 18 ? "rate-hi" : (r >= 10 ? "rate-mid" : "rate-lo"); }

function render() {
  var s = D.summary, r = D.report, p = D.pressure, c = D.conclusions;
  var el = document.getElementById("app");
  el.innerHTML =
    heroHtml(s, r) +
    kpiHtml(s, r) +
    '<div class="hero-counts">' + s.active + " 笔在还 · " + s.settled + " 笔已结清</div>" +
    noteHtml() +
    pressureHtml(p) +
    payoffHtml(r) +
    barsHtml() +
    typeHtml(r) +
    summaryHtml(r, c, p);
}

function heroHtml(s, r) {
  return '<div class="hero">' +
    '<div class="hero-smoke" aria-hidden="true"><span class="hero-puff a"></span><span class="hero-puff b"></span><span class="hero-puff c"></span></div>' +
    '<div class="hero-top"><div class="hero-label">在还总负债</div>' +
      '<button class="hero-export" type="button">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7.5 10.5L12 15l4.5-4.5"/><path d="M4 18.5v.5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-.5"/></svg>导出</button>' +
    "</div>" +
    '<div class="hero-amt num"><span class="cur">¥</span>' + fmt(r.totalBalance) + "</div>" +
    '<div class="hero-prog"><div class="hero-prog-track"><div class="hero-prog-fill" style="width:' + s.pct + '%"></div></div>' +
      '<div class="hero-prog-row"><span class="l num">已还本金 ¥' + fmt(s.paidPrincipal) + '</span><span class="r num">已完成 ' + s.pct + "%</span></div></div>" +
    '<div class="hero-pills"><span class="hero-pill">只算本金</span><span class="hero-pill">预计 ' + r.payoffDate + " 还清</span></div>" +
  "</div>";
}

function kpiHtml(s, r) {
  return '<div class="summary">' +
    kpi("¥" + fmt(s.paidPrincipal), "已还本金", "另付利息 ¥" + fmt(s.paidInterest)) +
    kpi("¥" + fmt(s.monthly), "经常性月供", "不含一次性还清") +
    kpi(s.pct + "%", "归零进度", "按本金计") +
    kpi(r.avgRate.toFixed(2) + "%", "加权平均利率", "按余额加权") +
  "</div>";
}
function kpi(v, k, sub) {
  return '<div class="kpi"><div class="v num">' + v + '</div><div class="k">' + k + '</div><div class="kpi-sub">' + sub + "</div></div>";
}

function noteHtml() {
  return '<button class="note-toggle' + (state.noteOpen ? " open" : "") + '" type="button" data-act="note">计算口径说明' +
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>' +
    (state.noteOpen ? '<div class="footnote" style="margin:-8px 2px 14px">' +
      "在还总负债 = 各未结清债务「未还本金」之和（只算本金，不含未来的利息/手续费）。<br>" +
      "已还本金 = 全部债务（含已结清）已标记为「已还」期次的本金之和。<br>" +
      "经常性月供 = 各未结清债务下一期应还金额之和（不含一次性还清）。<br>" +
      "归零进度 = 已还本金 ÷（已还本金 + 在还总负债），只按本金计算。<br>" +
      "预计还清日期按现有还款计划推算，<b>是预测不是承诺</b>。</div>" : "");
}

function pressureHtml(p) {
  var months = p.months, n = months.length;
  var top = niceCeil(Math.max.apply(null, months.map(function (m) { return m.total; }))) || 1;
  var idx = Math.min(Math.max(state.pIdx, 0), n - 1);
  var act = months[idx];
  var peakIdx = p.peak ? months.findIndex(function (m) { return m.month === p.peak.month; }) : -1;

  var bars = months.map(function (m, i) {
    var barPct = (m.total / top) * 100, split = m.principal + m.interest;
    var pH = split <= 0 ? barPct : barPct * (m.principal / split);
    var iH = split <= 0 ? 0 : barPct * (m.interest / split);
    return '<button class="pcol' + (i === idx ? " active" : "") + (i === 0 ? " now" : "") +
      (m.month.slice(5, 7) === "01" && i > 0 ? " ybreak" : "") + '" data-act="pcol" data-i="' + i +
      '" aria-label="' + monthLabel(m.month) + "待还 ¥" + fmt(m.total) + '">' +
      (i === peakIdx ? '<span class="ppeak"></span>' : "") +
      '<div class="pstack"><div class="seg p" style="height:' + pH + '%"></div>' +
      '<div class="seg i' + (iH <= 0 ? " zero" : "") + '" style="height:' + iH + '%"></div></div></button>';
  }).join("");

  var ticks = months.map(function (m, i) {
    return '<div class="xtick' + (i === idx ? " active" : "") + '">' + monthTick(m.month) + "</div>";
  }).join("");

  return '<div class="viz-block">' +
    '<div class="viz-title-row"><div class="viz-title">未来还款压力</div>' +
      '<div class="legend"><span class="legend-pill"><i style="background:var(--ch-mag)"></i>本金</span>' +
      '<span class="legend-pill"><i style="background:var(--ch-cost)"></i>利息</span></div></div>' +
    '<div class="pstats">' +
      '<div><div class="k">本月待还</div><div class="v num">¥' + fmt(months[0].total) + "</div></div>" +
      '<div><div class="k">' + n + '个月共</div><div class="v num">¥' + fmt(p.totalAhead) + "</div></div>" +
      '<div><div class="k">月均</div><div class="v num">¥' + fmt(p.monthlyAvg) + "</div></div>" +
      '<div><div class="k">压力最大</div><div class="v num">' + (p.peak ? monthLabel(p.peak.month) + " ¥" + fmt(p.peak.total) : "—") + "</div></div>" +
    "</div>" +
    '<div class="readout">' + monthLabel(act.month) + "待还 ¥" + fmt(act.total) +
      (act.principal + act.interest > 0 ? '<span class="dim">（本金 ¥' + fmt(act.principal) + " · 利息 ¥" + fmt(act.interest) + "）</span>" : "") + "</div>" +
    '<div class="pviewport"><div class="pgrid">' +
      [0, 0.5, 1].map(function (f) {
        return '<div class="gridline" style="bottom:' + f * 100 + '%"><span class="num">' + (f === 0 ? "0" : fmt(top * f)) + "</span></div>";
      }).join("") +
    "</div>" +
    '<div class="pscroll"><div class="ptrack" style="min-width:' + n * 26 + 'px">' +
      '<div class="pbars">' + bars + "</div>" +
      '<div class="xaxis">' + ticks + "</div>" +
    "</div></div></div>" +
    (act.items.length ? '<div class="breakdown"><div class="bd-label">' + monthLabel(act.month) + "要还的债务</div>" +
      act.items.map(function (it) {
        return '<div class="bd-row"><span>' + it.name + '</span><span class="num">¥' + fmt(it.amount) + "</span></div>";
      }).join("") + "</div>" : "") +
  "</div>";
}

function payoffHtml(r) {
  var tl = r.timeline, W = 300, H = 100;
  var top = niceCeil(tl[0].balance) || 1;
  var co = timelineCoords(tl, W, H, top);
  var mid = tl[Math.floor(tl.length / 2)];
  return '<div class="viz-block">' +
    '<div class="viz-title-row"><div class="viz-title">负债余额走势</div><span class="viz-tag">预测</span></div>' +
    '<div class="readout">今天 ¥' + fmt(tl[0].balance) + ' <span class="dim">→ ' + r.payoffDate + " 归零</span></div>" +
    '<div class="chart-plot">' +
      [0, 0.5, 1].map(function (f) {
        return '<div class="gridline" style="bottom:' + f * 100 + "%;left:34px;right:0\"><span class=\"num\">" + (f === 0 ? "0" : fmt(top * f)) + "</span></div>";
      }).join("") +
      '<div class="chart-area">' +
        '<svg viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none">' +
          '<defs><linearGradient id="agrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="' + H + '">' +
            '<stop offset="0%" stop-color="var(--ch-prog)" stop-opacity="0.28"/>' +
            '<stop offset="100%" stop-color="var(--ch-prog)" stop-opacity="0.02"/></linearGradient></defs>' +
          '<path d="' + areaPath(co, H) + '" fill="url(#agrad)"/>' +
          '<path d="' + linePath(co) + '" fill="none" stroke="var(--ch-prog)" stroke-width="2" vector-effect="non-scaling-stroke"/>' +
        "</svg>" +
        '<span class="chart-dot" style="left:' + (co[co.length - 1][0] / W) * 100 + "%;bottom:" + (1 - co[co.length - 1][1] / H) * 100 + '%"></span>' +
      "</div>" +
    "</div>" +
    '<div class="xaxis-spread"><span>今天</span><span>' + mid.date.slice(0, 7) + "</span><span>" + r.payoffDate.slice(0, 7) + "</span></div>" +
    '<div class="footnote" style="margin-top:8px">按现有还款计划推算，不含提前还款；本 App 不保存历史余额，这条线不是实际走过的轨迹。</div>' +
  "</div>";
}

function barsHtml() {
  var m = BAR_MODES[state.barMode];
  var rows = D.byDebt.slice().sort(function (a, b) { return b[m.key] - a[m.key]; });
  var max = Math.max.apply(null, rows.map(function (x) { return x[m.key]; })) || 1;
  return '<div class="viz-block">' +
    '<div class="viz-title-row"><div class="viz-title">' + m.title + "</div>" +
      '<div class="mode-toggle">' +
        Object.keys(BAR_MODES).map(function (k) {
          return '<button class="mode-btn' + (state.barMode === k ? " active" : "") + '" type="button" data-act="mode" data-k="' + k + '">' +
            ({ balance: "余额", rate: "利率", interest: "剩余利息" })[k] + "</button>";
        }).join("") +
      "</div></div>" +
    rows.map(function (x) {
      return '<div class="bar-row"><div class="bar-name">' + x.name + "</div>" +
        '<div class="bar-track"><div class="bar-fill" style="width:' + (x[m.key] / max) * 100 + '%"></div></div>' +
        '<div class="bar-val">' + m.fmt(x[m.key]) + "</div></div>";
    }).join("") +
  "</div>";
}

function typeHtml(r) {
  var total = r.typeList.reduce(function (s, x) { return s + x.value; }, 0) || 1;
  return '<div class="viz-block">' +
    '<div class="viz-title" style="margin-bottom:10px">债务类型占比</div>' +
    '<div class="stack">' + r.typeList.map(function (x, i) {
      return '<div class="stack-seg" style="width:' + (x.value / total) * 100 + "%;background:var(--series-" + (i + 1) + ')"></div>';
    }).join("") + "</div>" +
    '<div class="stack-legend">' + r.typeList.map(function (x, i) {
      return '<div class="row"><span class="sw" style="background:var(--series-' + (i + 1) + ')"></span>' +
        '<span class="nm">' + x.name + '</span><span class="pc">' + Math.round((x.value / total) * 100) + '%</span>' +
        '<span class="amt">¥' + fmt(x.value) + "</span></div>";
    }).join("") + "</div>" +
  "</div>";
}

function summaryHtml(r, c, p) {
  return '<div class="viz-block">' +
    '<div class="viz-title" style="margin-bottom:6px">统计总结</div>' +
    row("在还债务", D.summary.active + " 笔 · ¥" + fmt(r.totalBalance)) +
    row("利率最高", c.topRate.name + ' <b class="' + rateClass(c.topRate.rate) + ' num">' + c.topRate.rate.toFixed(2) + "%</b>") +
    row("高息债务（年化 ≥18%）", c.highCount ? c.highCount + " 笔 · ¥" + fmt(c.highBalance) : "没有") +
    row("剩余待付利息", "¥" + fmt(c.restInterest)) +
    row("未来" + p.windowMonths + "个月要还", "¥" + fmt(p.totalAhead)) +
    row("预计还清", r.payoffDate + "（约 " + c.monthsLeft + " 个月后）") +
    '<div class="footnote" style="margin-top:10px">利率由每笔债务的还款计划反推（IRR）；剩余待付利息按现有计划算到还清为止。</div>' +
  "</div>";
}
function row(k, v) { return '<div class="sum-row"><span class="k">' + k + '</span><span class="v num">' + v + "</span></div>"; }

/* ⚠️监听器只在启动时绑一次，绑在 #app 这个**不会被 render() 替换**的容器上
   （render() 只改它的 innerHTML）。不要写成"每次 render 末尾再 addEventListener
   一次 + {once:true}"——那样一次点在空白处（没命中 [data-act]、提前 return）
   就会把监听器消耗掉，后面再点全部失效。 */
document.getElementById("app").addEventListener("click", function (e) {
  var t = e.target.closest("[data-act]");
  if (!t) return;
  var a = t.getAttribute("data-act");
  if (a === "note") state.noteOpen = !state.noteOpen;
  if (a === "pcol") { var i = +t.getAttribute("data-i"); state.pIdx = (i === state.pIdx ? 0 : i); }
  if (a === "mode") state.barMode = t.getAttribute("data-k");
  render();
});

render();
</script>
</body>
</html>
