<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>方案 B · 债务洞察叙事 — After Zero 统计页原型</title>
<link rel="stylesheet" href="shared/tokens.css">
<style>
/* ============================================================================
   方案 B：债务洞察叙事
   ----------------------------------------------------------------------------
   立场：这一页不是"把数据画出来"，是"把结论说出来"。每一段先给一句判断，
   图表退成这句判断的证据。

   ⚠️2026-07-31 第二轮改动（六项）：
   ① 页面底色**保持不变**（跟 A/C 一样是 --app-grad，实测三套一个像素都没差；
      观感差异来自 B 卡片覆盖率低，这是叙事版刻意的取舍，已确认保留）
   ② "三件值得注意的事" + "最该先动手的地方" 改成**规则驱动**：4 条候选结论各带
      触发条件和严重度公式，不成立就不显示；"最该先动手"取严重度最高的**可行动**
      那条展开。原来那句"4 笔网贷吃掉了大部分利息"是写死的，而且在这份数据下是
      **假的**（网贷占余额 12.0%、占剩余待付利息 12.9%，几乎等比例）。
   ③ 还清进度图的三个节点：名称/时间/金额全部标在图上，不再是图下面那排像图例的字
   ④ 压力图从柱状图改成**堆叠面积折线图**（下层本金、上层利息，总高=当月压力），
      保留横向滑动和点击查看当月明细
   ⑤ 排行不再固定前 3 笔，改成**累计占比达 70% 为止**（当前数据 → 前 4 笔 75.7%）
   ⑥ 类型占比改成**可拖拽旋转的饼图**，数据标签直接标在图上（文字始终水平），去掉图例

   配色：风险二档制（红 = 高息 ≥18%，蓝 = 其余）。
   ⚠️原本想按 App 现有的 .tag.rate-hi/mid/lo 做三档（红/琥珀/蓝），跑
   validate_palette.js 发现红↔琥珀在**正常视觉**下 ΔE 只有 12.4（低于 15 的硬性下限，
   deutan 更是只有 4.5）。改成二档后浅深两套全部 ALL PASS，且每行都写着利率数字，
   颜色不是唯一编码。数值见 README。
   ========================================================================== */
.viz-root {
  --risk: #C42F2F;      /* 高息（年化 ≥18%） */
  --calm: #2F639C;      /* 其余债务 */
  --ch-mag: #2B6CB8;    /* 本金 */
  --ch-cost: #C4892F;   /* 利息 */
  --ch-prog: #068468;   /* 还清进度线 */
  --pie-1: #2B6CB8; --pie-2: #C4892F; --pie-3: #068468; --pie-4: #96405D; --pie-5: #634096; --pie-6: #408596;
}
[data-theme="dark"] .viz-root {
  --risk: #DC6767; --calm: #5E96D0; --ch-mag: #5590D8; --ch-cost: #BC8B3C; --ch-prog: #43A883;
  --pie-1: #5590D8; --pie-2: #BC8B3C; --pie-3: #43A883; --pie-4: #C0728C; --pie-5: #9172C0; --pie-6: #72B0C0;
}

.app { padding: max(18px, env(safe-area-inset-top)) 18px 24px; }

/* ---------- 报告头 ---------- */
.rpt-head { padding: 6px 0 18px; }
.rpt-kicker { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--text-faint); }
.rpt-title { font-size: 25px; font-weight: 700; line-height: 1.3; margin: 8px 0 0; letter-spacing: -.01em; }
.rpt-title em { font-style: normal; color: var(--ch-prog); }
.rpt-lede { font-size: 13.5px; line-height: 1.75; color: var(--text-muted); margin-top: 10px; }
.rpt-lede b { color: var(--text); font-weight: 700; font-family: var(--font-num); }

/* ---------- 段落 ---------- */
.sec { padding: 20px 0; border-top: 1px solid var(--hair); }
.sec-q { font-size: 11.5px; font-weight: 600; color: var(--text-faint); letter-spacing: .04em; }
.sec-a { font-size: 17px; font-weight: 700; line-height: 1.45; margin: 5px 0 0; letter-spacing: -.005em; }
.sec-a .n { font-family: var(--font-num); }
.sec-note { font-size: 12.5px; line-height: 1.7; color: var(--text-muted); margin-top: 8px; }
.sec-note b { color: var(--text); font-family: var(--font-num); font-weight: 700; }

/* ---------- 发现列表 ---------- */
.finding { display: flex; gap: 11px; padding: 11px 0; border-bottom: 1px solid var(--hair); }
.finding:last-child { border-bottom: none; }
.finding-ic { width: 30px; height: 30px; border-radius: 9px; flex: none; display: flex; align-items: center; justify-content: center; }
.finding-ic svg { width: 16px; height: 16px; }
.finding-ic.risk { background: var(--critical-soft); color: var(--critical); }
.finding-ic.warn { background: var(--warning-soft); color: var(--warning); }
.finding-ic.info { background: var(--good-soft); color: var(--good); }
.finding-ic.good { background: var(--accent-soft); color: var(--accent); }
.finding-t { font-size: 13.5px; font-weight: 700; line-height: 1.4; }
.finding-s { font-size: 12px; color: var(--text-muted); margin-top: 3px; line-height: 1.6; }
.finding-s b { color: var(--text); font-family: var(--font-num); font-weight: 700; }

/* ---------- "最该先动手"展开块：底色跟着那条结论自己的 tone 走 ---------- */
.act-box { border-radius: 14px; padding: 14px 15px; margin-top: 12px; }
.act-box.risk { background: var(--critical-soft); }
.act-box.warn { background: var(--warning-soft); }
.act-box.info { background: var(--good-soft); }
.act-top { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; }
.act-box.risk .act-top { color: var(--critical); }
.act-box.warn .act-top { color: var(--warning); }
.act-box.info .act-top { color: var(--good); }
.act-top svg { width: 15px; height: 15px; flex: none; }
.act-body { font-size: 12.5px; line-height: 1.7; color: var(--text); margin-top: 7px; opacity: .85; }
.act-body b { font-family: var(--font-num); font-weight: 700; }
.act-list { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.act-item { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.act-item .nm { flex: none; width: 52px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.act-item .track { flex: 1; height: 6px; border-radius: 999px; background: rgba(0,0,0,.10); overflow: hidden; }
[data-theme="dark"] .act-item .track { background: rgba(255,255,255,.12); }
/* ⚠️display:block 不能省。.fill 是个 <span>，默认 display:inline，而**inline 元素
   会静默忽略 width/height**——内联样式 width:100%/68.9%/… 全都算对了却完全不生效，
   实测 6 根填充的 getBoundingClientRect() 宽高都是 0，界面上只剩空的灰色底槽，
   条形长度差异（¥1,089 vs ¥540 该差一倍）和颜色一起消失。
   .track 有 flex:1 所以被 flex 容器 blockify 了，尺寸正常；.fill 在 track 里面
   没有任何东西 blockify 它，必须自己声明。 */
.act-item .fill { display: block; height: 100%; border-radius: 999px; }
.act-item .rt { font-family: var(--font-num); font-weight: 700; width: 62px; text-align: right; }
/* 被截断掉的那几笔的合计，靠右对齐到跟金额列同一条线上 */
.act-rest { font-size: 11px; color: var(--text); opacity: .6; text-align: right; margin-top: 8px;
  font-family: var(--font-num); }
.act-box.risk .act-item .fill { background: var(--risk); }
.act-box.warn .act-item .fill { background: var(--warning); }
.act-box.info .act-item .fill { background: var(--good); }
.act-box.risk .act-item .rt { color: var(--critical); }
.act-box.warn .act-item .rt { color: var(--warning); }
.act-box.info .act-item .rt { color: var(--good); }

/* ---------- 图容器（不透明，无毛玻璃） ---------- */
.plot-box { background: var(--card-grad); border: 1px solid var(--hair); border-radius: 14px;
  padding: 14px 14px 12px; margin-top: 14px; box-shadow: var(--e1); }

/* ---------- ③ 还清过程：三个节点标在图上 + 拖动读数 ---------- */
/* 读数行：拖动曲线时显示当前落点的日期和余额（沿用 A 方案 .viz-scrub-readout 的做法，
   把精确值放在图外的一行文字里，而不是画一堆 tooltip） */
.jread { font-size: 12px; font-weight: 600; color: var(--text-muted); font-family: var(--font-num);
  margin-bottom: 6px; min-height: 17px; }
.jread .dim { color: var(--text-faint); font-weight: 500; font-family: var(--font-ui); }
.jchart { position: relative; height: 200px; touch-action: pan-y; }
.jchart .jsvg { position: absolute; left: 0; right: 0; top: 52px; bottom: 30px; width: 100%; height: calc(100% - 82px); display: block; }
.jdot { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--ch-prog);
  box-shadow: 0 0 0 3px var(--surface); transform: translate(-50%, -50%); z-index: 2; }
.jdot.done { background: var(--text-faint); }
/* 标签盒：绝对定位在节点附近，位置按节点在曲线上的位置分三种锚定方式（见 JS 注释） */
.jlab { position: absolute; z-index: 3; line-height: 1.35; white-space: nowrap; transition: opacity .12s; }
.jlab .t { font-size: 11px; font-weight: 700; }
.jlab .d { font-size: 9.5px; color: var(--text-faint); font-family: var(--font-num); }
.jlab .a { font-size: 12px; font-weight: 700; font-family: var(--font-num); margin-top: 1px; }
.jlab.now .t { color: var(--ch-prog); }
.jlab.now .a { color: var(--ch-prog); }
.jlead { position: absolute; width: 1px; background: var(--hair); z-index: 1; transition: opacity .12s; }
/* 拖动时把里程碑淡下去，只留游标——两套标签同时亮着会互相打架 */
.jchart.scrubbing .jlab, .jchart.scrubbing .jlead, .jchart.scrubbing .jdot { opacity: .18; }
.jcursor { position: absolute; top: 52px; bottom: 30px; width: 1px; background: var(--ch-prog);
  opacity: .5; transform: translateX(-50%); pointer-events: none; z-index: 4; display: none; }
.jcursor-dot { position: absolute; width: 9px; height: 9px; border-radius: 50%; background: var(--ch-prog);
  box-shadow: 0 0 0 3px var(--surface); transform: translate(-50%, -50%); pointer-events: none;
  z-index: 5; display: none; }
.jchart.scrubbing .jcursor, .jchart.scrubbing .jcursor-dot { display: block; }

/* ---------- ④ 压力：堆叠面积折线图 / 柱状图 两种模式 ---------- */
/* 模式切换器：沿用 A 方案 .viz-mode-toggle 的凹槽+浮起滑块，不发明新控件 */
.pmode { display: flex; gap: 2px; background: var(--surface-2); border-radius: 9px; padding: 2px; flex: none; }
.pmode button { background: none; border: none; padding: 3px 9px; border-radius: 7px;
  color: var(--text-muted); font-size: 11px; font-weight: 600; }
.pmode button.on { background: var(--card-grad); color: var(--text); box-shadow: var(--e1); }
.psec-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
/* ⚠️两种模式共用的画布外壳。这 18px 上边距是给"峰值"标注留的头顶空间，**两种模式
   必须都有**——上一版只给柱状加了，切到柱状时卡片整体拉长 14px，坐标轴也跟着跳
   （用户报的）。现在头顶空间挪到这个共用外壳上，两种模式的总高都是 18+104=122px，
   .agrid 的刻度线位置也只有一份，切换时卡片尺寸和坐标轴纹丝不动。

   ⚠️为什么不直接给 .achart / .pbars 加 padding：.achart 里有绝对定位的游标竖线
   (.amark) 和圆点 (.adot)，它们的 inset / bottom 百分比是相对**padding box**算的，
   一加 padding 整套坐标就偏了。所以外壳扛边距，内层绘图区保持纯净的 104px。

   ⚠️头顶空间本身不能省：外层 .ascroll 有 overflow-x:auto，而 **overflow-x 一旦不是
   visible，overflow-y 也会被浏览器强制成非 visible**，伸到容器外的标注会被整个裁掉。 */
.pcanvas { padding-top: 18px; }
/* 柱状模式（B 第一版那套，保留下来做对比） */
.pbars { display: flex; align-items: flex-end; gap: 2px; height: 104px; }
.pcol { flex: 1; min-width: 0; height: 100%; display: flex; align-items: flex-end;
  background: none; border: none; padding: 0; position: relative; }
.pstack { width: 100%; max-width: 22px; margin: 0 auto; height: 100%; display: flex; flex-direction: column-reverse; gap: 2px; }
.pstack .seg { width: 100%; }
.pstack .seg.p { background: var(--ch-mag); }
.pstack .seg.i { background: var(--ch-cost); border-radius: 3px 3px 0 0; }
.pstack .seg.i.zero { display: none; }
.pstack .seg.i.zero ~ .seg.p { border-radius: 3px 3px 0 0; }
.pcol.peak::after { content: "峰值"; position: absolute; left: 50%; top: -14px; transform: translateX(-50%);
  font-size: 9px; font-weight: 700; color: var(--critical); white-space: nowrap; }
.pcol.dimmed .pstack { opacity: .42; }
.pcol.active .pstack { filter: brightness(1.14); }
.awrap { position: relative; padding-left: 32px; margin-top: 4px; }
/* top 跟 .pcanvas 的 padding-top 是同一个数，改一个必须改另一个，否则刻度线跟绘图区错位 */
.agrid { position: absolute; left: 32px; right: 0; top: 18px; height: 104px; pointer-events: none; z-index: 1; }
.gridline { position: absolute; left: 0; right: 0; border-top: 1px solid var(--hair); }
.gridline span { position: absolute; right: 100%; top: -6px; padding-right: 5px; font-size: 9.5px;
  color: var(--text-faint); font-family: var(--font-num); }
.ascroll { overflow-x: auto; scrollbar-width: none; }
.ascroll::-webkit-scrollbar { display: none; }
.atrack { width: 100%; }
.achart { position: relative; height: 104px; }
.achart svg { width: 100%; height: 100%; display: block; }
/* 命中区：透明按钮铺满每个月的列宽，点它切换选中月。
   ⚠️必须跟 SVG 的采样点对齐——SVG 的 viewBox 宽度设成"月份数"、第 i 个点画在
   x = i+0.5，正好落在这些 flex 等分格子的中心，两者才不会错位。 */
.ahit { position: absolute; inset: 0; display: flex; z-index: 3; }
.ahit button { flex: 1; min-width: 0; background: none; border: none; padding: 0; height: 100%; }
.amark { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--text-faint);
  opacity: .45; transform: translateX(-50%); pointer-events: none; z-index: 2; }
.adot { position: absolute; width: 7px; height: 7px; border-radius: 50%;
  transform: translate(-50%, 50%); pointer-events: none; z-index: 2; box-shadow: 0 0 0 2px var(--surface); }
.adot.total { background: var(--ch-cost); }
.adot.prin { background: var(--ch-mag); }
/* 面积模式的"峰值"标注。柱状那个靠 .pcol.peak::after 挂在"那根柱子"这个元素上，
   面积图没有对应的 DOM（只有两条连续 path），所以按峰值点的坐标单独定位一个标记：
   x = (peakIdx+0.5)/n（跟 SVG 采样点和 .ahit 格子中心同一套坐标），
   y = 曲线顶点，再用 margin-bottom 抬到点的上方，下面接一个朝下的小三角指回顶点。
   面积图比柱状图更需要这个标注——连续曲线会把局部起伏平滑掉，肉眼挑不出最高点。 */
.apeak { position: absolute; transform: translateX(-50%); margin-bottom: 6px;
  font-size: 9px; font-weight: 700; color: var(--critical); white-space: nowrap;
  pointer-events: none; z-index: 2; line-height: 1.2; }
.apeak::after { content: ""; position: absolute; left: 50%; bottom: -5px; transform: translateX(-50%);
  width: 0; height: 0; border-left: 3.5px solid transparent; border-right: 3.5px solid transparent;
  border-top: 4px solid var(--critical); }
/* 选中的正好是峰值月时，把标注让位给读数竖线+圆点，避免三样东西叠在一起 */
.apeak.dim { opacity: .3; }
.axaxis { display: flex; margin-top: 5px; }
.axtick { flex: 1; min-width: 0; text-align: center; font-size: 9.5px; color: var(--text-faint); }
.axtick.on { color: var(--text); font-weight: 700; }
.legend-inline { display: flex; gap: 14px; margin-top: 10px; font-size: 11px; color: var(--text-muted); }
.legend-inline span { display: flex; align-items: center; gap: 5px; }
.legend-inline i { width: 8px; height: 8px; border-radius: 2px; }
.abd { margin-top: 12px; border-top: 1px solid var(--hair); padding-top: 10px; }
.abd-l { font-size: 11px; color: var(--text-muted); margin: 0 2px 6px; }
.abd-r { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; padding: 3px 2px; }
.abd-r .num { font-weight: 600; }

/* ---------- ⑤ 排行 ---------- */
.rank-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--hair); }
.rank-row:last-child { border-bottom: none; }
.rank-no { width: 17px; font-size: 12px; font-weight: 700; color: var(--text-faint); font-family: var(--font-num); flex: none; }
.rank-main { flex: 1; min-width: 0; }
.rank-nm { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.rank-tag { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 999px; }
.rank-tag.hi { background: var(--critical-soft); color: var(--critical); }
.rank-bar { height: 5px; border-radius: 999px; background: var(--surface-2); margin-top: 6px; overflow: hidden; }
.rank-bar i { display: block; height: 100%; border-radius: 999px; }
.rank-amt { text-align: right; flex: none; }
.rank-amt .a { font-size: 13px; font-weight: 700; font-family: var(--font-num); }
.rank-amt .r { font-size: 10.5px; color: var(--text-muted); font-family: var(--font-num); margin-top: 2px; }
.rank-cut { font-size: 11px; color: var(--text-faint); padding: 8px 0 0; }
/* ⚠️用 --accent 不用 --calm。--calm(#2F639C) 在这一页是**数据色**（排行条里"非高息
   债务"就是它），同一个颜色既当数据编码又当交互控件色，会让人以为这个按钮跟"蓝色
   那批债务"有关。全 App 的"展开更多"只有一种视觉语言，跟 .note-toggle（"计算口径
   说明"，用 --accent）统一。 */
.more-btn { background: none; border: none; color: var(--accent); font-size: 12px; font-weight: 600;
  padding: 10px 0 0; display: flex; align-items: center; gap: 4px; }
.more-btn svg { width: 12px; height: 12px; transition: transform .15s; }
.more-btn.open svg { transform: rotate(180deg); }

/* ---------- ⑥ 可旋转饼图（甜甜圈） ----------
   ⚠️第二版把饼做大了：原来标签是"沿半径方向直着往外放"，扇区转到正左/正右时标签
   起点被推到离中心 r+18 处，右边只剩 60 多 px，"信用卡分期 27% ¥16,208"根本放不下，
   于是只能把 r 压到 62（饼看着很小）。
   改成**折线引线**（斜出一小段 → 再水平拉到容器边缘），标签固定贴左/右边缘，
   水平空间就跟扇区角度无关了，饼可以放大到 r=86。同一侧多个标签按 y 排序做避让。
   所有几何都在 mountPie() 里按容器实测宽度算，不写死 viewBox 坐标。 */
.pie-wrap { position: relative; height: 262px; touch-action: none; user-select: none; }
.pie-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
/* ⚠️SVG 的 fill / stroke **不接受 CSS 渐变值**。这两处原来写的是 var(--card-grad)
   （一个 linear-gradient(...)），浏览器解析不了就回退到默认黑色——浅色模式下
   甜甜圈中心孔和扇区之间的描边全是黑的（截图里一眼能看到）。
   必须给纯色：--surface 跟饼图所在的 .plot-box 卡片底色几乎一致
   （浅 #FFFFFF vs 卡片中部约 #FCFCFE，深 #24282F vs 约 #262B33），2px 描边看不出差别。 */
.pie-slice { stroke: var(--surface); stroke-width: 2; }
.pie-hub { fill: var(--surface); }
/* 引线不能用 --hair（深色下是 rgba(255,255,255,.07)，1px 线在卡片底上等于隐形）。
   用 --border，两套主题下都能看清但不抢戏。 */
.pie-lead { fill: none; stroke: var(--border); stroke-width: 1; }
.pie-lab { position: absolute; pointer-events: none; line-height: 1.32; white-space: nowrap; }
.pie-lab .n { font-size: 11.5px; font-weight: 700; display: flex; align-items: center; gap: 5px; }
.pie-lab.r .n { flex-direction: row-reverse; }     /* 贴右边缘时色块放在文字右侧 */
.pie-lab .n i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
/* ⚠️第二行的字号和分隔符是**算过宽度**才定的，不是随手写的。
   饼半径能做多大，卡在这一条：r + gap + 标签最宽宽度 ≤ 容器宽 / 2。
   容器 326px（390 − app padding 18×2 − plot-box padding 14×2）→ 半边 163px。
   第二行原来是 "27% · ¥16,208"，11px 等宽字体 13 个字符 ≈ 86px，
   r 就只能给到 163−12−86 = 65；去掉 " · " 分隔符并降到 10.5px 后 11 字符 ≈ 69px，
   r 能给到 84。取 80 留 4px 余量。 */
.pie-lab .v { font-size: 10.5px; color: var(--text-muted); font-family: var(--font-num); margin-top: 1px; }
.pie-hint { font-size: 10.5px; color: var(--text-faint); text-align: center; margin-top: 2px; }
/* 中心文字要塞进甜甜圈的孔里：孔半径 = r × 0.58 ≈ 50px，直径 100px，比上一版宽敞，
   所以字号可以从 13px 回到 16px。 */
.pie-center { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); text-align: center; pointer-events: none; }
.pie-center .k { font-size: 9.5px; color: var(--text-faint); line-height: 1.2; }
.pie-center .v { font-size: 16px; font-weight: 700; font-family: var(--font-num); letter-spacing: -.02em; line-height: 1.3; }

/* ---------- 结语 ---------- */
.outro { background: var(--surface-2); border-radius: 14px; padding: 15px 16px; margin-top: 20px; }
.outro-t { font-size: 13px; font-weight: 700; }
.outro-b { font-size: 12.5px; line-height: 1.75; color: var(--text-muted); margin-top: 6px; }
.outro-b b { color: var(--text); font-family: var(--font-num); font-weight: 700; }
.outro-act { display: flex; gap: 8px; margin-top: 13px; }
.outro-act button { flex: 1; border: none; border-radius: 10px; padding: 10px; font-size: 12.5px; font-weight: 600; }
.outro-act .primary { background: var(--accent-fill); color: var(--on-accent); }
.outro-act .ghost { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
.foot { font-size: 11px; color: var(--text-faint); line-height: 1.6; margin-top: 16px; }
</style>
</head>
<body>
<div class="phone">
  <div class="app viz-root" id="app"></div>
  <div id="tabbar"></div>
</div>
<div id="themeBtn"></div>

<script src="shared/data.js"></script>
<script src="shared/util.js"></script>
<script>
initTheme();
document.getElementById("themeBtn").outerHTML = THEME_BTN_HTML;
document.getElementById("tabbar").outerHTML = TABBAR_HTML;

var D = window.AZ_DATA;
var HI = 18;                 // 高息阈值，跟 calc.js 的 rateClass() 同一条线
var RANK_COVER = 0.70;       // ⑤ 排行截断：累计占比达这个比例为止
// pMode：压力图用哪种图形。**刻意不持久化**——重开 App 回到默认的堆叠面积图。
var state = { pIdx: -1, showAll: false, pieRot: 0, pMode: "area" };

/* 明细列表里的金额一律取整到元再格式化。
   共享的 fmt() 沿用 App 的行为（≥1000 取整、<1000 保留两位小数），headline 数字
   继续用它保持一致；但一列并排的明细里混着 "¥1,089" 和 "¥666.16" 很难扫，
   而且分位在这个场景没有信息量。 */
function yuan(n) { return "¥" + fmt(Math.round(+n || 0)); }

/* ===========================================================================
   ② 结论规则引擎
   ---------------------------------------------------------------------------
   四条候选结论，每条自带：
     · 触发条件——不成立就整条不出现（不是"显示 0 笔"那种空壳）
     · severity 0–100——决定排序，公式写在各自旁边，不是拍脑袋的固定优先级
     · actionable——只有可行动的结论才有资格当"最该先动手的地方"
     · detail()——被选为"最该先动手"时展开什么内容
   "三件值得注意的事" = 按 severity 取前 3（不限 actionable）
   "最该先动手的地方" = actionable 里 severity 最高的那条
   =========================================================================== */
function buildFindings() {
  var r = D.report, p = D.pressure, c = D.conclusions;
  var total = r.totalBalance, totalInt = c.restInterest;
  var out = [];

  /* ① 利息集中度：钱到底花在哪一笔上。
     ⚠️这条是这轮新加的，而且在当前数据下它才是真相——原来那句"N 笔网贷吃掉了大部分
     利息"是错的：网贷占余额 12.0%、占剩余待付利息 12.9%，几乎等比例。真正吃利息的是
     test11（银行贷，年化才 5.79%）一笔占 41%，因为它金额大、期限长。
     **高利率 ≠ 高剩余利息**，这两件事必须分开算、分开说。
     触发：单笔占剩余待付利息 ≥30%。severity = 该占比×100。 */
  var byInt = D.byDebt.slice().sort(function (a, b) { return b.remainingInterest - a.remainingInterest; });
  var ti = byInt[0];
  var tiShare = totalInt > 0 ? ti.remainingInterest / totalInt : 0;
  if (tiShare >= 0.30) {
    out.push({
      id: "concentration", severity: Math.round(tiShare * 100), actionable: true, tone: "warn",
      icon: iconCoin(),
      title: ti.name + " 一笔占了剩余待付利息的 " + Math.round(tiShare * 100) + "%",
      body: "它只占总余额的 <b>" + Math.round((ti.balance / total) * 100) + "%</b>（¥" + fmt(ti.balance) +
            "），但期限还有 <b>" + ti.terms + "</b> 期，剩下要为它付 <b>¥" + fmt(ti.remainingInterest) + "</b> 利息。",
      actionTitle: "利息主要花在 " + ti.name + " 上",
      detail: function () {
        var rows = byInt.slice(0, 4).filter(function (x) { return x.remainingInterest > 0; });
        var mx = rows[0].remainingInterest || 1;
        return {
          top: "剩余待付利息合计 ¥" + fmt(totalInt),
          body: "它的年化是 <b>" + ti.rate.toFixed(2) + "%</b>，在这 " + D.byDebt.length +
                " 笔里并不算高——贵在<b>金额大、期限长</b>。提前还它省下的是时间堆出来的利息，" +
                "跟先还高息那几笔是两种不同的省法。",
          items: rows.map(function (x) {
            return { nm: x.name, pct: x.remainingInterest / mx, rt: yuan(x.remainingInterest) };
          })
        };
      }
    });
  }

  /* ② 高息债务：只陈述事实（几笔、占余额多少、利率区间），不再断言"吃掉大部分利息"
     ——那个断言得由 ① 去验证。触发：存在年化 ≥18% 的债务。
     severity = 余额占比×100 + (最高年化 − 18)×2，两个维度都要计：
     笔数再多但金额很小、或者利率刚过线，都不该排到最前面。 */
  var hi = D.byDebt.filter(function (d) { return d.rate >= HI; }).sort(function (a, b) { return b.rate - a.rate; });
  if (hi.length) {
    var hiBal = hi.reduce(function (t, d) { return t + d.balance; }, 0);
    var hiInt = hi.reduce(function (t, d) { return t + d.remainingInterest; }, 0);
    var hiShare = hiBal / total;
    // 类型名也是**算出来**的，不是写死的"网贷"——这批债务恰好同类型时才提类型名
    var types = hi.map(function (d) { return d.type; }).filter(function (v, i, a) { return a.indexOf(v) === i; });
    var typeWord = types.length === 1 ? types[0] : "债务";
    out.push({
      id: "highrate",
      severity: Math.round(hiShare * 100 + (hi[0].rate - HI) * 2),
      actionable: true, tone: "risk", icon: iconAlert(),
      title: hi.length + " 笔" + typeWord + "年化超过 " + HI + "%",
      body: "利率 <b>" + hi[hi.length - 1].rate.toFixed(2) + "%</b> 到 <b>" + hi[0].rate.toFixed(2) +
            "%</b>，占总余额 <b>" + Math.round(hiShare * 100) + "%</b>（¥" + fmt(hiBal) + "）、" +
            "占剩余待付利息 <b>" + Math.round((hiInt / Math.max(1, totalInt)) * 100) + "%</b>。",
      actionTitle: "先还掉年化 ≥" + HI + "% 的那 " + hi.length + " 笔",
      detail: function () {
        var lowest = D.byDebt.slice().sort(function (a, b) { return a.rate - b.rate; })[0];
        return {
          top: "高息债务 " + hi.length + " 笔 · 共 ¥" + fmt(hiBal),
          body: "同样一块钱，放在 <b>" + hi[0].rate.toFixed(2) + "%</b> 的 " + hi[0].name +
                " 上省下的利息，是放在利率最低的 " + lowest.name + "（<b>" + lowest.rate.toFixed(2) +
                "%</b>）上的 <b>" + (hi[0].rate / Math.max(0.01, lowest.rate)).toFixed(1) + "</b> 倍。",
          items: hi.map(function (d) {
            return { nm: d.name, pct: d.rate / hi[0].rate, rt: d.rate.toFixed(2) + "%" };
          })
        };
      }
    });
  }

  /* ③ 还款峰值月：触发 峰值 ÷ 月均 ≥ 1.5。
     severity = (倍数 − 1) × 60，封顶 100。倍数越高，那个月越可能真的还不上。 */
  if (p.peak && p.monthlyAvg > 0) {
    var ratio = p.peak.total / p.monthlyAvg;
    if (ratio >= 1.5) {
      out.push({
        id: "peak", severity: Math.min(100, Math.round((ratio - 1) * 60)),
        actionable: true, tone: "warn", icon: iconPeak(),
        title: monthLabel(p.peak.month) + "是最难的一个月",
        body: "那个月要还 <b>¥" + fmt(p.peak.total) + "</b>，是月均 <b>¥" + fmt(p.monthlyAvg) +
              "</b> 的 <b>" + ratio.toFixed(1) + "</b> 倍。",
        actionTitle: "先为 " + monthLabel(p.peak.month) + " 备好 ¥" + fmt(p.peak.total),
        detail: function () {
          var pm = p.months.filter(function (m) { return m.month === p.peak.month; })[0];
          var mx = pm.items.length ? pm.items[0].amount : 1;
          // ⚠️只列前 SHOW 笔，但**文案必须说清楚只列了几笔**、剩下的合计多少。
          // 原来写的是"一共有 11 笔债务同时到期："后面跟 6 行，冒号暗示"就这些"，
          // 另外 5 笔和它们的 ¥1,672 凭空消失了——这是在骗读者，不是省略。
          var SHOW = 6;
          var restN = Math.max(0, pm.items.length - SHOW);
          var restSum = pm.items.slice(SHOW).reduce(function (t, it) { return t + it.amount; }, 0);
          return {
            top: monthLabel(p.peak.month) + " 要还 ¥" + fmt(pm.total),
            body: "比月均多 <b>¥" + fmt(pm.total - p.monthlyAvg) + "</b>。这个月一共有 <b>" +
                  pm.items.length + "</b> 笔债务同时到期" +
                  (restN ? "，金额最大的 <b>" + SHOW + "</b> 笔是：" : "："),
            rest: restN ? "其余 " + restN + " 笔 · " + yuan(restSum) : "",
            items: pm.items.slice(0, SHOW).map(function (it) {
              return { nm: it.name, pct: it.amount / mx, rt: yuan(it.amount) };
            })
          };
        }
      });
    }
  }

  /* ④ 利息负担总量：剩余待付利息 ÷ 剩余本金，分三档给判断。
     这条**只陈述、不可行动**（actionable:false），不会被选成"最该先动手"。
     severity：轻 10 / 中 45 / 重 80。 */
  var burden = total > 0 ? totalInt / total : 0;
  var tier = burden > 0.25 ? { s: 80, tone: "risk", w: "偏重" }
           : burden > 0.10 ? { s: 45, tone: "warn", w: "中等" }
                           : { s: 10, tone: "good", w: "很轻" };
  out.push({
    id: "burden", severity: tier.s, actionable: false, tone: tier.tone, icon: iconCheck(),
    title: "整体利息负担" + tier.w,
    body: "剩下还要付 <b>¥" + fmt(totalInt) + "</b> 利息，相当于剩余本金 <b>¥" + fmt(total) +
          "</b> 的 <b>" + Math.round(burden * 100) + "%</b>。加权年化 <b>" + r.avgRate.toFixed(2) + "%</b>。"
  });

  out.sort(function (a, b) { return b.severity - a.severity; });
  return out;
}

function render() {
  var s = D.summary, r = D.report, p = D.pressure, c = D.conclusions;
  var findings = buildFindings();
  var top3 = findings.slice(0, 3);
  var actionable = findings.filter(function (f) { return f.actionable; });
  var lead = actionable[0] || null;
  // 柱状模式要标"峰值"那根，面积模式用不到但算一次不亏
  var peakIdx = p.peak ? p.months.findIndex(function (m) { return m.month === p.peak.month; }) : -1;

  /* ⑤ 排行截断：从大到小累加，累计占比达 RANK_COVER 就停 */
  var cum = 0, cut = 0;
  for (var i = 0; i < D.byDebt.length; i++) {
    cum += D.byDebt[i].balance; cut = i + 1;
    if (cum / r.totalBalance >= RANK_COVER) break;
  }
  var shown = D.byDebt.slice(0, cut), rest = D.byDebt.slice(cut);
  var restSum = rest.reduce(function (t, d) { return t + d.balance; }, 0);
  var cutShare = Math.round((cum / r.totalBalance) * 100);

  document.getElementById("app").innerHTML =
    '<div class="rpt-head">' +
      '<div class="rpt-kicker">债务体检 · ' + r.timeline[0].date + "</div>" +
      '<h1 class="rpt-title">你的负债正在<em>稳定下降</em></h1>' +
      '<p class="rpt-lede">目前还欠 <b>¥' + fmt(r.totalBalance) + "</b>，分布在 <b>" + s.active +
        "</b> 笔债务里。已经还掉本金 <b>¥" + fmt(s.paidPrincipal) + "</b>，走完了全程的 <b>" + s.pct +
        "%</b>。按现在的还款计划，<b>" + c.monthsLeft + "</b> 个月后（" + r.payoffDate + "）这个数字会归零。</p>" +
    "</div>" +

    /* ② 三件值得注意的事——规则算出来的，条数不足 3 条时就少显示几条 */
    '<div class="sec">' +
      '<div class="sec-q">这段时间发生了什么</div>' +
      '<h2 class="sec-a">' + (top3.length === 1 ? "一件" : top3.length === 2 ? "两件" : "三件") + "值得注意的事</h2>" +
      '<div style="margin-top:12px">' + top3.map(findingHtml).join("") + "</div>" +
    "</div>" +

    /* ② 最该先动手 = actionable 里 severity 最高的那条展开 */
    (lead ? actionHtml(lead) : "") +

    /* ③ 还清过程 */
    '<div class="sec">' +
      '<div class="sec-q">还清这件事进行到哪了</div>' +
      '<h2 class="sec-a">已经走完 <span class="n">' + s.pct + "</span>%，还剩 <span class=\"n\">" + c.monthsLeft + "</span> 个月</h2>" +
      journeyHtml(r, s) +
    "</div>" +

    /* ④ 压力：堆叠面积 / 柱状 两种模式 */
    '<div class="sec">' +
      '<div class="psec-head"><div style="min-width:0">' +
        '<div class="sec-q">接下来哪个月最难</div>' +
        '<h2 class="sec-a">' + monthLabel(p.peak.month) + '要还 <span class="n">¥' + fmt(p.peak.total) + "</span></h2>" +
      "</div>" +
      '<div class="pmode">' +
        '<button type="button" class="' + (state.pMode === "area" ? "on" : "") + '" data-act="pmode" data-m="area">面积</button>' +
        '<button type="button" class="' + (state.pMode === "bar" ? "on" : "") + '" data-act="pmode" data-m="bar">柱状</button>' +
      "</div></div>" +
      '<div class="sec-note">未来 <b>' + p.windowMonths + "</b> 个月一共要还 <b>¥" + fmt(p.totalAhead) +
        "</b>，平均每月 <b>¥" + fmt(p.monthlyAvg) + "</b>。" +
        (p.overdue.count > 0 ? "另有 <b>" + p.overdue.count + "</b> 期已逾期（¥" + fmt(p.overdue.amount) + "），未计入下方。" : "目前没有逾期期次。") +
      "</div>" + pressureHtml(p, peakIdx) +
    "</div>" +

    /* ⑤ 排行：累计占比达 70% 为止 */
    '<div class="sec">' +
      '<div class="sec-q">钱主要压在哪几笔</div>' +
      '<h2 class="sec-a">前 <span class="n">' + cut + '</span> 笔占了 <span class="n">' + cutShare + "</span>%</h2>" +
      '<div style="margin-top:10px">' +
        shown.map(function (d, i) { return rankRow(d, i, D.byDebt[0].balance); }).join("") +
        (state.showAll ? rest.map(function (d, i) { return rankRow(d, i + cut, D.byDebt[0].balance); }).join("") : "") +
        (rest.length ? '<button class="more-btn' + (state.showAll ? " open" : "") + '" type="button" data-act="more">' +
          (state.showAll ? "收起" : "其余 " + rest.length + " 笔 · ¥" + fmt(restSum)) +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>' : "") +
      "</div>" +
    "</div>" +

    /* ⑥ 可旋转饼图 */
    '<div class="sec">' +
      '<div class="sec-q">这些债务是什么类型</div>' +
      '<h2 class="sec-a">' + r.typeList[0].name + '占了 <span class="n">' +
        Math.round((r.typeList[0].value / r.totalBalance) * 100) + "</span>%</h2>" +
      pieHtml(r) +
      '<div class="pie-hint">按住饼图可以转动</div>' +
    "</div>" +

    '<div class="outro">' +
      '<div class="outro-t">如果只做一件事</div>' +
      '<div class="outro-b">' + (lead ? lead.actionTitle + "。" : "保持现在的还款节奏。") +
        (lead && lead.id === "highrate" ? "把每个月多出来的钱优先砸向 <b>" +
          D.byDebt.filter(function (d) { return d.rate >= HI; }).sort(function (a, b) { return b.rate - a.rate; })[0].name +
          "</b>。" : "") + "</div>" +
      '<div class="outro-act"><button class="primary" type="button">导出这份报告</button>' +
        '<button class="ghost" type="button">提前还款测算</button></div>' +
    "</div>" +
    '<div class="foot">利率由每笔债务的还款计划反推（IRR）。走势与压力均按现有还款计划推算，<b>是预测不是承诺</b>，不含提前还款；本 App 不保存历史余额，走势线不是实际走过的轨迹。</div>';

  mountPie();
  mountJourney();
}

function findingHtml(f) {
  return '<div class="finding"><div class="finding-ic ' + f.tone + '">' + f.icon + "</div>" +
    '<div><div class="finding-t">' + f.title + '</div><div class="finding-s">' + f.body + "</div></div></div>";
}

function actionHtml(f) {
  var d = f.detail();
  return '<div class="sec">' +
    '<div class="sec-q">最该先动手的地方</div>' +
    '<h2 class="sec-a">' + f.actionTitle + "</h2>" +
    '<div class="act-box ' + f.tone + '">' +
      '<div class="act-top">' + f.icon + d.top + "</div>" +
      '<div class="act-body">' + d.body + "</div>" +
      '<div class="act-list">' + d.items.map(function (x) {
        return '<div class="act-item"><span class="nm">' + x.nm + '</span>' +
          '<span class="track"><span class="fill" style="width:' + Math.max(3, x.pct * 100) + '%"></span></span>' +
          '<span class="rt">' + x.rt + "</span></div>";
      }).join("") + "</div>" +
      (d.rest ? '<div class="act-rest">' + d.rest + "</div>" : "") +
    "</div></div>";
}

function iconAlert() { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v6"/><path d="M12 16.5v.01"/></svg>'; }
function iconPeak()  { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18l6-8 4 5 3-4 5 7z"/></svg>'; }
function iconCheck() { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'; }
function iconCoin()  { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v9"/><path d="M14.6 9.6c-.6-.7-1.6-1.1-2.6-1.1-1.5 0-2.6.8-2.6 1.9 0 2.6 5.2 1.3 5.2 3.9 0 1.1-1.1 1.9-2.6 1.9-1.1 0-2.1-.4-2.7-1.2"/></svg>'; }

/* ===========================================================================
   ③ 还清过程：名称 / 时间 / 金额三行标签直接标在图上
   ---------------------------------------------------------------------------
   原来是图下面一排 flex 文字，视觉上像图例（用户反馈）。

   ⚠️三个标签的锚定方式是**按纵向错开**排的，不是按"哪边空就放哪边"排的。
   第一版按后者做（起点放下方、中点放上方），结果起点和中点的标签 top 只差 7px，
   横向又只隔 30%，读起来像连成一行的一句话（截图里看得很清楚）。
   现在改成：起点在最上、中点在中下、终点在中上，三者 top 至少差 60px：
     · 起点(曲线最高点) → 标签在点**上方**、贴容器左边缘
     · 中点(还掉一半)   → 标签在点**下方**（落在填充区里，填充很淡不影响读）
     · 终点(归零)       → 标签在点**上方**、右对齐
   每个标签配一条 1px 引线连到点上，免得"这个标签是标谁的"要靠猜。

   ⚠️坐标轴**刻意不画**（这是个判断，不是漏了）：这张图在 B 里的角色是叙事的证据，
   三个里程碑已经把"起点多少、中点什么时候、终点归零"三个锚点都写在图上了，
   再画一套 Y 轴刻度和 X 轴时间刻度，等于同一份信息在同一张图里写两遍，
   而且刻度数字会跟里程碑标签抢位置。精确值改由**拖动读数**承担：
   按住曲线横向拖，图上方那行显示落点的日期和余额，这是 A 方案 PayoffLine 已经
   验证过的那套 scrub 交互，直接复用。
   =========================================================================== */
function journeyHtml(r, s) {
  var tl = r.timeline, W = 320, H = 100;
  var top = niceCeil(tl[0].balance) || 1;
  var co = timelineCoords(tl, W, H, top);
  var halfIdx = tl.findIndex(function (p) { return p.balance <= tl[0].balance / 2; });
  if (halfIdx < 0) halfIdx = Math.floor(tl.length / 2);

  // svg 在容器里的位置：top 52px / bottom 30px（给上下标签留地方）
  var PAD_T = 52, PAD_B = 30, CH = 200;
  function px(i) { return (co[i][0] / W) * 100; }                       // 百分比（横向）
  function py(i) { return PAD_T + (co[i][1] / H) * (CH - PAD_T - PAD_B); } // 绝对像素（纵向）

  var nodes = [
    { i: 0,             t: "今天",     cls: "now", anchor: "above-left" },
    { i: halfIdx,       t: "还掉一半", cls: "",    anchor: "below" },
    { i: tl.length - 1, t: "归零",     cls: "",    anchor: "above-right" }
  ];

  var marks = nodes.map(function (nd) {
    var x = px(nd.i), y = py(nd.i), p = tl[nd.i];
    var lab, lead;
    if (nd.anchor === "above-left") {
      lab = 'style="left:0;top:' + (y - 50) + 'px;text-align:left"';
      lead = 'style="left:' + x + '%;top:' + (y - 12) + "px;height:12px\"";
    } else if (nd.anchor === "below") {
      lab = 'style="left:' + x + '%;top:' + (y + 16) + 'px;transform:translateX(-50%);text-align:center"';
      lead = 'style="left:' + x + '%;top:' + y + "px;height:16px\"";
    } else {
      lab = 'style="right:0;top:' + (y - 50) + 'px;text-align:right"';
      lead = 'style="left:' + x + '%;top:' + (y - 12) + "px;height:12px\"";
    }
    return '<span class="jlead" ' + lead + "></span>" +
      '<span class="jdot ' + nd.cls + '" style="left:' + x + "%;top:" + y + 'px"></span>' +
      '<span class="jlab ' + nd.cls + '" ' + lab + '>' +
        '<span class="t">' + nd.t + '</span><span class="d"> ' + p.date.slice(0, 7) + "</span>" +
        '<div class="a">¥' + fmt(p.balance) + "</div></span>";
  }).join("");

  // 给 scrub 用的采样点（容器坐标：x 百分比 / y 像素），挂到全局供 mountJourney 读
  JOURNEY = { pts: tl.map(function (p, i) { return { x: px(i), y: py(i), date: p.date, bal: p.balance }; }) };

  return '<div class="plot-box">' +
    '<div class="jread" id="jRead"><span class="dim">按住曲线左右拖，看任意时间点的余额</span></div>' +
    '<div class="jchart" id="jChart">' +
    '<svg class="jsvg" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none">' +
      '<defs><linearGradient id="jg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="' + H + '">' +
        '<stop offset="0%" stop-color="var(--ch-prog)" stop-opacity="0.26"/>' +
        '<stop offset="100%" stop-color="var(--ch-prog)" stop-opacity="0.02"/></linearGradient></defs>' +
      '<path d="' + areaPath(co, H) + '" fill="url(#jg)"/>' +
      '<path d="' + linePath(co) + '" fill="none" stroke="var(--ch-prog)" stroke-width="2.4" vector-effect="non-scaling-stroke"/>' +
    "</svg>" + marks +
    '<span class="jcursor" id="jCur"></span><span class="jcursor-dot" id="jCurDot"></span>' +
    "</div></div>";
}

var JOURNEY = { pts: [] };

/* 走势图的拖动读数。
   ⚠️触摸必须走 Touch Events + {passive:false}——只有 touchmove 里的 preventDefault
   能逐次否决原生滚动；这是这个项目在长按拖拽排序上反复踩过的坑，规则一样适用。
   .jchart 的 touch-action 保持 pan-y：手指纵向滑动时让页面正常滚，横向超过阈值
   才判定成 scrub 并接管。 */
function mountJourney() {
  var el = document.getElementById("jChart");
  if (!el || !JOURNEY.pts.length) return;
  var read = document.getElementById("jRead");
  var cur = document.getElementById("jCur"), dot = document.getElementById("jCurDot");
  var pts = JOURNEY.pts;

  function pick(clientX) {
    var b = el.getBoundingClientRect();
    var xPct = ((clientX - b.left) / b.width) * 100;
    var best = 0, bd = Infinity;
    for (var i = 0; i < pts.length; i++) {
      var d = Math.abs(pts[i].x - xPct);
      if (d < bd) { bd = d; best = i; }
    }
    var p = pts[best];
    cur.style.left = p.x + "%";
    dot.style.left = p.x + "%";
    dot.style.top = p.y + "px";
    read.innerHTML = p.date + " <span class=\"dim\">余额</span> ¥" + fmt(p.bal);
  }
  function on() { el.classList.add("scrubbing"); }
  function off() {
    el.classList.remove("scrubbing");
    read.innerHTML = '<span class="dim">按住曲线左右拖，看任意时间点的余额</span>';
  }

  // 触摸：先看方向，横向为主才接管
  var t0 = null, decided = null;
  el.addEventListener("touchstart", function (e) {
    t0 = { x: e.touches[0].clientX, y: e.touches[0].clientY }; decided = null;
  }, { passive: true });
  el.addEventListener("touchmove", function (e) {
    if (!t0) return;
    var dx = e.touches[0].clientX - t0.x, dy = e.touches[0].clientY - t0.y;
    if (decided === null) {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      decided = Math.abs(dx) > Math.abs(dy) ? "scrub" : "scroll";
      if (decided === "scrub") on();
    }
    if (decided !== "scrub") return;
    e.preventDefault();
    pick(e.touches[0].clientX);
  }, { passive: false });
  function tend() { t0 = null; if (decided === "scrub") off(); decided = null; }
  el.addEventListener("touchend", tend);
  el.addEventListener("touchcancel", tend);

  // 鼠标：按下即接管（桌面没有"要不要让给滚动"这个冲突）
  var down = false;
  el.addEventListener("pointerdown", function (e) {
    if (e.pointerType !== "mouse") return;
    down = true; on(); pick(e.clientX); el.setPointerCapture(e.pointerId);
  });
  el.addEventListener("pointermove", function (e) { if (down && e.pointerType === "mouse") pick(e.clientX); });
  el.addEventListener("pointerup", function (e) { if (e.pointerType === "mouse") { down = false; off(); } });
  el.addEventListener("pointerleave", function () { if (down) { down = false; off(); } });
}

/* ===========================================================================
   ④ 压力图：堆叠面积 / 柱状 两种模式，右上角切换，默认面积
   ---------------------------------------------------------------------------
   两种模式共享同一套骨架（滚动容器 / 命中区 / x 轴 / Y 轴刻度 / 当月明细），
   只有"图形本身"那一块不同，所以下面拆成 pressureHtml(外壳) + areaBody / barBody。
   · 模式存在 state.pMode，**不持久化**——重开 App 回到默认的面积图（用户要求）。
   · 滑动：n 个月 × 26px 的 min-width，装不下就横向滚动，两种模式一致。
   · 点击某个月 → 下面列出那个月要还的债务；**再点一次关闭**（pIdx 置 -1）。
   面积模式的几何：
   · viewBox 宽度 = 月份数 n，第 i 个采样点画在 x = i + 0.5 —— 正好落在
     .ahit / .axaxis 那两排 flex 等分格子的中心，滑动时三者永远对齐。
   · 两条面积：本金从基线堆到 principal，利息从 principal 堆到 total。
     交界处各画一条实线，两个色（蓝 #2B6CB8 / 琥珀 #C4892F）的 CVD 分离度是
     protan ΔE 25.5，堆叠面积没法留 2px 间隙，靠色相差 + 边界线来分。
   · 圆点用 HTML 画不用 SVG <circle>：preserveAspectRatio="none" 会把圆拉成椭圆。
   =========================================================================== */
var P_H = 104, P_COL = 26;

function pressureHtml(p, peakIdx) {
  var ms = p.months, n = ms.length;
  var top = niceCeil(Math.max.apply(null, ms.map(function (m) { return m.total; }))) || 1;
  var idx = state.pIdx >= 0 ? Math.min(state.pIdx, n - 1) : -1;
  var act = idx >= 0 ? ms[idx] : null;
  // 两种模式都套同一个 .pcanvas 外壳（18px 头顶空间给"峰值"标注），
  // 切换时卡片总高和刻度线位置完全不变
  var body = '<div class="pcanvas">' +
    (state.pMode === "bar" ? barBody(ms, n, top, idx, peakIdx) : areaBody(ms, n, top, idx, act, peakIdx)) +
    "</div>";

  return '<div class="plot-box">' +
    (act ? '<div style="font-size:12px;font-weight:700;margin-bottom:8px" class="num">' + monthLabel(act.month) + " ¥" + fmt(act.total) +
      '<span style="color:var(--text-faint);font-weight:500">（本金 ' + yuan(act.principal) + " · 利息 " + yuan(act.interest) + "）</span></div>"
      : '<div style="font-size:12px;color:var(--text-muted);margin-bottom:8px">点任意一个月看它要还哪些债务，再点一次收起</div>') +
    '<div class="awrap"><div class="agrid">' +
      [0, 0.5, 1].map(function (f) {
        return '<div class="gridline" style="bottom:' + f * 100 + '%"><span class="num">' + (f === 0 ? "0" : fmt(top * f)) + "</span></div>";
      }).join("") + "</div>" +
    '<div class="ascroll"><div class="atrack" style="min-width:' + n * P_COL + 'px">' +
      body +
      '<div class="axaxis">' + ms.map(function (m, i) {
        return '<div class="axtick' + (i === idx ? " on" : "") + '">' + monthTick(m.month) + "</div>";
      }).join("") + "</div>" +
    "</div></div></div>" +
    '<div class="legend-inline"><span><i style="background:var(--ch-mag)"></i>本金</span>' +
      '<span><i style="background:var(--ch-cost)"></i>利息</span></div>' +
    (act && act.items.length ? '<div class="abd"><div class="abd-l">' + monthLabel(act.month) + "要还的债务</div>" +
      act.items.map(function (it) {
        return '<div class="abd-r"><span>' + it.name + '</span><span class="num">' + yuan(it.amount) + "</span></div>";
      }).join("") + "</div>" : "") +
  "</div>";
}

function hitLayer(ms) {
  return '<div class="ahit">' + ms.map(function (m, i) {
    return '<button type="button" data-act="pcol" data-i="' + i + '" aria-label="' +
      monthLabel(m.month) + "待还 ¥" + fmt(m.total) + '"></button>';
  }).join("") + "</div>";
}

function areaBody(ms, n, top, idx, act, peakIdx) {
  var H = P_H;
  function x(i) { return i + 0.5; }
  function yP(m) { return H - (m.principal / top) * H; }
  function yT(m) { return H - (m.total / top) * H; }

  var pLine = ms.map(function (m, i) { return (i ? "L" : "M") + x(i).toFixed(2) + " " + yP(m).toFixed(2); }).join(" ");
  var tLine = ms.map(function (m, i) { return (i ? "L" : "M") + x(i).toFixed(2) + " " + yT(m).toFixed(2); }).join(" ");
  var pArea = pLine + " L" + x(n - 1).toFixed(2) + " " + H + " L" + x(0).toFixed(2) + " " + H + " Z";
  var iArea = tLine + " " +
    ms.slice().reverse().map(function (m, k) { var i = n - 1 - k; return "L" + x(i).toFixed(2) + " " + yP(m).toFixed(2); }).join(" ") + " Z";

  var dots = "";
  if (act) {
    var lx = (x(idx) / n) * 100;
    dots =
      '<span class="amark" style="left:' + lx + '%"></span>' +
      '<span class="adot total" style="left:' + lx + "%;bottom:" + (1 - yT(act) / H) * 100 + '%"></span>' +
      (act.principal > 0 ? '<span class="adot prin" style="left:' + lx + "%;bottom:" + (1 - yP(act) / H) * 100 + '%"></span>' : "");
  }

  // 峰值标注：定位到曲线顶点。x 用跟 SVG 采样点/命中格子同一套坐标 (i+0.5)/n，
  // y 用 total 那条线的高度（面积图的"总高"就是这个月的还款压力）。
  var peakMark = "";
  if (peakIdx >= 0 && peakIdx < n) {
    var pk = ms[peakIdx];
    peakMark = '<span class="apeak' + (peakIdx === idx ? " dim" : "") + '" style="left:' +
      ((x(peakIdx) / n) * 100) + "%;bottom:" + ((1 - yT(pk) / H) * 100) + '%">峰值</span>';
  }

  return '<div class="achart">' +
    '<svg viewBox="0 0 ' + n + " " + H + '" preserveAspectRatio="none">' +
      '<path d="' + pArea + '" fill="var(--ch-mag)" fill-opacity="0.85"/>' +
      '<path d="' + iArea + '" fill="var(--ch-cost)" fill-opacity="0.85"/>' +
      '<path d="' + pLine + '" fill="none" stroke="var(--ch-mag)" stroke-width="1.6" vector-effect="non-scaling-stroke"/>' +
      '<path d="' + tLine + '" fill="none" stroke="var(--ch-cost)" stroke-width="2" vector-effect="non-scaling-stroke"/>' +
    "</svg>" + dots + peakMark + hitLayer(ms) +
  "</div>";
}

/* 柱状模式：B 第一版那套原样保留（峰值月带"峰值"标注、选中时其余变暗）。
   柱子本身就是 <button>，不需要额外的命中层。 */
function barBody(ms, n, top, idx, peakIdx) {
  return '<div class="pbars">' + ms.map(function (m, i) {
    var bp = (m.total / top) * 100, sp = m.principal + m.interest;
    var pH = sp <= 0 ? bp : bp * (m.principal / sp), iH = sp <= 0 ? 0 : bp * (m.interest / sp);
    var cls = "pcol" + (i === peakIdx ? " peak" : "") + (i === idx ? " active" : "") +
      (idx >= 0 && i !== idx ? " dimmed" : "");
    return '<button class="' + cls + '" type="button" data-act="pcol" data-i="' + i + '" aria-label="' +
      monthLabel(m.month) + "待还 ¥" + fmt(m.total) + '">' +
      '<div class="pstack"><div class="seg p" style="height:' + pH + '%"></div>' +
      '<div class="seg i' + (iH <= 0 ? " zero" : "") + '" style="height:' + iH + '%"></div></div></button>';
  }).join("") + "</div>";
}

function rankRow(d, i, max) {
  var hi = d.rate >= HI;
  return '<div class="rank-row"><div class="rank-no">' + (i + 1) + "</div>" +
    '<div class="rank-main"><div class="rank-nm">' + d.name + (hi ? '<span class="rank-tag hi">高息</span>' : "") + "</div>" +
      '<div class="rank-bar"><i style="width:' + (d.balance / max) * 100 + "%;background:" + (hi ? "var(--risk)" : "var(--calm)") + '"></i></div></div>' +
    '<div class="rank-amt"><div class="a">¥' + fmt(d.balance) + '</div><div class="r">' + d.rate.toFixed(2) + "%</div></div></div>";
}

/* ===========================================================================
   ⑥ 可拖拽旋转的饼图，数据标签标在图上（文字始终水平）
   ---------------------------------------------------------------------------
   · 标签放不进扇区内部（"信用卡分期 27%"约 78px，扇区内圈只有几十 px），所以放在
     饼外、用一条引线连回扇区，位置跟着扇区一起转。
   · **文字本身不跟着倒**——转到下半圈时如果整体旋转，字会是倒的，得歪头看。
     标签容器只改 left/top，不加 rotate。
   · 旋转是直接改 DOM（transform + 标签坐标），不走 render()——render() 会重建
     innerHTML，拖拽过程中重建会把手势打断。
   · 触摸走 Touch Events + {passive:false}：React 合成事件/passive 监听里
     preventDefault 拦不住原生滚动，这是这个项目反复踩过的坑。
   =========================================================================== */
// r / gap 是按**实测**的标签宽度定的，不是估的：Playwright 量出来标签盒最宽 70.5px
// （"信用卡分期" + "27% ¥16,208"，中文实际渲染比按字号×字数估的窄不少）。
// 容器半边 163px，减去标签 70.5 和 gap 8，还要留 8px 呼吸空间 → r ≈ 76。
// 比第一版的 62 大 23%，同时标签不会压到饼上（有回归检查盯着这条，见 README）。
var PIE = { r: 76, gap: 8, elbow: 16, mids: [], slices: [] };
var PIE_H = 262;     // .pie-wrap 的高度，跟 CSS 里那条保持一致

function pieHtml(r) {
  var total = r.totalBalance || 1;
  var acc = 0;
  PIE.mids = []; PIE.slices = [];
  r.typeList.forEach(function (t, i) {
    var a0 = (acc / total) * 360; acc += t.value;
    var a1 = (acc / total) * 360;
    PIE.mids.push((a0 + a1) / 2);
    PIE.slices.push({ a0: a0, a1: a1, i: i });
  });

  var labs = r.typeList.map(function (t, i) {
    return '<span class="pie-lab" data-li="' + i + '">' +
        '<span class="n"><i style="background:var(--pie-' + (i + 1) + ')"></i>' + t.name + "</span>" +
        '<span class="v">' + Math.round((t.value / total) * 100) + "% ¥" + fmt(t.value) + "</span></span>";
  }).join("");

  // 扇区/引线/中心孔都在 mountPie() 里按容器实测宽度生成——写死 viewBox 坐标的话，
  // 容器宽度一变（真机 360/390/412 各不相同），标签跟扇区就对不上了。
  return '<div class="plot-box"><div class="pie-wrap" id="pieRoot">' +
    '<svg class="pie-svg" id="pieSvg"><g id="pieG"></g><g id="pieLeads"></g><circle id="pieHub" class="pie-hub"/></svg>' +
    '<div class="pie-center"><div class="k">总负债</div><div class="v">¥' + fmt(total) + "</div></div>" +
    labs +
  "</div></div>";
}

function arcPath(cx, cy, r, a0, a1) {
  if (a1 - a0 >= 359.99) {  // 只有一个类型时画整圆，arc 画不出 360°
    return "M" + cx + "," + (cy - r) + " A" + r + "," + r + " 0 1 1 " + (cx - 0.01) + "," + (cy - r) + " Z";
  }
  var p0 = polar(cx, cy, r, a0), p1 = polar(cx, cy, r, a1);
  var large = a1 - a0 > 180 ? 1 : 0;
  return "M" + cx + "," + cy + " L" + p0[0].toFixed(2) + "," + p0[1].toFixed(2) +
    " A" + r + "," + r + " 0 " + large + " 1 " + p1[0].toFixed(2) + "," + p1[1].toFixed(2) + " Z";
}
function polar(cx, cy, r, deg) {
  var a = (deg - 90) * Math.PI / 180;      // 0° 指向 12 点，顺时针为正
  return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
}

function mountPie() {
  var root = document.getElementById("pieRoot");
  if (!root) return;
  var svg = document.getElementById("pieSvg");
  var g = document.getElementById("pieG");
  var leadG = document.getElementById("pieLeads");
  var hub = document.getElementById("pieHub");
  var labs = root.querySelectorAll(".pie-lab");
  var LAB_H = 34;   // 标签盒的近似高度，用来做同侧避让和上下边界钳制

  function apply() {
    var W = root.clientWidth, H = PIE_H;
    if (!W) return;
    var cx = W / 2, cy = H / 2, r = PIE.r;
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);

    // 扇区（整组跟着 pieRot 转）
    g.setAttribute("transform", "rotate(" + state.pieRot + " " + cx + " " + cy + ")");
    g.innerHTML = PIE.slices.map(function (s) {
      return '<path class="pie-slice" d="' + arcPath(cx, cy, r, s.a0, s.a1) + '" fill="var(--pie-' + (s.i + 1) + ')"/>';
    }).join("");
    hub.setAttribute("cx", cx); hub.setAttribute("cy", cy); hub.setAttribute("r", r * 0.58);

    /* 标签：**贴容器左右边缘**，不是"沿半径方向直着往外放"。
       这样水平空间跟扇区角度无关，饼才能做大（见这一节顶部的注释）。
       先按角度算出每个标签想待的 y，再按左右分组做避让。 */
    var items = [];
    for (var i = 0; i < labs.length; i++) {
      var deg = PIE.mids[i] + state.pieRot;
      var rad = (deg - 90) * Math.PI / 180;
      var cos = Math.cos(rad), sin = Math.sin(rad);
      items.push({
        el: labs[i], i: i, cos: cos, sin: sin,
        side: cos >= 0 ? "r" : "l",
        ax: cx + cos * (r + 1), ay: cy + sin * (r + 1),          // 引线起点（扇区边缘）
        bx: cx + cos * (r + PIE.elbow), by: cy + sin * (r + PIE.elbow), // 折点
        want: cy + sin * (r + PIE.elbow)                          // 期望的标签中心 y
      });
    }
    ["l", "r"].forEach(function (side) {
      var grp = items.filter(function (x) { return x.side === side; })
                     .sort(function (a, b) { return a.want - b.want; });
      var minY = LAB_H / 2 + 2, maxY = H - LAB_H / 2 - 2, prev = -Infinity;
      grp.forEach(function (x) {                       // 从上往下推开
        x.y = Math.max(minY, Math.max(x.want, prev + LAB_H));
        prev = x.y;
      });
      for (var k = grp.length - 1; k >= 0; k--) {      // 顶到底了再从下往上回推
        if (grp[k].y > maxY) grp[k].y = maxY;
        if (k > 0 && grp[k].y - grp[k - 1].y < LAB_H) grp[k - 1].y = grp[k].y - LAB_H;
      }
      grp.forEach(function (x) { x.y = Math.max(minY, x.y); });
    });

    leadG.innerHTML = items.map(function (x) {
      var edgeX = x.side === "r" ? W - PIE.gap : PIE.gap;
      var el = x.el;
      el.style.top = (x.y - LAB_H / 2) + "px";
      if (x.side === "r") { el.style.right = PIE.gap + "px"; el.style.left = "auto"; el.style.textAlign = "right"; el.classList.add("r"); }
      else { el.style.left = PIE.gap + "px"; el.style.right = "auto"; el.style.textAlign = "left"; el.classList.remove("r"); }
      // 折线引线：扇区边缘 → 斜出一小段 → 水平拉到标签那一侧（参考图就是这个画法）
      return '<path class="pie-lead" d="M' + x.ax.toFixed(1) + " " + x.ay.toFixed(1) +
        " L" + x.bx.toFixed(1) + " " + x.by.toFixed(1) +
        " L" + edgeX.toFixed(1) + " " + x.y.toFixed(1) + '"/>';
    }).join("");
  }

  /* 拖拽：按角度增量转，抬手后有一点惯性（衰减 0.94） */
  var dragging = false, lastAng = 0, vel = 0, raf = 0;
  function angOf(cx, cy) {
    var b = root.getBoundingClientRect();
    return Math.atan2(cy - (b.top + b.height / 2), cx - (b.left + b.width / 2)) * 180 / Math.PI;
  }
  function start(cx, cy) { dragging = true; lastAng = angOf(cx, cy); vel = 0; cancelAnimationFrame(raf); }
  function move(cx, cy) {
    if (!dragging) return;
    var a = angOf(cx, cy), d = a - lastAng;
    if (d > 180) d -= 360; else if (d < -180) d += 360;
    state.pieRot += d; vel = d; lastAng = a; apply();
  }
  function end() {
    if (!dragging) return;
    dragging = false;
    (function spin() {
      vel *= 0.94;
      if (Math.abs(vel) < 0.08) return;
      state.pieRot += vel; apply();
      raf = requestAnimationFrame(spin);
    })();
  }

  root.addEventListener("touchstart", function (e) {
    start(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });
  root.addEventListener("touchmove", function (e) {
    if (!dragging) return;
    e.preventDefault();          // 拦掉原生纵向滚动，必须 passive:false 才生效
    move(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: false });
  root.addEventListener("touchend", end);
  root.addEventListener("touchcancel", end);
  root.addEventListener("pointerdown", function (e) {
    if (e.pointerType !== "mouse") return;   // 触摸走上面那套，避免两边重复处理
    start(e.clientX, e.clientY); root.setPointerCapture(e.pointerId);
  });
  root.addEventListener("pointermove", function (e) { if (e.pointerType === "mouse") move(e.clientX, e.clientY); });
  root.addEventListener("pointerup", function (e) { if (e.pointerType === "mouse") end(); });

  apply();
  window.addEventListener("resize", apply);
}

/* 监听器只绑一次，绑在不会被 render() 替换掉的 #app 上（render 只改 innerHTML）。
   写成"每次 render 末尾 addEventListener + {once:true}"的话，一次点在空白处
   就会把它消耗掉，之后全部失效。 */
document.getElementById("app").addEventListener("click", function (e) {
  var t = e.target.closest("[data-act]");
  if (!t) return;
  var a = t.getAttribute("data-act");
  if (a === "more") state.showAll = !state.showAll;
  if (a === "pcol") { var i = +t.getAttribute("data-i"); state.pIdx = state.pIdx === i ? -1 : i; }
  // 切换图形时保留当前选中的月份（换个画法看同一个月，不该把选择清掉）
  if (a === "pmode") state.pMode = t.getAttribute("data-m");
  render();
});

render();
</script>
</body>
</html>
