name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - run: npm install

      - name: calc.js unit tests (node:test)
        run: npm test

      - name: React component tests (Vitest)
        run: npm run test:react

      - name: TypeScript type check (react/)
        run: npx tsc --noEmit --project react/tsconfig.json

      - name: React build (Vite multi-entry)
        run: npm run build:react

  # Flutter重写(flutter/)的CI——跟上面的Capacitor/React部分完全独立，两边互不影响。
  # 只跑Android能覆盖的部分(analyze+test纯命令行、不需要模拟器)；iOS要macOS runner，
  # 等flutter/里有实际iOS相关产出后再加，现在加了也测不出什么，纯粹多花CI分钟数。
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
        with:
          # parity validator 要读取 manifest 中冻结的旧版基准提交及其 tree。
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: flutter/tool/parity/requirements.txt

      - run: flutter pub get

      - name: 安装全量对齐证据工具依赖
        run: python -m pip install -r tool/parity/requirements.txt

      - name: 阶段8契约矩阵、fixture与源码完整性门禁
        run: |
          python tool/parity/catalog.py --check
          python tool/parity/parity_tool.py validate
          python tool/parity/parity_tool.py render --check
          python -m unittest discover -s tool/parity/tests -p 'test_*.py' -v
          python -m py_compile tool/parity/catalog.py tool/parity/parity_tool.py tool/parity/android_capture.py
          node --check tool/parity/cdp_capture.mjs

      - name: 静态分析
        run: flutter analyze

      - name: 单元/组件测试
        run: flutter test

  # 死规则门禁：Flutter重写期间禁止修改旧版代码（见AGENTS.md"硬性铁律"第7条）。
  # 只有当提交信息含 flutter/重写/rewrite 关键词、且改动触及受保护旧版文件时判红；
  # 用户明确批准的旧版改动（含阶段9切换）需在提交信息里带 `legacy-ok` 标记绕过。
  legacy-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 检查重写相关提交是否污染旧版文件
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only HEAD^1 HEAD || true)
            MSGS="${{ github.event.pull_request.title }}"
          else
            BEFORE="${{ github.event.before }}"
            SHA="${{ github.sha }}"
            if [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              CHANGED=$(git diff --name-only "$BEFORE".."$SHA" || true)
              MSGS=$(git log --format=%s "$BEFORE".."$SHA" || true)
            else
              CHANGED=$(git diff-tree --no-commit-id --name-only -r "$SHA" || true)
              MSGS=$(git log -1 --format=%s "$SHA" || true)
            fi
          fi
          # 用户明确批准的旧版改动标记（含阶段9切换），放行
          if printf '%s' "$MSGS" | grep -qi 'legacy-ok'; then
            echo "检测到 legacy-ok 标记，跳过旧版文件检查"
            exit 0
          fi
          # 只拦截"重写相关"提交：提交信息含 flutter/重写/rewrite
          if ! printf '%s' "$MSGS" | grep -qiE 'flutter|重写|rewrite'; then
            echo "非重写相关提交，不检查"
            exit 0
          fi
          VIOLATIONS=()
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              www/*) if [[ "$f" != www/js/react-debts/* ]]; then VIOLATIONS+=("$f"); fi ;;
              react/*) VIOLATIONS+=("$f") ;;
              android/*) if [[ "$f" != android/app/src/main/assets/* ]]; then VIOLATIONS+=("$f"); fi ;;
              cloudbase/*) VIOLATIONS+=("$f") ;;
              capacitor.config.json|package.json|package-lock.json) VIOLATIONS+=("$f") ;;
            esac
          done <<< "$CHANGED"
          if [ ${#VIOLATIONS[@]} -gt 0 ]; then
            echo "::error::Flutter 重写相关提交触碰了受保护的旧版文件（见 AGENTS.md 硬性铁律第7条）："
            printf '::error::  %s\n' "${VIOLATIONS[@]}"
            echo "如需对旧版做用户批准的改动，请在提交信息中加入 legacy-ok 标记。"
            exit 1
          fi
          echo "未发现旧版污染"
